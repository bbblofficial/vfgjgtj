name: 🦙 Local LLM & Image Studio (macOS Apple Silicon / MLX)

on:
  workflow_dispatch:
    inputs:
      port:
        description: '🔌 Web UI port'
        required: false
        default: '7860'
        type: string
      context_size:
        description: '📝 Context window (tokens)'
        required: false
        default: '4096'
        type: string

permissions:
  contents: read

concurrency:
  group: llama-web-ui
  cancel-in-progress: true

jobs:
  deploy-llama:
    runs-on: macos-latest
    timeout-minutes: 360
    env:
      CONTEXT_SIZE: ${{ inputs.context_size }}
      PORT: ${{ inputs.port }}
      OLLAMA_MODELS: /Users/runner/ollama_models

    steps:
      - name: 🦙 Show banner
        run: |
          echo "╔═══════════════════════════════════════════════════════════════════╗"
          echo "║   🦙  M A C O S   A P P L E   S I L I C O N   ( M L X )           ║"
          echo "╚═══════════════════════════════════════════════════════════════════╝"
          echo "  📝 Context: ${CONTEXT_SIZE} tokens"
          echo "  🔌 Port:    ${PORT}"
          echo "  🏃 Runner:  $(uname -a)"
          echo "  🧠 Chip:    $(sysctl -n machdep.cpu.brand_string 2>/dev/null || uname -m)"
          echo "  💽 Disk status:"
          df -h / | tail -1
          mkdir -p /Users/runner/ollama_models

      - name: ⚡ Maximize System Memory & Kill Background Bloat
        run: |
          echo "──────────────────────────────────────────"
          echo " ⚡  Optimizing macOS Memory"
          echo "──────────────────────────────────────────"
          sudo sysctl -w vm.compressor_mode=4 2>/dev/null || true
          # کشتن پروسه‌های سنگین پس‌زمینه مکینتاش که نیازی به آن‌ها نیست برای باز شدن رم
          sudo pkill -f "Spotlight" 2>/dev/null || true
          sudo pkill -f "mds" 2>/dev/null || true
          sudo pkill -f "com.apple.coreservices.launchservicesd" 2>/dev/null || true
          echo "  🧠 Memory ready:"
          vm_stat | perl -ne '/page size of (\d+)/ and $size=$1; /(Pages free|Pages active|Pages inactive|Pages speculative): \s+(\d+)/ and $mem{$1}=$2*$size; END {printf "Available: %.2f GB\n", ($mem{"Pages free:"}+$mem{"Pages inactive:"}+$mem{"Pages speculative:"})/1024/1024/1024}'

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Official Ollama Bundle (Image Gen Enabled) & MLX
        run: |
          echo "──────────────────────────────────────────"
          echo " 📦  Installing Ollama Release"
          echo "──────────────────────────────────────────"
          curl -fsSL https://github.com/ollama/ollama/releases/download/v0.32.5/Ollama-darwin.zip -o /tmp/Ollama-darwin.zip
          sudo unzip -q /tmp/Ollama-darwin.zip -d /Applications/
          sudo ln -sf /Applications/Ollama.app/Contents/Resources/ollama /usr/local/bin/ollama
          rm -f /tmp/Ollama-darwin.zip

          pip install --no-cache-dir \
            fastapi uvicorn aiohttp httpx python-multipart \
            jinja2 websockets pydantic psutil mlx

          /usr/local/bin/ollama --version
          python -c "import mlx.core as mx; print('✅ MLX Framework Ready on device:', mx.default_device())"

      - name: 🚀 Start Ollama engine (Zero Overhead & Auto Swap Mode)
        run: |
          echo "──────────────────────────────────────────"
          echo " 🚀  Starting Ollama Engine with Bypass Flags"
          echo "──────────────────────────────────────────"
          export OLLAMA_MODELS="/Users/runner/ollama_models"
          export OLLAMA_HOST="0.0.0.0:11434"
          export OLLAMA_KEEP_ALIVE="24h"
          # حذف سربار حافظه تا اجازه لود مدل‌های بالای ۴ گیگابایت داده شود
          export OLLAMA_GPU_OVERHEAD=0
          export OLLAMA_MAX_LOADED_MODELS=1
          export OLLAMA_NUM_PARALLEL=1
          export OLLAMA_FLASH_ATTENTION=1
          
          nohup /Applications/Ollama.app/Contents/Resources/ollama serve > /tmp/ollama.log 2>&1 &
          echo $! > /tmp/ollama.pid
          
          echo "⏳ Waiting for Ollama engine to report healthy..."
          ready=false
          for i in $(seq 1 30); do
            if curl -sf http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "✅ Ollama Engine is live and fully ready!"
              ready=true
              break
            fi
            sleep 2
          done
          
          if [ "$ready" != "true" ]; then
            echo "❌ Ollama failed to start. Last logs:"
            tail -n 50 /tmp/ollama.log || true
            exit 1
          fi

      - name: 📥 Verify Repository state
        run: |
          echo "──────────────────────────────────────────"
          echo " 📥  Ready for on-demand downloads"
          echo "──────────────────────────────────────────"
          ollama list

      - name: 🔧 Write the web server
        run: |
          cat > ollama_server.py << 'PYEOF'
          #!/usr/bin/env python3
          import json
          import os
          import re
          import glob
          import base64
          import logging
          import platform
          import subprocess
          import asyncio
          import psutil
          from typing import Optional, List
          import httpx
          import uvicorn
          from fastapi import FastAPI, HTTPException
          from fastapi.responses import HTMLResponse, StreamingResponse
          from pydantic import BaseModel

          logging.basicConfig(level=logging.INFO)
          logger = logging.getLogger("studio-ui")

          OLLAMA_HOST = os.getenv("OLLAMA_HOST", "http://127.0.0.1:11434")
          CONTEXT_SIZE = int(os.getenv("CONTEXT_SIZE", "4096"))
          PORT = int(os.getenv("PORT", "7860"))

          app = FastAPI(title="Local Studio (MLX Hybrid)")

          CATALOG_MODELS = [
              # Image / Diffusion Models
              "x/z-image-turbo:latest",
              "x/flux2-klein:latest",
              "flux2-klein:4b",

              # Vision & OCR
              "deepseek-ocr:latest",
              "it:deepseek-ocr:latest",

              # Fine-tuned & Specialized
              "goonsai/qwen2.5-3b-goonsai-nsfw-100k:latest",
              "REOinc/REO.AI:latest",
              "MrTails/Tails-assistant-ai-v3.0.0:latest",
              "samuser3/granite3.2-gemma3:latest",
              "samuser3/granite3.2-gemma3:1b",
              "samuser3/granite3.2-gemma3:4b",
              "qwen3.8:27b",
              "parable/fable:3b",
              "parable/fable:4b",

              # Conversational & Code LLMs
              "qwen2.5:0.5b",
              "qwen2.5:1.5b",
              "qwen2.5:3b",
              "qwen2.5:7b",
              "qwen2.5-coder:0.5b",
              "qwen2.5-coder:1.5b",
              "qwen2.5-coder:3b",
              "qwen2.5-coder:7b",
              "deepseek-r1:1.5b",
              "deepseek-r1:7b",
              "deepseek-coder:1.3b",
              "deepseek-coder:6.7b",
              "llama3.2:1b",
              "llama3.2:3b",
              "tinyllama",
              "gemma2:2b",
              "phi3.5",
              "phi3:mini",
              "mistral:7b",
              "openhermes",
              "dolphin-mistral",
              "smollm:1.7b",
              "orca-mini:3b",
              "stablelm2:1.6b"
          ]

          IMAGE_MODEL_PREFIXES = ("x/z-image", "x/flux", "flux", "stable-diffusion")

          def is_image_model(model_name: str) -> bool:
              m = model_name.lower()
              return any(p in m for p in IMAGE_MODEL_PREFIXES)

          def clean_ansi(text: str) -> str:
              ansi_escape = re.compile(r'(?:\x1B[@-_]|[\x80-\x9F])[0-?]*[ -/]*[@-~]')
              text = ansi_escape.sub('', text)
              text = re.sub(r'\[\?[0-9;]*[a-zA-Z]', '', text)
              text = re.sub(r'\[[0-9;]*[a-zA-Z]', '', text)
              return text.strip()

          class ChatMessage(BaseModel):
              role: str
              content: str

          class ChatRequest(BaseModel):
              messages: List[ChatMessage]
              model: str
              temperature: Optional[float] = 0.7
              max_tokens: Optional[int] = 2048

          class PullRequest(BaseModel):
              model: str

          @app.get("/api/health")
          async def health():
              try:
                  async with httpx.AsyncClient(timeout=5) as client:
                      r = await client.get(f"{OLLAMA_HOST}/api/tags")
                      r.raise_for_status()
                  return {"status": "ok"}
              except Exception as exc:
                  raise HTTPException(status_code=503, detail=str(exc))

          @app.get("/api/sysinfo")
          def sysinfo():
              vmem = psutil.virtual_memory()
              swap = psutil.swap_memory()
              return {
                  "cpu_threads": psutil.cpu_count(logical=True),
                  "ram_total": f"{vmem.total / (1024**3):.1f} GB (Physical) + {swap.total / (1024**3):.1f} GB (Swap)",
                  "os": platform.system() + " " + platform.release() + " (Apple Silicon / MLX)"
              }

          @app.get("/api/stats")
          def stats():
              disk = psutil.disk_usage('/')
              vmem = psutil.virtual_memory()
              return {
                  "cpu_percent": psutil.cpu_percent(interval=None),
                  "ram_percent": vmem.percent,
                  "ram_used": f"{vmem.used / (1024**3):.1f} GB",
                  "disk_free": f"{disk.free / (1024**3):.1f} GB"
              }

          @app.get("/api/models")
          async def list_models():
              try:
                  async with httpx.AsyncClient(timeout=10) as client:
                      r = await client.get(f"{OLLAMA_HOST}/api/tags")
                      r.raise_for_status()
                      data = r.json()
                      downloaded_raw = [m["name"] for m in data.get("models", [])]
                      downloaded = set(downloaded_raw)
                      
                      for m in downloaded_raw:
                          if m.endswith(":latest"):
                              downloaded.add(m[:-7])
                          else:
                              downloaded.add(f"{m}:latest")
                      
                      all_models = list(dict.fromkeys(downloaded_raw + CATALOG_MODELS))
                      result = []
                      for m in all_models:
                          result.append({
                              "name": m,
                              "downloaded": m in downloaded,
                              "type": "image" if is_image_model(m) else "text"
                          })
                      return {"models": result}
              except Exception as exc:
                  raise HTTPException(status_code=503, detail=str(exc))

          @app.post("/api/pull")
          async def pull_model(request: PullRequest):
              async def generate():
                  cmd = ["/Applications/Ollama.app/Contents/Resources/ollama", "pull", request.model]
                  env = os.environ.copy()
                  env["OLLAMA_MODELS"] = "/Users/runner/ollama_models"
                  
                  proc = await asyncio.create_subprocess_exec(
                      *cmd,
                      stdout=asyncio.subprocess.PIPE,
                      stderr=asyncio.subprocess.STDOUT,
                      env=env
                  )
                  
                  pct_pattern = re.compile(r'(\d+)%')
                  speed_pattern = re.compile(r'([0-9\.]+\s*(?:KB|MB|GB)/s)')
                  size_pattern = re.compile(r'([0-9\.]+\s*(?:KB|MB|GB)\s*/\s*[0-9\.]+\s*(?:KB|MB|GB))')
                  eta_pattern = re.compile(r'(\d+[m|s]\w*)')
                  
                  buffer = ""
                  try:
                      while True:
                          chunk = await proc.stdout.read(128)
                          if not chunk:
                              break
                          buffer += chunk.decode('utf-8', errors='ignore')
                          
                          while '\r' in buffer or '\n' in buffer:
                              delim = '\r' if '\r' in buffer else '\n'
                              part, buffer = buffer.split(delim, 1)
                              cleaned = clean_ansi(part)
                              if not cleaned:
                                  continue
                              
                              pct_match = pct_pattern.search(cleaned)
                              pct = int(pct_match.group(1)) if pct_match else None
                              speed_match = speed_pattern.search(cleaned)
                              speed = speed_match.group(1) if speed_match else ""
                              size_match = size_pattern.search(cleaned)
                              size = size_match.group(1) if size_match else ""
                              eta_match = eta_pattern.search(cleaned)
                              eta = eta_match.group(1) if eta_match else ""
                              
                              msg = {
                                  "raw": cleaned,
                                  "percent": pct,
                                  "speed": speed,
                                  "size": size,
                                  "eta": eta
                              }
                              yield f"data: {json.dumps(msg)}\n\n"
                      
                      await proc.wait()
                      if proc.returncode == 0:
                          yield f"data: {json.dumps({'status': 'Completed successfully!', 'percent': 100})}\n\n"
                      else:
                          yield f"data: {json.dumps({'error': f'Pull process failed with exit code {proc.returncode}'})}\n\n"
                  except Exception as e:
                      yield f"data: {json.dumps({'error': str(e)})}\n\n"
                  
                  yield "data: [DONE]\n\n"

              return StreamingResponse(
                  generate(), 
                  media_type="text/event-stream",
                  headers={
                      "Cache-Control": "no-cache",
                      "Connection": "keep-alive",
                      "X-Accel-Buffering": "no"
                  }
              )

          @app.get("/", response_class=HTMLResponse)
          async def root():
              return HTML_TEMPLATE

          @app.post("/api/chat")
          async def chat(request: ChatRequest):
              async def generate():
                  try:
                      if is_image_model(request.model):
                          prompt = request.messages[-1].content if request.messages else ""
                          notice = f"🎨 Generating image with **{request.model}**...\n\n"
                          yield f"data: {json.dumps({'content': notice})}\n\n"

                          before_images = set(glob.glob("*.png") + glob.glob("*.jpg") + glob.glob("*.jpeg"))
                          
                          cmd = ["/Applications/Ollama.app/Contents/Resources/ollama", "run", request.model, prompt]
                          process = subprocess.run(cmd, capture_output=True, text=True, timeout=600)
                          
                          after_images = set(glob.glob("*.png") + glob.glob("*.jpg") + glob.glob("*.jpeg"))
                          new_images = list(after_images - before_images)
                          
                          if new_images:
                              latest_img = new_images[-1]
                              with open(latest_img, "rb") as f:
                                  b64_data = base64.b64encode(f.read()).decode("utf-8")
                              img_md = f"![Generated Image](data:image/png;base64,{b64_data})\n\n*Saved as: `{latest_img}`*"
                              yield f"data: {json.dumps({'content': img_md})}\n\n"
                          elif process.stdout:
                              cleaned_stdout = clean_ansi(process.stdout)
                              yield f"data: {json.dumps({'content': cleaned_stdout})}\n\n"
                          elif process.stderr:
                              cleaned_stderr = clean_ansi(process.stderr)
                              yield f"data: {json.dumps({'error': cleaned_stderr})}\n\n"
                          else:
                              yield f"data: {json.dumps({'content': 'Image generation finished.'})}\n\n"

                          yield "data: [DONE]\n\n"
                          return

                      ollama_messages = [{"role": m.role, "content": m.content} for m in request.messages]
                      async with httpx.AsyncClient(timeout=300) as client:
                          async with client.stream(
                              "POST",
                              f"{OLLAMA_HOST}/api/chat",
                              json={
                                  "model": request.model,
                                  "messages": ollama_messages,
                                  "stream": True,
                                  "options": {
                                      "temperature": request.temperature,
                                      "num_predict": request.max_tokens,
                                      "num_ctx": CONTEXT_SIZE,
                                  },
                              },
                          ) as response:
                              if response.status_code != 200:
                                  body = await response.aread()
                                  err_text = clean_ansi(body.decode(errors='ignore'))
                                  yield f"data: {json.dumps({'error': err_text})}\n\n"
                                  yield "data: [DONE]\n\n"
                                  return
                              async for line in response.aiter_lines():
                                  line = line.strip()
                                  if not line:
                                      continue
                                  try:
                                      obj = json.loads(line)
                                  except json.JSONDecodeError:
                                      continue
                                  if err := obj.get("error"):
                                      yield f"data: {json.dumps({'error': clean_ansi(err)})}\n\n"
                                      continue
                                  content = obj.get("message", {}).get("content")
                                  if content:
                                      yield f"data: {json.dumps({'content': content})}\n\n"
                  except Exception as exc:
                      logger.exception("execution error")
                      yield f"data: {json.dumps({'error': clean_ansi(str(exc))})}\n\n"
                  yield "data: [DONE]\n\n"
              return StreamingResponse(generate(), media_type="text/event-stream")

          HTML_TEMPLATE = r'''
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Local Studio (MLX Hybrid)</title>
          
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
          
          <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
          <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
          <link id="hljsTheme" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
          <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
          <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
          <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
          <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
          
          <style>
            :root {
              --bg: #09090b;
              --sidebar: rgba(18, 18, 23, 0.75);
              --border: rgba(255, 255, 255, 0.08);
              --border-focus: rgba(6, 182, 212, 0.4);
              --text: #f4f4f5;
              --text-secondary: #a1a1aa;
              --text-muted: #71717a;
              --accent: #10b981;
              --accent-glow: rgba(16, 185, 129, 0.25);
              --cyan: #06b6d4;
              --cyan-glow: rgba(6, 182, 212, 0.25);
              --purple: #a855f7;
              --purple-glow: rgba(168, 85, 247, 0.2);
              --user-bg: rgba(6, 182, 212, 0.04);
              --input-bg: rgba(24, 24, 30, 0.85);
              --code-bg: rgba(0, 0, 0, 0.5);
              --danger: #ef4444;
              --ok: #10b981;
              --glass: blur(20px);
            }
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body {
              background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden;
              font-family: 'Inter', 'Vazirmatn', -apple-system, sans-serif;
              background-image: radial-gradient(circle at 10% 20%, rgba(16, 185, 129, 0.05), transparent 30%),
                                radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.05), transparent 30%);
            }
            .sidebar {
              width: 325px; background: var(--sidebar); border-right: 1px solid var(--border);
              backdrop-filter: var(--glass); -webkit-backdrop-filter: var(--glass);
              display: flex; flex-direction: column; padding: 22px 18px; flex-shrink: 0; z-index: 10;
              overflow-y: auto;
            }
            .brand-header {
              display: flex; align-items: center; gap: 10px; margin-bottom: 20px; padding: 0 4px;
            }
            .brand-logo {
              width: 30px; height: 30px; border-radius: 8px;
              background: linear-gradient(135deg, var(--cyan), var(--accent));
              display: flex; align-items: center; justify-content: center;
              font-weight: 700; color: #fff; font-size: 15px; box-shadow: 0 0 15px var(--cyan-glow);
            }
            .brand-name { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; color: #fff; }
            .brand-badge {
              font-size: 10px; background: rgba(6, 182, 212, 0.15); color: var(--cyan);
              border: 1px solid rgba(6, 182, 212, 0.3); border-radius: 4px; padding: 1px 5px; font-weight: 600;
            }
            .new-chat-btn {
              display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 11px;
              background: var(--input-bg); border: 1px solid var(--border); border-radius: 12px; color: var(--text);
              font-size: 13px; font-weight: 500; cursor: pointer; margin-bottom: 18px;
              transition: all 0.2s ease; font-family: inherit;
            }
            .new-chat-btn:hover { border-color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); color: #fff; }
            
            .settings-group { display: flex; flex-direction: column; gap: 14px; font-size: 13px; color: var(--text-secondary); }
            .settings-group label { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 500; }
            .settings-group input[type="range"] { width: 100%; accent-color: var(--cyan); margin-top: 5px; }
            
            .model-section-title {
              font-weight: 600; color: var(--text); font-size: 12px; text-transform: uppercase;
              letter-spacing: 0.5px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
            }
            .model-list {
              background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 12px;
              max-height: 250px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; padding: 6px;
            }
            .model-item {
              display: flex; align-items: center; justify-content: space-between; padding: 8px 10px;
              border-radius: 8px; font-size: 12px; cursor: pointer; transition: all 0.2s; border: 1px solid transparent;
            }
            .model-item:hover { background: rgba(255,255,255,0.04); }
            .model-item.active { background: rgba(6, 182, 212, 0.12); border-color: rgba(6, 182, 212, 0.35); }
            .model-meta { display: flex; flex-direction: column; gap: 3px; overflow: hidden; }
            .model-name { font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 155px; }
            .model-badges { display: flex; align-items: center; gap: 5px; }
            .model-type-badge { font-size: 9px; padding: 1px 5px; border-radius: 4px; font-weight: 600; text-transform: uppercase; }
            .model-type-badge.image { background: rgba(168, 85, 247, 0.18); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.3); }
            .model-type-badge.text { background: rgba(6, 182, 212, 0.15); color: #38bdf8; border: 1px solid rgba(6, 182, 212, 0.3); }
            .model-status { font-size: 10px; font-weight: 500; }
            .model-status.ready { color: var(--ok); }
            .model-status.pending { color: var(--text-muted); }
            .dl-btn {
              background: rgba(16, 185, 129, 0.15); border: 1px solid var(--accent); color: var(--accent);
              padding: 4px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; transition: all 0.2s; flex-shrink: 0; font-weight: 600;
            }
            .dl-btn:hover { background: var(--accent); color: #fff; box-shadow: 0 0 10px var(--accent-glow); }
            .dl-btn:disabled { opacity: 0.5; cursor: not-allowed; }

            .system-stats {
              background: rgba(0,0,0,0.3); border: 1px solid var(--border);
              border-radius: 12px; padding: 12px; margin-top: 6px;
              font-size: 12px; display: flex; flex-direction: column; gap: 8px;
            }
            .stat-title { font-weight: 600; color: var(--text); font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; }
            .stat-row { display: flex; justify-content: space-between; align-items: center; }
            .stat-value { font-family: 'JetBrains Mono', monospace; font-size: 12px; }
            #sysSpecs { color: var(--text-muted); font-size: 11px; line-height: 1.4; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 6px; }
            .progress-bar { width: 100%; height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; margin-top: 3px; }
            .progress-fill { height: 100%; transition: width 0.3s ease; }
            
            .sidebar-footer {
              margin-top: auto; border-top: 1px solid var(--border); padding-top: 14px;
              font-size: 12px; color: var(--text-secondary); display: flex; flex-direction: column; gap: 8px;
            }
            .model-tag {
              background: rgba(6, 182, 212, 0.1); color: var(--cyan); padding: 5px 10px;
              border-radius: 6px; font-weight: 600; width: fit-content; border: 1px solid rgba(6, 182, 212, 0.25);
              max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            }
            .status-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; }
            .status-dot.ok { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
            .status-dot.bad { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
            
            .main-content { flex: 1; display: flex; flex-direction: column; height: 100vh; position: relative; }
            .chat-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; padding: 20px 0 150px 0; scroll-behavior: smooth; }
            
            .message-row {
              width: 100%; display: flex; justify-content: center; padding: 22px 20px;
              border-bottom: 1px solid rgba(255,255,255,0.02); animation: fadeIn 0.25s ease-out;
            }
            @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
            .message-row.user { background: var(--user-bg); }
            .message-row.error .message-body { color: var(--danger); }
            
            .message-inner { max-width: 820px; width: 100%; display: flex; gap: 16px; line-height: 1.7; font-size: 15px; }
            .avatar {
              width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
              font-size: 15px; font-weight: 600; flex-shrink: 0; color: #fff;
            }
            .avatar.user { background: linear-gradient(135deg, var(--cyan), #0284c7); box-shadow: 0 2px 10px rgba(6, 182, 212, 0.3); }
            .avatar.assistant { background: linear-gradient(135deg, var(--accent), #059669); box-shadow: 0 2px 10px rgba(16, 185, 129, 0.3); }
            
            .message-body { flex: 1; overflow-x: auto; min-width: 0; padding-top: 3px; }
            .message-body p { margin: 0 0 14px; }
            .message-body p:last-child { margin-bottom: 0; }
            .message-body img { max-width: 100%; height: auto; border-radius: 12px; margin: 12px 0; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
            .message-body pre {
              background: var(--code-bg); color: #e2e8f0; padding: 36px 16px 16px; border-radius: 10px;
              overflow-x: auto; margin: 16px 0; border: 1px solid var(--border); position: relative;
            }
            .message-body code { font-family: 'JetBrains Mono', monospace; font-size: 13px; background: rgba(255,255,255,0.08); padding: 2px 5px; border-radius: 4px; }
            .message-body pre code { background: transparent; padding: 0; }
            .code-lang { position: absolute; top: 9px; left: 14px; font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
            .copy-btn {
              position: absolute; top: 8px; right: 8px; background: rgba(255,255,255,0.08); border: 1px solid var(--border);
              color: #cbd5e1; font-size: 11px; padding: 4px 8px; border-radius: 5px; cursor: pointer; transition: 0.2s;
            }
            .copy-btn:hover { background: rgba(255,255,255,0.18); color: #fff; }
            
            .input-area-wrapper {
              position: absolute; bottom: 0; left: 0; width: 100%;
              background: linear-gradient(180deg, transparent 0%, var(--bg) 40%);
              padding: 24px; display: flex; justify-content: center;
            }
            .input-box {
              max-width: 820px; width: 100%; background: var(--input-bg); border: 1px solid var(--border);
              border-radius: 16px; box-shadow: 0 10px 35px rgba(0,0,0,0.6); display: flex; align-items: flex-end;
              padding: 12px 16px; gap: 12px; backdrop-filter: var(--glass); -webkit-backdrop-filter: var(--glass);
              transition: border-color 0.25s ease;
            }
            .input-box:focus-within { border-color: var(--accent); }
            .input-box textarea {
              flex: 1; background: transparent; border: none; color: var(--text); font-family: inherit;
              font-size: 14.5px; resize: none; outline: none; max-height: 200px; min-height: 26px; line-height: 26px;
            }
            .input-box textarea::placeholder { color: var(--text-muted); }
            .send-btn, .stop-btn {
              border: none; border-radius: 10px; width: 38px; height: 38px; display: flex; align-items: center;
              justify-content: center; color: #fff; cursor: pointer; transition: all 0.2s; flex-shrink: 0; font-size: 16px;
            }
            .send-btn { background: var(--accent); box-shadow: 0 2px 10px var(--accent-glow); }
            .stop-btn { background: var(--danger); display: none; box-shadow: 0 2px 10px rgba(239, 68, 68, 0.3); }
            .send-btn:hover { background: #059669; transform: translateY(-1px); }
            .stop-btn:hover { background: #dc2626; transform: translateY(-1px); }
            .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
            
            .modal-overlay {
              position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
              display: none; align-items: center; justify-content: center; z-index: 100;
            }
            .modal-box {
              background: #141419; border: 1px solid var(--border); border-radius: 18px;
              width: 92%; max-width: 540px; padding: 24px; display: flex; flex-direction: column; gap: 18px;
              box-shadow: 0 25px 60px rgba(0,0,0,0.8);
            }
            .modal-header { display: flex; justify-content: space-between; align-items: center; }
            .modal-title { font-size: 15px; font-weight: 600; color: #fff; display: flex; align-items: center; gap: 8px; }
            
            .metric-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
            .metric-card {
              background: rgba(0,0,0,0.4); border: 1px solid var(--border); border-radius: 10px;
              padding: 10px 12px; display: flex; flex-direction: column; gap: 3px;
            }
            .metric-label { font-size: 10px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
            .metric-val { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; color: var(--cyan); }
            
            .dl-bar-container { display: flex; flex-direction: column; gap: 6px; }
            .dl-modal-bar { width: 100%; height: 7px; background: rgba(255,255,255,0.08); border-radius: 4px; overflow: hidden; }
            .dl-modal-fill { height: 100%; background: linear-gradient(90deg, var(--cyan), var(--accent)); width: 0%; transition: width 0.25s ease-out; }
            .dl-bar-info { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-secondary); }
            
            .terminal-container {
              background: #09090b; border: 1px solid var(--border); border-radius: 10px;
              padding: 12px; height: 130px; overflow-y: auto; font-family: 'JetBrains Mono', monospace;
              font-size: 11.5px; color: #94a3b8; line-height: 1.6; display: flex; flex-direction: column;
            }
            .terminal-line { word-break: break-all; }
            .terminal-line.success { color: var(--ok); font-weight: 600; }
            .terminal-line.error { color: var(--danger); font-weight: 600; }
            
            .modal-close-btn {
              align-self: flex-end; background: rgba(255,255,255,0.08); border: 1px solid var(--border); color: #fff;
              padding: 8px 20px; border-radius: 8px; cursor: pointer; font-size: 12.5px; font-weight: 500; transition: all 0.2s;
            }
            .modal-close-btn:hover { background: rgba(255,255,255,0.18); }
          </style>
          </head>
          <body>
            <button class="menu-btn" onclick="document.querySelector('.sidebar').classList.toggle('open')" style="display: none;">☰</button>
            
            <div class="modal-overlay" id="downloadModal">
              <div class="modal-box">
                <div class="modal-header">
                  <div class="modal-title"><span id="modalIcon">📥</span> <span id="modalTitle">Pulling Model</span></div>
                  <span id="modalPercent" style="font-family:'JetBrains Mono',monospace; font-size:14px; font-weight:700; color:var(--cyan);">0%</span>
                </div>
                
                <div class="metric-grid">
                  <div class="metric-card">
                    <span class="metric-label">Speed</span>
                    <span class="metric-val" id="metricSpeed">-- MB/s</span>
                  </div>
                  <div class="metric-card">
                    <span class="metric-label">Size</span>
                    <span class="metric-val" id="metricSize">-- / --</span>
                  </div>
                  <div class="metric-card">
                    <span class="metric-label">ETA</span>
                    <span class="metric-val" id="metricEta">--</span>
                  </div>
                </div>

                <div class="dl-bar-container">
                  <div class="dl-modal-bar"><div class="dl-modal-fill" id="modalBar"></div></div>
                  <div class="dl-bar-info">
                    <span id="modalStatus" style="font-size:11.5px;">Connecting...</span>
                  </div>
                </div>

                <div class="terminal-container" id="modalLogs"></div>
                <button class="modal-close-btn" id="modalCloseBtn" onclick="closeModal()" disabled>Downloading...</button>
              </div>
            </div>

            <div class="sidebar">
              <div class="brand-header">
                <div class="brand-logo">🦙</div>
                <div class="brand-name">Local Studio</div>
                <span class="brand-badge">MLX</span>
              </div>

              <button class="new-chat-btn" onclick="clearChat()"><span>＋</span> New Chat</button>
              
              <div class="settings-group">
                <div class="model-section-title">
                  <span>Model Selector</span>
                  <button onclick="loadModels()" style="background:none; border:none; color:var(--cyan); cursor:pointer; font-size:11px; font-weight:600;">🔄 Refresh</button>
                </div>
                <div class="model-list" id="modelListContainer">
                  <div style="padding: 10px; text-align: center; color: var(--text-muted);">Scanning repository...</div>
                </div>

                <div>
                  <label>Temperature <span id="tempVal" style="color: var(--cyan); font-family:monospace;">0.7</span></label>
                  <input type="range" id="temperature" min="0" max="2" step="0.1" value="0.7">
                </div>
                
                <div>
                  <label>Max Tokens <span id="tokenVal" style="color: var(--cyan); font-family:monospace;">2048</span></label>
                  <input type="range" id="maxTokens" min="128" max="8192" step="128" value="2048">
                </div>
              </div>

              <div class="system-stats">
                <div class="stat-title">🖥️ Server Resources</div>
                <div id="sysSpecs">Loading hardware...</div>
                
                <div class="stat-row">
                  <span>CPU Usage:</span>
                  <span id="cpuVal" class="stat-value" style="color: var(--cyan);">0%</span>
                </div>
                <div class="progress-bar"><div id="cpuBar" class="progress-fill" style="background: var(--cyan); width: 0%;"></div></div>
                
                <div class="stat-row" style="margin-top: 4px;">
                  <span>RAM Usage:</span>
                  <span id="ramVal" class="stat-value" style="color: var(--accent);">0%</span>
                </div>
                <div class="progress-bar"><div id="ramBar" class="progress-fill" style="background: var(--accent); width: 0%;"></div></div>
                
                <div class="stat-row" style="margin-top: 4px;">
                  <span>Storage Free:</span>
                  <span id="diskFreeVal" class="stat-value" style="color: var(--ok);">0 GB</span>
                </div>
              </div>

              <div class="sidebar-footer">
                <span class="model-tag" id="currentModelTag">📦 Loading...</span>
                <span id="statusIndicator"><span class="status-dot ok"></span>Connecting to backend...</span>
                <span id="tokenCounter" style="color: var(--cyan); font-family: 'JetBrains Mono', monospace; font-size: 11px;">Tokens generated: 0</span>
              </div>
            </div>

            <div class="main-content">
              <div class="chat-container" id="chatContainer">
                <div class="message-row assistant">
                  <div class="message-inner">
                    <div class="avatar assistant">✦</div>
                    <div class="message-body" id="welcomeMsg"></div>
                  </div>
                </div>
              </div>
              <div class="input-area-wrapper">
                <div class="input-box">
                  <textarea id="userInput" placeholder="Ask a question or enter an image prompt..." rows="1"></textarea>
                  <button class="send-btn" id="sendButton" onclick="sendMessage()">↑</button>
                  <button class="stop-btn" id="stopButton" onclick="stopGenerating()">■</button>
                </div>
              </div>
            </div>

          <script>
            marked.setOptions({
              gfm: true, breaks: true,
              highlight: function (code, lang) {
                if (lang && hljs.getLanguage(lang)) return hljs.highlight(code, { language: lang }).value;
                return hljs.highlightAuto(code).value;
              }
            });

            function renderInto(el, text, opts = {}) {
              const rawHtml = marked.parse(text);
              el.innerHTML = DOMPurify.sanitize(rawHtml) + (opts.loading ? '<span class="loading-dots"></span>' : '');
              if (window.renderMathInElement) {
                renderMathInElement(el, {
                  delimiters: [
                    { left: '$$', right: '$$', display: true }, { left: '\\[', right: '\\]', display: true },
                    { left: '\\(', right: '\\)', display: false }, { left: '$', right: '$', display: false }
                  ],
                  throwOnError: false
                });
              }
            }

            const STORE_KEY = 'studio-hybrid-clean-v1';
            const chatContainer = document.getElementById('chatContainer');
            const userInput = document.getElementById('userInput');
            const sendButton = document.getElementById('sendButton');
            const stopButton = document.getElementById('stopButton');
            const tokenCounter = document.getElementById('tokenCounter');
            const statusIndicator = document.getElementById('statusIndicator');
            const temperatureEl = document.getElementById('temperature');
            const maxTokensEl = document.getElementById('maxTokens');
            const modelListContainer = document.getElementById('modelListContainer');
            const currentModelTag = document.getElementById('currentModelTag');
            
            const downloadModal = document.getElementById('downloadModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalBar = document.getElementById('modalBar');
            const modalStatus = document.getElementById('modalStatus');
            const modalPercent = document.getElementById('modalPercent');
            const modalLogs = document.getElementById('modalLogs');
            const modalCloseBtn = document.getElementById('modalCloseBtn');
            const metricSpeed = document.getElementById('metricSpeed');
            const metricSize = document.getElementById('metricSize');
            const metricEta = document.getElementById('metricEta');

            let isStreaming = false, totalTokens = 0, messageHistory = [], controller = null, currentModel = null, currentModelType = 'text';
            let statPollInterval;

            async function fetchSysInfo() {
              try {
                const r = await fetch('/api/sysinfo');
                const data = await r.json();
                document.getElementById('sysSpecs').innerHTML = `OS: ${data.os}<br>CPU: ${data.cpu_threads} Threads<br>Memory: ${data.ram_total}`;
              } catch (e) {
                document.getElementById('sysSpecs').innerText = "Unavailable";
              }
            }

            async function fetchStats() {
              try {
                const r = await fetch('/api/stats');
                const data = await r.json();
                document.getElementById('cpuVal').textContent = data.cpu_percent.toFixed(1) + '%';
                document.getElementById('cpuBar').style.width = data.cpu_percent + '%';
                document.getElementById('ramVal').textContent = data.ram_percent.toFixed(1) + '%';
                document.getElementById('ramBar').style.width = data.ram_percent + '%';
                document.getElementById('diskFreeVal').textContent = data.disk_free;
              } catch (e) {}
            }

            function setPolling(fast) {
              clearInterval(statPollInterval);
              fetchStats();
              statPollInterval = setInterval(fetchStats, fast ? 1000 : 3000);
            }

            fetchSysInfo();
            setPolling(false);

            async function loadModels() {
              try {
                const resp = await fetch('/api/models');
                if (!resp.ok) throw new Error('Failed to fetch models');
                const data = await resp.json();
                const models = data.models || [];
                
                if (models.length === 0) {
                  modelListContainer.innerHTML = '<div style="padding: 10px; text-align: center; color: var(--text-muted);">No models available</div>';
                  return;
                }

                modelListContainer.innerHTML = models.map(m => `
                  <div class="model-item ${m.name === currentModel ? 'active' : ''}" onclick="${m.downloaded ? `selectModel('${m.name}', '${m.type}')` : ''}">
                    <div class="model-meta">
                      <div class="model-badges">
                        <span class="model-name" title="${m.name}">${m.name}</span>
                        <span class="model-type-badge ${m.type}">${m.type}</span>
                      </div>
                      <span class="model-status ${m.downloaded ? 'ready' : 'pending'}">${m.downloaded ? '🟢 Ready' : '📥 Not Downloaded'}</span>
                    </div>
                    ${!m.downloaded ? `<button class="dl-btn" onclick="startModelDownload('${m.name}', event)">Download</button>` : ''}
                  </div>
                `).join('');

                const downloaded = models.filter(m => m.downloaded);
                if (!currentModel && downloaded.length > 0) {
                  selectModel(downloaded[0].name, downloaded[0].type);
                }
              } catch (e) {
                modelListContainer.innerHTML = '<div style="padding: 10px; text-align: center; color: var(--danger);">Error loading models</div>';
              }
            }

            function selectModel(modelName, modelType = 'text') {
              currentModel = modelName;
              currentModelType = modelType;
              updateModelTag();
              saveState();
              loadModels();
            }

            function appendTerminalLog(msg, type = 'normal') {
              const line = document.createElement('div');
              line.className = 'terminal-line ' + type;
              line.textContent = msg;
              modalLogs.appendChild(line);
              modalLogs.scrollTop = modalLogs.scrollHeight;
            }

            function closeModal() {
              downloadModal.style.display = 'none';
            }

            async function startModelDownload(modelName, event) {
              if (event) event.stopPropagation();
              
              downloadModal.style.display = 'flex';
              modalTitle.textContent = `${modelName}`;
              modalBar.style.width = '0%';
              modalPercent.textContent = '0%';
              modalStatus.textContent = 'Connecting to Ollama repository...';
              metricSpeed.textContent = '-- MB/s';
              metricSize.textContent = '-- / --';
              metricEta.textContent = '--';
              modalLogs.innerHTML = '';
              appendTerminalLog(`[Init] Establishing connection for ${modelName}...`);
              modalCloseBtn.disabled = true;
              modalCloseBtn.textContent = 'Downloading...';

              let streamFailed = false;

              try {
                const resp = await fetch('/api/pull', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ model: modelName })
                });

                if (!resp.ok) {
                  throw new Error(`Server returned HTTP ${resp.status}`);
                }

                const reader = resp.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                pullLoop: while (true) {
                  const { done, value } = await reader.read();
                  if (done) break;
                  
                  buffer += decoder.decode(value, { stream: true });
                  const lines = buffer.split('\n');
                  buffer = lines.pop() || '';

                  for (const line of lines) {
                    const trimmed = line.trim();
                    if (!trimmed) continue;
                    
                    let jsonStr = trimmed;
                    if (jsonStr.startsWith('data: ')) {
                      jsonStr = jsonStr.slice(6);
                    }
                    if (jsonStr === '[DONE]') break pullLoop;

                    let data = null;
                    try {
                      data = JSON.parse(jsonStr);
                    } catch (e) {
                      continue;
                    }

                    if (data.error) {
                      streamFailed = true;
                      appendTerminalLog(`[Error] ${data.error}`, 'error');
                      modalStatus.textContent = 'Download failed.';
                      modalBar.style.background = 'var(--danger)';
                      break pullLoop;
                    }
                    
                    if (data.raw) {
                      modalStatus.textContent = data.raw;
                      appendTerminalLog(data.raw);
                    }
                    if (data.percent !== null && data.percent !== undefined) {
                      modalBar.style.width = data.percent + '%';
                      modalPercent.textContent = data.percent + '%';
                    }
                    if (data.speed) metricSpeed.textContent = data.speed;
                    if (data.size) metricSize.textContent = data.size;
                    if (data.eta) metricEta.textContent = data.eta;
                  }
                }

                if (streamFailed) {
                  modalCloseBtn.disabled = false;
                  modalCloseBtn.textContent = 'Close';
                  modalCloseBtn.onclick = closeModal;
                  loadModels();
                  return;
                }

                modalBar.style.width = '100%';
                modalPercent.textContent = '100%';
                modalStatus.textContent = 'Model successfully downloaded and verified!';
                appendTerminalLog(`[Success] Verified integrity for ${modelName}`, 'success');
                modalCloseBtn.disabled = false;
                modalCloseBtn.textContent = 'Done & Select';
                modalCloseBtn.onclick = () => {
                  closeModal();
                  selectModel(modelName);
                };
                loadModels();

              } catch (err) {
                modalBar.style.background = 'var(--danger)';
                appendTerminalLog(`[Network Error] ${err.message || 'Connection lost'}`, 'error');
                modalStatus.textContent = 'Interrupted.';
                modalCloseBtn.disabled = false;
                modalCloseBtn.textContent = 'Close';
                modalCloseBtn.onclick = closeModal;
                loadModels();
              }
            }

            function updateModelTag() {
              currentModelTag.textContent = currentModel ? `📦 ${currentModel} (${currentModelType})` : '📦 (no model selected)';
            }

            function saveState() {
              try {
                localStorage.setItem(STORE_KEY, JSON.stringify({
                  temperature: temperatureEl.value, maxTokens: maxTokensEl.value,
                  messageHistory, totalTokens, model: currentModel, modelType: currentModelType
                }));
              } catch { }
            }

            function restoreState() {
              try {
                const raw = localStorage.getItem(STORE_KEY);
                if (!raw) return;
                const s = JSON.parse(raw);
                if (s.temperature) { temperatureEl.value = s.temperature; document.getElementById('tempVal').textContent = s.temperature; }
                if (s.maxTokens) { maxTokensEl.value = s.maxTokens; document.getElementById('tokenVal').textContent = s.maxTokens; }
                if (s.model) { currentModel = s.model; currentModelType = s.modelType || 'text'; updateModelTag(); }
                if (Array.isArray(s.messageHistory)) {
                  messageHistory = s.messageHistory; totalTokens = s.totalTokens || 0;
                  messageHistory.forEach(m => appendMessage(m.role, m.content));
                  tokenCounter.textContent = `Tokens generated: ${totalTokens}`;
                }
              } catch { }
            }

            async function checkHealth() {
              try {
                const r = await fetch('/api/health');
                statusIndicator.innerHTML = r.ok ? '<span class="status-dot ok"></span>Engine Online' : '<span class="status-dot bad"></span>Engine Offline';
              } catch { statusIndicator.innerHTML = '<span class="status-dot bad"></span>Engine Offline'; }
            }

            checkHealth(); setInterval(checkHealth, 15000);

            userInput.addEventListener('input', function () {
              this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 200) + 'px';
            });
            userInput.addEventListener('keydown', function (e) {
              if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
            });

            temperatureEl.addEventListener('input', function () { document.getElementById('tempVal').textContent = this.value; saveState(); });
            maxTokensEl.addEventListener('input', function () { document.getElementById('tokenVal').textContent = this.value; saveState(); });

            function appendMessage(role, content, isLoading = false, isError = false) {
              const row = document.createElement('div');
              row.className = `message-row ${role}` + (isError ? ' error' : '');
              row.innerHTML = `<div class="message-inner">
                <div class="avatar ${role}">${role === 'user' ? '👤' : '✦'}</div>
                <div class="message-body"></div>
              </div>`;
              chatContainer.appendChild(row);
              const body = row.querySelector('.message-body');
              renderInto(body, content, { loading: isLoading });
              chatContainer.scrollTop = chatContainer.scrollHeight;
              return body;
            }

            function updateLastAssistantMessage(content, isComplete = false) {
              const rows = chatContainer.querySelectorAll('.message-row.assistant');
              if (!rows.length) return;
              const body = rows[rows.length - 1].querySelector('.message-body');
              renderInto(body, content, { loading: !isComplete });
              chatContainer.scrollTop = chatContainer.scrollHeight;
            }

            function clearChat() {
              const rows = chatContainer.querySelectorAll('.message-row');
              for (let i = 1; i < rows.length; i++) rows[i].remove();
              messageHistory = []; totalTokens = 0; tokenCounter.textContent = 'Tokens generated: 0';
              saveState();
            }

            function stopGenerating() { if (controller) controller.abort(); }

            async function sendMessage() {
              if (isStreaming) return;
              const text = userInput.value.trim();
              if (!text) return;
              if (!currentModel) return alert('Please download and select a model first from the sidebar.');

              appendMessage('user', text);
              messageHistory.push({ role: 'user', content: text });
              userInput.value = ''; userInput.style.height = 'auto';
              sendButton.style.display = 'none'; stopButton.style.display = 'flex';
              isStreaming = true; controller = new AbortController();
              appendMessage('assistant', currentModelType === 'image' ? 'Generating Image...' : 'Processing...', true);

              setPolling(true);

              let fullContent = '';
              try {
                const response = await fetch('/api/chat', {
                  method: 'POST', headers: { 'Content-Type': 'application/json' }, signal: controller.signal,
                  body: JSON.stringify({
                    messages: messageHistory, model: currentModel,
                    temperature: parseFloat(temperatureEl.value), max_tokens: parseInt(maxTokensEl.value)
                  })
                });

                if (!response.ok) throw new Error(`Server returned ${response.status}`);
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '', streamError = null;

                while (true) {
                  const { done, value } = await reader.read();
                  if (done) break;
                  buffer += decoder.decode(value, { stream: true });
                  const lines = buffer.split('\n');
                  buffer = lines.pop() || '';
                  for (const line of lines) {
                    if (!line.startsWith('data: ')) continue;
                    const data = line.slice(6);
                    if (data === '[DONE]') continue;
                    try {
                      const parsed = JSON.parse(data);
                      if (parsed.error) streamError = parsed.error;
                      else if (parsed.content) {
                        fullContent += parsed.content;
                        updateLastAssistantMessage(fullContent, false);
                      }
                    } catch { }
                  }
                }

                if (streamError) throw new Error(streamError);
                updateLastAssistantMessage(fullContent, true);
                messageHistory.push({ role: 'assistant', content: fullContent });
                totalTokens += Math.ceil(fullContent.length / 4);
                tokenCounter.textContent = `Tokens generated: ${totalTokens}`;
                saveState();
              } catch (error) {
                if (error.name === 'AbortError') {
                  updateLastAssistantMessage(fullContent + '\n\n*(stopped)*', true);
                  if (fullContent) { messageHistory.push({ role: 'assistant', content: fullContent }); saveState(); }
                } else {
                  updateLastAssistantMessage(`⚠️ ${error.message || 'Error executing request.'}`, true);
                }
              }

              sendButton.style.display = 'flex'; stopButton.style.display = 'none';
              isStreaming = false; controller = null; userInput.focus();
              setPolling(false);
            }

            loadModels().then(() => {
              restoreState();
              const welcome = document.getElementById('welcomeMsg');
              renderInto(welcome, `System initialized with verified MLX image & language runtimes. Select or download any model from the sidebar to begin.`);
            });
          </script>
          </body>
          </html>
          '''

          if __name__ == "__main__":
              uvicorn.run(app, host="0.0.0.0", port=PORT, log_level="info")
          PYEOF
          echo "✅ Server script written"

      - name: 🌐 Start web server
        run: |
          echo "──────────────────────────────────────────"
          echo " 🌐  Starting web UI"
          echo "──────────────────────────────────────────"
          nohup python ollama_server.py > /tmp/webui.log 2>&1 &
          echo $! > /tmp/webui.pid
          ready=false
          for i in $(seq 1 15); do
            if curl -sf "http://localhost:${PORT}" > /dev/null 2>&1; then
              echo "✅ Web UI is ready!"
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            echo "❌ Web UI failed to start. Last logs:"
            tail -n 50 /tmp/webui.log || true
            exit 1
          fi

      - name: 📦 Install cloudflared (macOS Darwin)
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz -o /tmp/cloudflared.tgz
          tar -xzf /tmp/cloudflared.tgz -C /tmp
          sudo mv /tmp/cloudflared /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared
          rm -f /tmp/cloudflared.tgz
          cloudflared --version

      - name: 🌐 Create tunnel and wait
        run: |
          echo "──────────────────────────────────────────"
          echo " 🌐  Creating Cloudflare tunnel"
          echo "──────────────────────────────────────────"
          cloudflared tunnel --url "http://127.0.0.1:${PORT}" --protocol http2 > tunnel.log 2>&1 &
          TUNNEL_PID=$!
          echo "⏳ Waiting for tunnel URL..."
          TUNNEL_URL=""
          for i in $(seq 1 30); do
            TUNNEL_URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' tunnel.log 2>/dev/null | head -1)
            [ -n "$TUNNEL_URL" ] && break
            sleep 2
          done
          if [ -z "$TUNNEL_URL" ]; then
            echo "❌ Could not get a tunnel URL. Tunnel log:"
            cat tunnel.log
            exit 1
          fi
          echo ""
          echo "╔═══════════════════════════════════════════════════════════════════╗"
          echo "║       🎉  Y O U R   M L X   S T U D I O   I S   R E A D Y  🎉    ║"
          echo "╠═══════════════════════════════════════════════════════════════════╣"
          echo "║  🔗  $TUNNEL_URL"
          echo "╚═══════════════════════════════════════════════════════════════════╝"
          {
            echo "## 🦙 Your LLM & Image Web UI is live"
            echo ""
            echo "**URL:** $TUNNEL_URL"
            echo ""
            echo "**Context:** ${CONTEXT_SIZE} tokens"
            echo "**Architecture:** Apple Silicon macOS (Max Memory Dynamic Swap Enabled)"
            echo ""
            echo "> This link stays live for as long as this job keeps running (up to the 6-hour timeout, or until you cancel the run)."
          } >> "$GITHUB_STEP_SUMMARY"
          wait "$TUNNEL_PID"

      - name: 🧹 Cleanup
        if: always()
        run: |
          pkill -f "cloudflared" 2>/dev/null || true
          pkill -f "python ollama_server" 2>/dev/null || true
          pkill -f "ollama serve" 2>/dev/null || true
          echo "✅ Cleanup complete"
