name: 🦙🎬 Full Pre-Loaded AI Studio (Ollama + LongCat-Video)

on:
  workflow_dispatch:
    inputs:
      port:
        description: '🔌 Web UI port'
        required: false
        default: '7860'
        type: string
      context_size:
        description: '📝 Context window (tokens)'
        required: false
        default: '4096'
        type: string

permissions:
  contents: read

concurrency:
  group: ai-preloaded-studio
  cancel-in-progress: true

jobs:
  deploy-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CONTEXT_SIZE: ${{ inputs.context_size }}
      PORT: ${{ inputs.port }}
      PIP_CACHE_DIR: ${{ github.workspace }}/.pip_cache
      TMPDIR: ${{ github.workspace }}/.tmp
    steps:
      - name: 🚀 System Banner
        run: |
          echo "╔═══════════════════════════════════════════════════════════════════╗"
          echo "║     🦙 🎬  F U L L Y   P R E - L O A D E D   A I   S T U D I O      ║"
          echo "╚═══════════════════════════════════════════════════════════════════╝"
          echo "  📝 Context: ${CONTEXT_SIZE} tokens"
          echo "  🔌 Port:    ${PORT}"
          echo "  🏃 Runner:  $(uname -a)"
          echo "  💾 Memory:  $(free -h | awk '/Mem:/{print $2}')"
          echo "  🧠 CPUs:    $(nproc)"
          mkdir -p $PIP_CACHE_DIR $TMPDIR

      - name: 🧹 Maximize Runner Storage (Creates 100GB Workspace)
        uses: easimon/maximize-build-space@master
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: 🐍 Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install Web Dependencies
        run: |
          pip install --no-cache-dir fastapi uvicorn aiohttp httpx python-multipart jinja2 websockets pydantic psutil

      - name: 🦙 Install & Start Ollama Engine
        run: |
          echo "──────────────────────────────────────────"
          echo " 🦙 Installing Ollama Core"
          echo "──────────────────────────────────────────"
          curl -L -s https://ollama.com/download/ollama-linux-amd64 -o ollama
          chmod +x ollama
          mkdir -p ollama_models
          export OLLAMA_MODELS="$(pwd)/ollama_models"
          
          nohup ./ollama serve > /tmp/ollama.log 2>&1 &
          
          echo "⏳ Waiting for Ollama API..."
          for i in {1..15}; do
            if curl -sf http://127.0.0.1:11434/api/tags > /dev/null 2>&1; then
              echo "✅ Ollama online!"
              break
            fi
            sleep 2
          done

      - name: 🎬 Install LongCat-Video Framework
        run: |
          echo "──────────────────────────────────────────"
          echo " 🎬 Installing LongCat-Video Framework"
          echo "──────────────────────────────────────────"
          git clone --single-branch --branch main https://github.com/meituan-longcat/LongCat-Video.git
          cd LongCat-Video
          pip install --no-cache-dir torch==2.6.0+cu124 torchvision==0.21.0+cu124 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cu124
          pip install --no-cache-dir ninja packaging
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir librosa -r requirements_avatar.txt
          echo "✅ LongCat-Video fully installed."

      - name: 🔧 Build Unified Studio Gateway
        run: |
          cat > ai_studio.py << 'PYEOF'
          import json
          import os
          import logging
          import platform
          import psutil
          import subprocess
          import shutil
          from typing import Optional, List
          import httpx
          import uvicorn
          from fastapi import FastAPI, HTTPException
          from fastapi.responses import HTMLResponse, StreamingResponse
          from pydantic import BaseModel

          logging.basicConfig(level=logging.INFO)
          logger = logging.getLogger("ai-ui")

          CONTEXT_SIZE = int(os.getenv("CONTEXT_SIZE", "4096"))
          PORT = int(os.getenv("PORT", "7860"))

          WORKSPACE_DIR = os.path.abspath(".")
          OLLAMA_BIN = os.path.join(WORKSPACE_DIR, "ollama")
          OLLAMA_MODELS = os.path.join(WORKSPACE_DIR, "ollama_models")
          LONGCAT_DIR = os.path.join(WORKSPACE_DIR, "LongCat-Video")
          HF_HOME = os.path.join(WORKSPACE_DIR, "hf_cache")

          os.environ["OLLAMA_MODELS"] = OLLAMA_MODELS
          os.environ["HF_HOME"] = HF_HOME
          OLLAMA_HOST = "http://127.0.0.1:11434"

          app = FastAPI(title="Pre-Loaded AI Studio")

          CATALOG_MODELS = [
              {"name": "qwen2.5:0.5b", "type": "general"},
              {"name": "qwen2.5:1.5b", "type": "general"},
              {"name": "qwen2.5:3b", "type": "general"},
              {"name": "qwen2.5:7b", "type": "general"},
              {"name": "qwen2.5-coder:1.5b", "type": "code"},
              {"name": "qwen2.5-coder:7b", "type": "code"},
              {"name": "deepseek-r1:1.5b", "type": "reasoning"},
              {"name": "deepseek-r1:7b", "type": "reasoning"},
              {"name": "llama3.2:1b", "type": "general"},
              {"name": "llama3.2:3b", "type": "general"},
              {"name": "tinyllama", "type": "general"},
              {"name": "phi3.5", "type": "general"},
              {"name": "mistral:7b", "type": "general"}
          ]

          class ChatMessage(BaseModel):
              role: str
              content: str
              images: Optional[List[str]] = None

          class ChatRequest(BaseModel):
              messages: List[ChatMessage]
              model: str
              temperature: Optional[float] = 0.7
              max_tokens: Optional[int] = 2048

          class PullRequest(BaseModel):
              model: str

          class VideoGenRequest(BaseModel):
              task: str
              model: str
              prompt: str

          @app.get("/api/system/status")
          def sys_status():
              disk = psutil.disk_usage(WORKSPACE_DIR)
              return {
                  "ollama_installed": True,
                  "ollama_running": True,
                  "longcat_installed": True,
                  "disk_free": f"{disk.free / (1024**3):.1f} GB"
              }

          @app.get("/api/sysinfo")
          def sysinfo():
              return {
                  "cpu_threads": psutil.cpu_count(logical=True),
                  "ram_total": f"{psutil.virtual_memory().total / (1024**3):.1f} GB",
                  "os": platform.system() + " " + platform.release()
              }

          @app.get("/api/stats")
          def stats():
              disk = psutil.disk_usage(WORKSPACE_DIR)
              return {
                  "cpu_percent": psutil.cpu_percent(interval=None),
                  "ram_percent": psutil.virtual_memory().percent,
                  "ram_used": f"{psutil.virtual_memory().used / (1024**3):.1f} GB",
                  "disk_free": f"{disk.free / (1024**3):.1f} GB"
              }

          @app.get("/api/models")
          async def list_models():
              pulled_names = set()
              try:
                  async with httpx.AsyncClient(timeout=4) as client:
                      r = await client.get(f"{OLLAMA_HOST}/api/tags")
                      if r.status_code == 200:
                          pulled_names = {m["name"] for m in r.json().get("models", [])}
              except:
                  pass
              models_payload = [{"name": i["name"], "type": i["type"], "downloaded": i["name"] in pulled_names} for i in CATALOG_MODELS]
              return {"models": models_payload}

          @app.post("/api/pull")
          async def pull_model(req: PullRequest):
              async def generate_pull():
                  try:
                      process = subprocess.Popen([OLLAMA_BIN, "pull", req.model], env=os.environ, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
                      for line in process.stdout:
                          line_str = line.strip()
                          if not line_str: continue
                          percent = None
                          if "%" in line_str:
                              for p in line_str.split():
                                  if p.endswith("%"):
                                      try: percent = int(p.rstrip("%"))
                                      except: pass
                          yield "data: " + json.dumps({"raw": line_str, "percent": percent}) + "\n\n"
                      process.wait()
                      yield "data: [DONE]\n\n"
                  except Exception as e:
                      yield "data: " + json.dumps({"error": str(e)}) + "\n\n"
              return StreamingResponse(generate_pull(), media_type="text/event-stream")

          @app.post("/api/chat")
          async def chat(request: ChatRequest):
              ollama_messages = [{"role": m.role, "content": m.content, **({"images": m.images} if m.images else {})} for m in request.messages]
              async def generate():
                  try:
                      async with httpx.AsyncClient(timeout=180) as client:
                          async with client.stream(
                              "POST", f"{OLLAMA_HOST}/api/chat",
                              json={"model": request.model, "messages": ollama_messages, "stream": True,
                                    "options": {"temperature": request.temperature, "num_predict": request.max_tokens, "num_ctx": CONTEXT_SIZE}}
                          ) as response:
                              if response.status_code != 200:
                                  yield "data: " + json.dumps({"error": "Engine error"}) + "\n\n"
                                  yield "data: [DONE]\n\n"
                                  return
                              async for line in response.aiter_lines():
                                  line = line.strip()
                                  if not line: continue
                                  try:
                                      obj = json.loads(line)
                                      if obj.get("error"): yield "data: " + json.dumps({"error": obj["error"]}) + "\n\n"
                                      elif obj.get("message", {}).get("content"): yield "data: " + json.dumps({"content": obj["message"]["content"]}) + "\n\n"
                                  except: continue
                  except Exception as exc:
                      yield "data: " + json.dumps({"error": str(exc)}) + "\n\n"
                  yield "data: [DONE]\n\n"
              return StreamingResponse(generate(), media_type="text/event-stream")

          @app.post("/api/video/generate")
          async def generate_video(req: VideoGenRequest):
              async def stream():
                  init_msg = f"🚀 Initializing LongCat inference for task: {req.task}\n"
                  yield "data: " + json.dumps({"raw": init_msg}) + "\n\n"
                  
                  script = "run_demo_text_to_video.py"
                  if req.task == "i2v": script = "run_demo_image_to_video.py"
                  elif req.task == "avatar": script = "run_demo_avatar_single_audio_to_video.py"
                  
                  cmd = ["python", script, f"--checkpoint_dir={HF_HOME}/hub/models--meituan-longcat--{req.model}/snapshots/main"]
                  if req.task == "avatar": cmd.extend(["--use_distill", "--model_type", "avatar-v1.5"])

                  proc = subprocess.Popen(cmd, cwd=LONGCAT_DIR, env=os.environ, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
                  for line in proc.stdout:
                      yield "data: " + json.dumps({"raw": line.strip() + "\n"}) + "\n\n"
                  proc.wait()
                  yield "data: [DONE]\n\n"
              return StreamingResponse(stream(), media_type="text/event-stream")

          @app.get("/", response_class=HTMLResponse)
          async def root():
              return HTML_TEMPLATE

          HTML_TEMPLATE = """<!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>AI Studio - Pre-Loaded</title>
          <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
          <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
          <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
          <style>
            :root {
              --ink: #131210; --panel: #1b1a16; --panel-raised: #201f1a;
              --rule: #34322a; --rule-bright: #4a4738; --ivory: #ece7da;
              --dust: #9a927e; --dust-dim: #6b6558; --amber: #e8a33d;
              --amber-ink: #2a1c05; --amber-dim: rgba(232, 163, 61, 0.14);
              --amber-line: rgba(232, 163, 61, 0.4); --signal: #6fae8f;
              --alert: #d9634a; --radius-s: 4px; --radius-m: 7px;
            }
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body { background: var(--ink); color: var(--ivory); height: 100vh; display: flex; overflow: hidden; font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; }
            ::-webkit-scrollbar { width: 9px; height: 9px; }
            ::-webkit-scrollbar-track { background: transparent; }
            ::-webkit-scrollbar-thumb { background: var(--rule-bright); border-radius: 5px; border: 2px solid var(--ink); }
            a { color: var(--amber); }
            .rack { width: 308px; background: var(--panel); border-right: 1px solid var(--rule); display: flex; flex-direction: column; flex-shrink: 0; z-index: 30; overflow-y: auto; }
            .rack-header { display: flex; align-items: center; gap: 10px; padding: 18px 18px 14px; border-bottom: 1px solid var(--rule); }
            .rack-mark { width: 28px; height: 28px; border-radius: var(--radius-s); background: var(--amber-dim); border: 1px solid var(--amber-line); display: flex; align-items: center; justify-content: center; font-size: 14px; }
            .rack-title { font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 600; color: var(--ivory); line-height: 1.1; }
            .rack-sub { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--dust-dim); margin-top: 2px; }
            .module { padding: 16px 18px; border-bottom: 1px solid var(--rule); }
            .module-label { font-size: 11.5px; font-weight: 500; color: var(--dust); margin-bottom: 10px; display: flex; justify-content: space-between; }
            .nav-btn { display: flex; align-items: center; justify-content: flex-start; gap: 7px; width: 100%; padding: 9px 12px; margin-bottom:6px; background: transparent; border: 1px solid transparent; border-radius: var(--radius-m); color: var(--dust); font-size: 13px; font-weight: 500; cursor: pointer; transition: 0.15s ease; }
            .nav-btn:hover { background: var(--panel-raised); }
            .nav-btn.active { background: var(--amber-dim); border-color: var(--amber-line); color: var(--amber); }
            .model-list { display: flex; flex-direction: column; gap: 2px; max-height: 200px; overflow-y: auto; }
            .model-row { display: flex; align-items: center; gap: 9px; padding: 8px; border-radius: var(--radius-s); cursor: default; border: 1px solid transparent; }
            .model-row[data-clickable="1"] { cursor: pointer; }
            .model-row[data-clickable="1"]:hover { background: var(--panel-raised); }
            .model-row.active { background: var(--amber-dim); border-color: var(--amber-line); }
            .model-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--rule-bright); }
            .model-row.active .model-dot { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
            .model-row[data-downloaded="1"]:not(.active) .model-dot { background: var(--signal); }
            .model-meta { flex: 1; display: flex; flex-direction: column; gap: 3px; }
            .model-name { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ivory); }
            .dl-btn { background: transparent; border: 1px solid var(--rule-bright); color: var(--dust); padding: 4px 9px; border-radius: var(--radius-s); font-size: 11px; cursor: pointer; font-family: 'JetBrains Mono'; }
            .dl-btn:hover { border-color: var(--amber-line); color: var(--amber); }
            .meter { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
            .meter-label { font-size: 11.5px; color: var(--dust); width: 40px; }
            .meter-track { flex: 1; display: flex; gap: 2px; height: 8px; }
            .meter-seg { flex: 1; background: var(--rule); border-radius: 1px; }
            .meter-seg.on { background: var(--amber); }
            .meter-val { font-family: 'JetBrains Mono'; font-size: 11px; width: 38px; text-align: right; }
            .rack-footer { margin-top: auto; padding: 14px 18px; display: flex; flex-direction: column; gap: 8px; }
            .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--signal); display:inline-block; margin-right:6px; box-shadow: 0 0 5px var(--signal); }
            
            .viewport { flex: 1; display: flex; flex-direction: column; height: 100vh; position: relative; background: var(--ink); }
            .view-panel { display: none; flex: 1; flex-direction: column; height: 100%; overflow: hidden; }
            .view-panel.active { display: flex; }
            
            .log { flex: 1; overflow-y: auto; padding: 8px 0 160px; }
            .log-inner { max-width: 680px; margin: 0 auto; padding: 0 20px; }
            .turn { padding: 20px 0; border-bottom: 1px solid var(--rule); }
            .turn-label { font-family: 'JetBrains Mono'; font-size: 10.5px; color: var(--dust-dim); margin-bottom: 8px; }
            .turn.user .turn-label { color: var(--amber); }
            .turn-body { line-height: 1.65; font-size: 15px; }
            .dock-wrap { position: absolute; bottom: 0; left: 0; width: 100%; background: linear-gradient(180deg, transparent 0%, var(--ink) 45%); padding: 16px 20px 20px; display: flex; flex-direction: column; align-items: center; }
            .dock { max-width: 680px; width: 100%; background: var(--panel); border: 1px solid var(--rule); border-radius: var(--radius-m); display: flex; align-items: flex-end; padding: 8px 8px 8px 14px; gap: 8px; }
            .dock textarea { flex: 1; background: transparent; border: none; color: var(--ivory); font-family: inherit; font-size: 14.5px; resize: none; outline: none; min-height: 24px; max-height: 200px; padding: 6px 0; }
            .send-btn { background: var(--amber); color: var(--amber-ink); border: none; border-radius: var(--radius-s); width: 34px; height: 34px; font-weight: 600; cursor: pointer; flex-shrink: 0; }
            
            .studio-view { max-width: 720px; margin: 0 auto; width: 100%; padding: 40px 20px; overflow-y: auto; }
            .card { background: var(--panel); border: 1px solid var(--rule); border-radius: var(--radius-m); padding: 24px; margin-bottom: 24px; }
            .card h3 { font-family: 'Space Grotesk'; font-size: 18px; margin-bottom: 16px; color: var(--ivory); display:flex; justify-content:space-between; align-items:center;}
            .badge { font-family: 'JetBrains Mono'; font-size: 11px; padding: 4px 8px; border-radius: 4px; background: rgba(111,174,143,0.1); border:1px solid rgba(111,174,143,0.3); color: var(--signal); }
            .action-btn { padding: 10px 16px; background: var(--amber); color: var(--amber-ink); border: none; border-radius: var(--radius-s); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
            .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
            .form-group label { font-size: 13px; color: var(--dust); font-weight: 500; }
            .form-group select, .form-group textarea { background: var(--panel-raised); border: 1px solid var(--rule); color: var(--ivory); padding: 12px; border-radius: var(--radius-s); font-family: inherit; font-size: 14px; outline: none; }
            .term-box { background: #0e0d0b; border: 1px solid var(--rule); border-radius: var(--radius-s); padding: 16px; font-family: 'JetBrains Mono'; font-size: 12px; color: #94a3b8; height: 240px; overflow-y: auto; line-height: 1.6; margin-top: 16px; }
          </style>
          </head>
          <body>
            <nav class="rack">
              <div class="rack-header">
                <div class="rack-mark">🦙</div>
                <div>
                  <div class="rack-title">Studio Console</div>
                  <div class="rack-sub">Pre-Loaded Core</div>
                </div>
              </div>
              <div class="module">
                <div class="module-label"><span>Workspace</span></div>
                <button class="nav-btn active" onclick="switchView('chat')">💬 LLM Chat</button>
                <button class="nav-btn" onclick="switchView('video')">🎬 LongCat Video</button>
                <button class="nav-btn" onclick="switchView('setup')">⚙️ System Status</button>
              </div>
              <div class="module">
                <div class="module-label"><span>Local Models</span><button class="module-refresh" onclick="loadModels()">refresh</button></div>
                <div class="model-list" id="modelListContainer"><div class="model-list-empty">Loading models...</div></div>
              </div>
              <div class="module">
                <div class="module-label"><span>Hardware</span></div>
                <div class="hw-line" id="sysSpecs">reading specs…</div>
                <div class="meter"><span class="meter-label">CPU</span><div class="meter-track" id="cpuMeter"></div><span class="meter-val" id="cpuVal">0%</span></div>
                <div class="meter"><span class="meter-label">RAM</span><div class="meter-track" id="ramMeter"></div><span class="meter-val" id="ramVal">0%</span></div>
                <div class="meter"><span class="meter-label">Disk</span><div class="meter-track"></div><span class="meter-val" id="diskFreeVal" style="width:auto;">—</span></div>
              </div>
              <div class="rack-footer">
                <div style="font-size:12px; color:var(--dust);"><span class="status-dot"></span><span>Engines Active</span></div>
              </div>
            </nav>

            <div class="viewport">
              <div id="view-chat" class="view-panel active">
                <div class="log" id="log"><div class="log-inner" id="logInner"><div class="turn assistant"><div class="turn-label">Console</div><div class="turn-body">Ollama & LongCat are fully pre-loaded. Pull a model from the sidebar to chat.</div></div></div></div>
                <div class="dock-wrap">
                  <div class="dock">
                    <textarea id="userInput" placeholder="Select an installed model to begin…" rows="1" disabled></textarea>
                    <button class="send-btn" id="sendButton" onclick="sendMessage()" disabled>⏎</button>
                  </div>
                </div>
              </div>

              <div id="view-video" class="view-panel studio-view">
                <h2>🎬 LongCat-Video Studio</h2>
                <p style="color:var(--dust); margin-bottom:30px;">Generate high-quality 720p 30fps videos.</p>
                <div class="card">
                  <div class="form-group"><label>Task Type</label><select id="vidTask"><option value="t2v">Text-to-Video</option><option value="i2v">Image-to-Video</option><option value="avatar">Avatar Audio-to-Video</option></select></div>
                  <div class="form-group"><label>Model Checkpoint</label><select id="vidModel"><option value="LongCat-Video-Avatar-1.5">LongCat-Video-Avatar-1.5</option><option value="LongCat-Video">LongCat-Video</option></select></div>
                  <div class="form-group"><label>Prompt</label><textarea id="vidPrompt" rows="3" placeholder="A futuristic cyber-city at sunset..."></textarea></div>
                  <button class="action-btn" style="width:100%;" onclick="generateVideo()">🚀 Generate Video</button>
                  <div class="term-box" id="vidTerm">> Ready for inference.\n</div>
                </div>
              </div>

              <div id="view-setup" class="view-panel studio-view">
                <h2>⚙️ System Status</h2>
                <div class="card">
                  <h3>🦙 Ollama Engine <div><span class="badge">Running</span></div></h3>
                  <h3>🎬 LongCat Core <div><span class="badge">Installed</span></div></h3>
                </div>
              </div>
            </div>

          <script>
            const $ = (id) => document.getElementById(id);
            let currentModel = null;
            let messageHistory = [];

            function switchView(id) {
              document.querySelectorAll('.view-panel').forEach(el => el.classList.remove('active'));
              document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
              $(`view-${id}`).classList.add('active');
              event.currentTarget.classList.add('active');
            }

            function renderMeterSegments(container, percent, segCount) {
              if (!container) return;
              const on = Math.round((percent / 100) * segCount);
              container.innerHTML = Array.from({length: segCount}, (_, i) => `<div class="meter-seg${i < on ? ' on' : ''}"></div>`).join('');
            }

            setInterval(async () => {
              try {
                const r = await fetch('/api/stats');
                const d = await r.json();
                $('cpuVal').textContent = d.cpu_percent.toFixed(0) + '%';
                renderMeterSegments($('cpuMeter'), d.cpu_percent, 20);
                $('ramVal').textContent = d.ram_percent.toFixed(0) + '%';
                renderMeterSegments($('ramMeter'), d.ram_percent, 20);
                $('diskFreeVal').textContent = d.disk_free;
              } catch(e){}
            }, 3000);

            async function loadModels() {
              try {
                const r = await fetch('/api/models');
                const data = await r.json();
                const container = $('modelListContainer');
                container.innerHTML = data.models.map(m => `
                  <div class="model-row ${m.name===currentModel ? 'active':''}" data-model="${m.name}" data-clickable="${m.downloaded?'1':'0'}">
                    <span class="model-dot"></span>
                    <div class="model-meta">
                      <span class="model-name">${m.name}</span>
                      <div class="model-flags"><span class="model-chip">${m.downloaded?'ready':'not pulled'}</span></div>
                    </div>
                    ${!m.downloaded ? `<button class="dl-btn" onclick="event.stopPropagation(); startPull('${m.name}')">Pull</button>` : ''}
                  </div>`).join('');
                const dl = data.models.filter(m=>m.downloaded);
                if(!currentModel && dl.length>0) selectModel(dl[0].name);
                if(currentModel) { $('userInput').disabled = false; $('sendButton').disabled = false; $('userInput').placeholder = "Type your message..."; }
              } catch(e){}
            }

            $('modelListContainer').addEventListener('click', (e)=>{
              const row = e.target.closest('.model-row[data-clickable="1"]');
              if(row) selectModel(row.getAttribute('data-model'));
            });

            function selectModel(name) { currentModel = name; loadModels(); }

            async function startPull(name) {
              const feed = $('logInner');
              feed.innerHTML += `<div class="turn assistant"><div class="turn-label">System</div><div class="turn-body">Pulling model ${name}...</div></div>`;
              await fetch('/api/pull', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({model:name})});
              loadModels();
            }

            async function sendMessage() {
              const input = $('userInput');
              const text = input.value.trim();
              if(!text || !currentModel) return;
              input.value = '';
              const feed = $('logInner');
              feed.innerHTML += `<div class="turn user"><div class="turn-label">You</div><div class="turn-body">${text}</div></div>`;
              messageHistory.push({role:'user', content:text});

              const asst = document.createElement('div');
              asst.className = 'turn assistant';
              asst.innerHTML = `<div class="turn-label">Console</div><div class="turn-body">...</div>`;
              feed.appendChild(asst);
              const body = asst.querySelector('.turn-body');

              const res = await fetch('/api/chat', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({messages:messageHistory, model:currentModel})});
              const reader = res.body.getReader();
              const decoder = new TextDecoder();
              let full = '';
              while(true) {
                const {done, value} = await reader.read();
                if(done) break;
                for(let line of decoder.decode(value).split('\\n')){
                  if(line.startsWith('data: ') && !line.includes('[DONE]')){
                    try{
                      const data = JSON.parse(line.slice(6));
                      if(data.content) { full += data.content; body.innerHTML = DOMPurify.sanitize(marked.parse(full)); $('log').scrollTop = $('log').scrollHeight; }
                    }catch(e){}
                  }
                }
              }
              messageHistory.push({role:'assistant', content:full});
            }

            async function generateVideo() {
              const term = $('vidTerm');
              term.innerHTML = '> Starting generation...\\n';
              const res = await fetch('/api/video/generate', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({task:$('vidTask').value, model:$('vidModel').value, prompt:$('vidPrompt').value})});
              const reader = res.body.getReader();
              const decoder = new TextDecoder();
              while(true) {
                const {done, value} = await reader.read();
                if(done) break;
                for(let line of decoder.decode(value).split('\\n')){
                  if(line.startsWith('data: ') && !line.includes('[DONE]')){
                    try{ term.innerHTML += JSON.parse(line.slice(6)).raw; term.scrollTop = term.scrollHeight; }catch(e){}
                  }
                }
              }
            }

            fetch('/api/sysinfo').then(r=>r.json()).then(d=>$('sysSpecs').textContent=`${d.os} · ${d.cpu_threads} cores`);
            loadModels();
          </script>
          </body>
          </html>
          """

          if __name__ == "__main__":
              uvicorn.run(app, host="0.0.0.0", port=PORT, log_level="info")
          PYEOF
          echo "✅ Server script written successfully"

      - name: 🌐 Launch Web Server
        run: |
          nohup python ai_studio.py > /tmp/webui.log 2>&1 &
          sleep 3

      - name: 📦 Install Cloudflared & Tunnel
        run: |
          curl -L -s https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/
          
          cloudflared tunnel --url "http://127.0.0.1:${PORT}" --protocol http2 > tunnel.log 2>&1 &
          TUNNEL_PID=$!
          
          TUNNEL_URL=""
          for i in {1..30}; do
            TUNNEL_URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' tunnel.log | head -1)
            [ -n "$TUNNEL_URL" ] && break
            sleep 2
          done
          
          echo "╔═══════════════════════════════════════════════════════════════════╗"
          echo "║         🎉   A I   S T U D I O   I S   R E A D Y   🎉             ║"
          echo "╠═══════════════════════════════════════════════════════════════════╣"
          echo "║  🔗  $TUNNEL_URL"
          echo "╚═══════════════════════════════════════════════════════════════════╝"
          
          {
            echo "## 🦙🎬 AI Studio is Online"
            echo "**URL:** $TUNNEL_URL"
            echo "- Ollama and LongCat-Video are pre-installed."
          } >> "$GITHUB_STEP_SUMMARY"
          
          wait "$TUNNEL_PID"

      - name: 🧹 Cleanup
        if: always()
        run: |
          pkill -f "cloudflared" 2>/dev/null || true
          pkill -f "python ai_studio.py" 2>/dev/null || true
          pkill -f "ollama serve" 2>/dev/null || true
          echo "✅ Cleanup complete"
