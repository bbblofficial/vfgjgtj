name: 🦙 Local LLM + Image Model Web Interface (Optimized)
on:
  workflow_dispatch:
    inputs:
      port:
        description: '🔌 Web UI port'
        required: false
        default: '7860'
        type: string
      context_size:
        description: '📝 Context window (tokens)'
        required: false
        default: '4096'
        type: string
permissions:
  contents: read
concurrency:
  group: llama-web-ui
  cancel-in-progress: true
jobs:
  deploy-llama:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CONTEXT_SIZE: ${{ inputs.context_size }}
      PORT: ${{ inputs.port }}
    steps:
      - name: 🦙 Show banner
        run: |
          echo "╔═══════════════════════════════════════════════════════════════════╗"
          echo "║    🦙   L O C A L    L L M    W E B    U I    ( O P T I M I Z E D )     ║"
          echo "╚═══════════════════════════════════════════════════════════════════╝"
          echo "  📝 Context: ${CONTEXT_SIZE} tokens"
          echo "  🔌 Port:    ${PORT}"
          echo "  🏃 Runner:  $(uname -a)"
          echo "  💾 Memory:  $(free -h | awk '/Mem:/{print $2}')"
          echo "  🧠 CPUs:    $(nproc)"
          echo "  ⏱️ Timeout:  6 Hours (360 minutes)"
          echo "  💽 Disk space:"
          df -h / | tail -1
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 📦 Install dependencies
        run: |
          echo "──────────────────────────────────────────"
          echo " 📦   Installing Ollama + Python packages"
          echo "──────────────────────────────────────────"
          curl -fsSL https://ollama.com/install.sh | sh
          pip install --no-cache-dir \
            fastapi uvicorn aiohttp httpx python-multipart \
            jinja2 websockets pydantic psutil \
            huggingface-hub
          ollama --version
          python --version
      - name: 🚀 Start Ollama server
        run: |
          echo "──────────────────────────────────────────"
          echo " 🚀   Starting Ollama"
          echo "──────────────────────────────────────────"
          sudo systemctl stop ollama 2>/dev/null || true
          sudo systemctl disable ollama 2>/dev/null || true
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          echo $! > /tmp/ollama.pid
          echo "⏳ Waiting for Ollama to become ready..."
          ready=false
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:11434/api/tags > /dev/null 2>&1; then
              echo "✅ Ollama is ready!"
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            echo "❌ Ollama failed to start. Last logs:"
            tail -n 50 /tmp/ollama.log || true
            exit 1
          fi
      - name: 🔧 Write the web server (Full Markdown + Math + Image Models)
        run: |
          cat << 'PYEOF' > ollama_server.py
          import json
          import os
          import logging
          import platform
          import psutil
          import subprocess
          from typing import Optional, List
          import httpx
          import uvicorn
          from fastapi import FastAPI, HTTPException
          from fastapi.responses import HTMLResponse, StreamingResponse
          from pydantic import BaseModel
          logging.basicConfig(level=logging.INFO)
          logger = logging.getLogger("llama-ui")
          
          OLLAMA_HOST = os.getenv("OLLAMA_HOST", "http://127.0.0.1:11434")
          CONTEXT_SIZE = int(os.getenv("CONTEXT_SIZE", "4096"))
          PORT = int(os.getenv("PORT", "7860"))
          
          SYSTEM_PROMPT = """You are a highly capable, expert AI assistant. Your primary goal is to be exceptionally helpful, accurate, and clear. 
          Follow these guidelines:
          - Provide direct, concise answers without unnecessary filler.
          - Think step-by-step when addressing complex problems, coding tasks, or logic puzzles.
          - Format your output beautifully using Markdown (e.g., bolding for emphasis, code blocks for code, and bullet points for lists).
          - Be objective, polite, and neutral in your tone.
          - If you do not know the answer, admit it rather than hallucinating information."""

          app = FastAPI(title="Local LLM + Image Model UI (Optimized)")

          CATALOG_MODELS = [
              # ---- Ollama LLMs ----
