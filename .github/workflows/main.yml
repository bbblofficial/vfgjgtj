              {"name": "mistral:7b-text", "type": "general"},
              {"name": "mistral:7b-text-q2_K", "type": "general"},
              {"name": "mistral:7b-text-v0.2-q2_K", "type": "general"},
              {"name": "mistral:7b-text-q3_K_S", "type": "general"},
              {"name": "mistral:7b-text-v0.2-q3_K_S", "type": "general"},
              {"name": "mistral:7b-text-q3_K_M", "type": "general"},
              {"name": "mistral:7b-text-v0.2-q3_K_M", "type": "general"},
              {"name": "mistral:7b-text-q3_K_L", "type": "general"},
              {"name": "mistral:7b-text-v0.2-q3_K_L", "type": "general"},
              {"name": "mistral:7b-text-q4_0", "type": "general"},
              {"name": "mistral:7b-text-v0.2-q4_0", "type": "general"},
              {"name": "mistral:7b-text-q4_1", "type": "general"},
              {"name": "mistral:7b-text-v0.2-q4_1", "type": "general"},
              {"name": "mistral:7b-text-q4_K_S", "type": "general"},
              {"name": "mistral:7b-text-v0.2-q4_K_S", "type": "general"},
              {"name": "mistral:7b-text-q4_K_M", "type": "general"},
              {"name": "mistral:7b-text-v0.2-q4_K_M", "type": "general"},
              {"name": "mistral:7b-text-q5_0", "type": "general"},
              {"name": "mistral:7b-text-v0.2-q5_0", "type": "general"},
              {"name": "mistral:7b-text-q5_1", "type": "general"},
              {"name": "mistral:7b-text-v0.2-q5_1", "type": "general"},
              {"name": "mistral:7b-text-q5_K_S", "type": "general"},
              {"name": "mistral:7b-text-v0.2-q5_K_S", "type": "general"},
              {"name": "mistral:7b-text-q5_K_M", "type": "general"},
              {"name": "mistral:7b-text-v0.2-q5_K_M", "type": "general"},
              {"name": "mistral:7b-text-q6_K", "type": "general"},
              {"name": "mistral:7b-text-v0.2-q6_K", "type": "general"},
              {"name": "mistral:7b-text-q8_0", "type": "general"},
              {"name": "mistral:7b-text-v0.2-q8_0", "type": "general"},
              {"name": "mistral:7b-text-fp16", "type": "general"},
              {"name": "mistral:7b-text-v0.2-fp16", "type": "general"},

              # ---- External Image Models (Hugging Face) ----
              {"name": "Ideogram 4.0 Quality", "type": "image", "source": "huggingface", "repo": "ideogram-ai/ideogram-4.0"},
              {"name": "Hunyuan Image 3.0", "type": "image", "source": "huggingface", "repo": "Tencent/HunyuanDiT"},
              {"name": "FLUX 2 Dev", "type": "image", "source": "huggingface", "repo": "black-forest-labs/FLUX.1-dev"},
              {"name": "Qwen Image 2512", "type": "image", "source": "huggingface", "repo": "Qwen/Qwen-VL"},
              {"name": "HiDream O1 Image", "type": "image", "source": "huggingface", "repo": "HiDream-ai/HiDream-I1"},
          ]

          EXTERNAL_MODEL_MAP = {
              item["name"]: item for item in CATALOG_MODELS if item.get("type") == "image"
          }

          class ChatMessage(BaseModel):
              role: str
              content: str
              images: Optional[List[str]] = None
          class ChatRequest(BaseModel):
              messages: List[ChatMessage]
              model: str
              temperature: Optional[float] = 0.7
              max_tokens: Optional[int] = 2048
          class PullRequest(BaseModel):
              model: str

          @app.get("/api/health")
          async def health():
              try:
                  async with httpx.AsyncClient(timeout=3) as client:
                      r = await client.get(f"{OLLAMA_HOST}/api/tags")
                      r.raise_for_status()
                  return {"status": "ok"}
              except Exception as exc:
                  logger.error(f"Health check failed: {exc}")
                  raise HTTPException(status_code=503, detail=str(exc))

          @app.get("/api/sysinfo")
          def sysinfo():
              try:
                  return {
                      "cpu_threads": psutil.cpu_count(logical=True),
                      "ram_total": f"{psutil.virtual_memory().total / (1024**3):.1f} GB",
                      "os": platform.system() + " " + platform.release()
                  }
              except Exception:
                  return {"cpu_threads": 4, "ram_total": "16.0 GB", "os": "Linux"}

          @app.get("/api/stats")
          def stats():
              try:
                  disk = psutil.disk_usage('/')
                  return {
                      "cpu_percent": psutil.cpu_percent(interval=None),
                      "ram_percent": psutil.virtual_memory().percent,
                      "ram_used": f"{psutil.virtual_memory().used / (1024**3):.1f} GB",
                      "disk_free": f"{disk.free / (1024**3):.1f} GB free"
                  }
              except Exception:
                  return {"cpu_percent": 0.0, "ram_percent": 0.0, "ram_used": "0 GB", "disk_free": "100 GB free"}

          @app.get("/api/models")
          async def list_models():
              try:
                  pulled_names = set()
                  async with httpx.AsyncClient(timeout=4) as client:
                      try:
                          r = await client.get(f"{OLLAMA_HOST}/api/tags")
                          if r.status_code == 200:
                              data = r.json()
                              pulled_names = {m["name"] for m in data.get("models", [])}
                      except Exception as inner_exc:
                          logger.warning(f"Could not reach Ollama for tags: {inner_exc}")
                  
                  for item in CATALOG_MODELS:
                      if item.get("type") == "image":
                          model_path = f"/models/{item['name'].replace(' ', '_')}"
                          if os.path.exists(model_path) and os.path.isdir(model_path):
                              pulled_names.add(item["name"])
                  
                  models_payload = []
                  for item in CATALOG_MODELS:
                      name = item["name"]
                      models_payload.append({
                          "name": name,
                          "type": item["type"],
                          "downloaded": name in pulled_names
                      })
                  return {"models": models_payload}
              except Exception as exc:
                  logger.error(f"List models failed: {exc}")
                  raise HTTPException(status_code=503, detail=str(exc))

          @app.post("/api/pull")
          async def pull_model(req: PullRequest):
              if req.model in EXTERNAL_MODEL_MAP:
                  return await pull_external_model(req.model)
              else:
                  return await pull_ollama_model(req.model)

          async def pull_ollama_model(model_name: str):
              async def generate_pull():
                  try:
                      process = subprocess.Popen(
                          ["ollama", "pull", model_name],
                          stdout=subprocess.PIPE,
                          stderr=subprocess.STDOUT,
                          text=True
                      )
                      for line in process.stdout:
                          line_str = line.strip()
                          if not line_str:
                              continue
                          percent = None
                          if "%" in line_str:
                              parts = line_str.split()
                              for p in parts:
                                  if p.endswith("%"):
                                      try:
                                          percent = int(p.rstrip("%"))
                                      except ValueError:
                                          pass
                          yield f"data: {json.dumps({'raw': line_str, 'percent': percent})}\n\n"
                      process.wait()
                      if process.returncode != 0:
                          yield f"data: {json.dumps({'error': 'Pull command failed'})}\n\n"
                      yield "data: [DONE]\n\n"
                  except Exception as e:
                      yield f"data: {json.dumps({'error': str(e)})}\n\n"
              return StreamingResponse(generate_pull(), media_type="text/event-stream")

          async def pull_external_model(model_name: str):
              repo_info = EXTERNAL_MODEL_MAP.get(model_name)
              if not repo_info:
                  async def error_gen():
                      yield f"data: {json.dumps({'error': 'Unknown external model'})}\n\n"
                      yield "data: [DONE]\n\n"
                  return StreamingResponse(error_gen(), media_type="text/event-stream")
              
              repo_id = repo_info.get("repo")
              target_dir = f"/models/{model_name.replace(' ', '_')}"
              
              async def generate_pull():
                  try:
                      os.makedirs(target_dir, exist_ok=True)
                      cmd = ["huggingface-cli", "download", repo_id, "--local-dir", target_dir, "--local-dir-use-symlinks", "False"]
                      process = subprocess.Popen(
                          cmd,
                          stdout=subprocess.PIPE,
                          stderr=subprocess.STDOUT,
                          text=True
                      )
                      for line in process.stdout:
                          line_str = line.strip()
                          if not line_str:
                              continue
                          percent = None
                          if "%" in line_str:
                              parts = line_str.split()
                              for p in parts:
                                  if p.endswith("%"):
                                      try:
                                          percent = int(p.rstrip("%"))
                                      except ValueError:
                                          pass
                          yield f"data: {json.dumps({'raw': line_str, 'percent': percent})}\n\n"
                      process.wait()
                      if process.returncode != 0:
                          yield f"data: {json.dumps({'error': f'Download failed with code {process.returncode}'})}\n\n"
                      else:
                          yield f"data: {json.dumps({'raw': '✅ Download complete!', 'percent': 100})}\n\n"
                      yield "data: [DONE]\n\n"
                  except Exception as e:
                      yield f"data: {json.dumps({'error': str(e)})}\n\n"
              return StreamingResponse(generate_pull(), media_type="text/event-stream")

          @app.get("/", response_class=HTMLResponse)
          async def root():
              return HTML_TEMPLATE

          @app.post("/api/chat")
          async def chat(request: ChatRequest):
              if request.model in EXTERNAL_MODEL_MAP:
                  async def error_gen():
                      # Fixed syntax error: escaped double quotes and concatenation
                      yield f"data: {json.dumps({'error': 'Model \"' + request.model + '\" is an image generator, not a chat LLM.'})}\n\n"
                      yield "data: [DONE]\n\n"
                  return StreamingResponse(error_gen(), media_type="text/event-stream")
              
              ollama_messages = [{"role": "system", "content": SYSTEM_PROMPT}]
              for m in request.messages:
                  msg_dict = {"role": m.role, "content": m.content}
                  if m.images:
                      msg_dict["images"] = m.images
                  ollama_messages.append(msg_dict)
              async def generate():
                  try:
                      async with httpx.AsyncClient(timeout=180) as client:
                          async with client.stream(
                              "POST",
                              f"{OLLAMA_HOST}/api/chat",
                              json={
                                  "model": request.model,
                                  "messages": ollama_messages,
                                  "stream": True,
                                  "options": {
                                      "temperature": request.temperature,
                                      "num_predict": request.max_tokens,
                                      "num_ctx": CONTEXT_SIZE,
                                  },
                              },
                          ) as response:
                              if response.status_code != 200:
                                  body = await response.aread()
                                  yield f"data: {json.dumps({'error': body.decode(errors='ignore')})}\n\n"
                                  yield "data: [DONE]\n\n"
                                  return
                              async for line in response.aiter_lines():
                                  line = line.strip()
                                  if not line:
                                      continue
                                  try:
                                      obj = json.loads(line)
                                  except json.JSONDecodeError:
                                      continue
                                  err = obj.get("error")
                                  if err:
                                      yield f"data: {json.dumps({'error': err})}\n\n"
                                      continue
                                  content = obj.get("message", {}).get("content")
                                  if content:
                                      yield f"data: {json.dumps({'content': content})}\n\n"
                  except Exception as exc:
                      logger.exception("chat stream failed")
                      yield f"data: {json.dumps({'error': str(exc)})}\n\n"
                  yield "data: [DONE]\n\n"
              return StreamingResponse(generate(), media_type="text/event-stream")

          HTML_TEMPLATE = r"""<!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Local Studio - Console</title>
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
          <!-- KaTeX for math rendering -->
          <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous">
          <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>
          <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
          
          <!-- markdown-it + full plugin set -->
          <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.0.0/dist/markdown-it.min.js"></script>
          <script src="https://cdn.jsdelivr.net/npm/markdown-it-footnote@3.0.3/dist/markdown-it-footnote.min.js"></script>
          <script src="https://cdn.jsdelivr.net/npm/markdown-it-deflist@2.1.0/dist/markdown-it-deflist.min.js"></script>
          <script src="https://cdn.jsdelivr.net/npm/markdown-it-abbr@1.0.4/dist/markdown-it-abbr.min.js"></script>
          <script src="https://cdn.jsdelivr.net/npm/markdown-it-emoji@2.0.2/dist/markdown-it-emoji.min.js"></script>
          <script src="https://cdn.jsdelivr.net/npm/markdown-it-task-lists@2.1.1/dist/markdown-it-task-lists.min.js"></script>
          <script src="https://cdn.jsdelivr.net/npm/markdown-it-container@3.0.0/dist/markdown-it-container.min.js"></script>
          <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
          <link id="hljsTheme" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
          <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
          <style>
            :root {
              --ink: #131210;
              --panel: #1b1a16;
              --panel-raised: #201f1a;
              --rule: #34322a;
              --rule-bright: #4a4738;
              --ivory: #ece7da;
              --dust: #9a927e;
              --dust-dim: #6b6558;
              --amber: #e8a33d;
              --amber-ink: #2a1c05;
              --amber-dim: rgba(232, 163, 61, 0.14);
              --amber-line: rgba(232, 163, 61, 0.4);
              --signal: #6fae8f;
              --signal-dim: rgba(111, 174, 143, 0.14);
              --alert: #d9634a;
              --alert-dim: rgba(217, 99, 74, 0.14);
              --radius-s: 4px;
              --radius-m: 7px;
            }
            * { margin: 0; padding: 0; box-sizing: border-box; }
            html, body { height: 100%; }
            body {
              background: var(--ink); color: var(--ivory); height: 100vh; display: flex; overflow: hidden;
              font-family: 'IBM Plex Sans', -apple-system, sans-serif; font-size: 15px;
            }
            ::selection { background: var(--amber-dim); color: var(--ivory); }
            ::-webkit-scrollbar { width: 9px; height: 9px; }
            ::-webkit-scrollbar-track { background: transparent; }
            ::-webkit-scrollbar-thumb { background: var(--rule-bright); border-radius: 5px; border: 2px solid var(--ink); }
            a { color: var(--amber); }
            button { font-family: inherit; }
            :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
            .rack {
              width: 308px; background: var(--panel); border-right: 1px solid var(--rule);
              display: flex; flex-direction: column; flex-shrink: 0; z-index: 30;
              overflow-y: auto; transition: transform 0.22s ease;
            }
            .rack-header {
              display: flex; align-items: center; gap: 10px; padding: 18px 18px 14px;
              border-bottom: 1px solid var(--rule);
            }
            .rack-mark {
              width: 28px; height: 28px; border-radius: var(--radius-s); background: var(--amber-dim);
              border: 1px solid var(--amber-line); display: flex; align-items: center; justify-content: center;
              font-size: 14px; flex-shrink: 0;
            }
            .rack-title { font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 600; color: var(--ivory); line-height: 1.1; }
            .rack-sub { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--dust-dim); margin-top: 2px; }
            .rack-close {
              margin-left: auto; display: none; background: transparent; border: 1px solid var(--rule);
              color: var(--dust); width: 28px; height: 28px; border-radius: var(--radius-s); cursor: pointer;
            }
            .module { padding: 16px 18px; border-bottom: 1px solid var(--rule); }
            .module-label {
              font-size: 11.5px; font-weight: 500; color: var(--dust); margin-bottom: 10px;
              display: flex; align-items: center; justify-content: space-between;
            }
            .module-refresh { background: none; border: none; color: var(--amber); cursor: pointer; font-size: 11px; font-weight: 500; padding: 2px 4px; }
            .new-session-btn {
              display: flex; align-items: center; justify-content: center; gap: 7px; width: 100%; padding: 9px;
              background: var(--panel-raised); border: 1px solid var(--rule); border-radius: var(--radius-m); color: var(--ivory);
              font-size: 13px; font-weight: 500; cursor: pointer; transition: border-color 0.15s ease;
            }
            .new-session-btn:hover { border-color: var(--amber-line); }
            .model-list { display: flex; flex-direction: column; gap: 2px; max-height: 260px; overflow-y: auto; }
            .model-row {
              display: flex; align-items: center; gap: 9px; padding: 8px 8px; border-radius: var(--radius-s);
              cursor: default; border: 1px solid transparent;
            }
            .model-row[data-clickable="1"] { cursor: pointer; }
            .model-row[data-clickable="1"]:hover { background: var(--panel-raised); }
            .model-row.active { background: var(--amber-dim); border-color: var(--amber-line); }
            .model-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; background: var(--rule-bright); }
            .model-row.active .model-dot { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
            .model-row[data-downloaded="1"]:not(.active) .model-dot { background: var(--signal); }
            .model-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
            .model-name {
              font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ivory);
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            }
            .model-flags { display: flex; align-items: center; gap: 6px; }
            .model-chip {
              font-family: 'JetBrains Mono', monospace; font-size: 9.5px; padding: 1px 5px; border-radius: 3px;
              border: 1px solid var(--rule-bright); color: var(--dust);
            }
            .model-chip.vision { color: var(--signal); border-color: rgba(111,174,143,0.4); }
            .model-chip.image { color: #c084fc; border-color: rgba(192,132,252,0.4); }
            .dl-btn {
              background: transparent; border: 1px solid var(--rule-bright); color: var(--dust);
              padding: 4px 9px; border-radius: var(--radius-s); font-size: 11px; cursor: pointer; flex-shrink: 0;
              font-family: 'JetBrains Mono', monospace; transition: all 0.15s ease;
            }
            .dl-btn:hover { border-color: var(--amber-line); color: var(--amber); }
            .dl-btn:disabled { opacity: 0.45; cursor: not-allowed; }
            .model-list-empty { font-size: 12px; color: var(--dust-dim); padding: 10px 4px; }
            .field { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; }
            .field:first-child { margin-top: 0; }
            .field-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--dust); }
            .field-row span.val { font-family: 'JetBrains Mono', monospace; color: var(--amber); }
            input[type="range"] {
              -webkit-appearance: none; width: 100%; height: 3px; background: var(--rule-bright); border-radius: 2px; outline: none;
            }
            input[type="range"]::-webkit-slider-thumb {
              -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%; background: var(--amber);
              cursor: pointer; border: 2px solid var(--panel);
            }
            .meter { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
            .meter-label { font-size: 11.5px; color: var(--dust); width: 40px; flex-shrink: 0; }
            .meter-track { flex: 1; display: flex; gap: 2px; height: 8px; }
            .meter-seg { flex: 1; background: var(--rule); border-radius: 1px; }
            .meter-seg.on { background: var(--amber); }
            .meter-val { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ivory); width: 38px; text-align: right; flex-shrink: 0; }
            .hw-line { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--dust-dim); line-height: 1.6; margin-bottom: 10px; }
            .rack-footer { margin-top: auto; padding: 14px 18px; display: flex; flex-direction: column; gap: 8px; }
            .status-line { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--dust); }
            .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dust-dim); flex-shrink: 0; }
            .status-dot.ok { background: var(--signal); box-shadow: 0 0 5px var(--signal); }
            .status-dot.bad { background: var(--alert); box-shadow: 0 0 5px var(--alert); }
            .token-line { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--dust-dim); }
            .viewport { flex: 1; display: flex; flex-direction: column; height: 100vh; position: relative; min-width: 0; }
            .topbar {
              display: none; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--rule);
              flex-shrink: 0;
            }
            .topbar-toggle {
              background: var(--panel); border: 1px solid var(--rule); color: var(--ivory); width: 34px; height: 34px;
              border-radius: var(--radius-s); cursor: pointer; font-size: 15px;
            }
            .topbar-title { font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 600; }
            .activity-bar {
              padding: 7px 24px; font-size: 12px; color: var(--amber); display: none; align-items: center; gap: 9px;
              font-family: 'JetBrains Mono', monospace; border-bottom: 1px solid var(--rule); flex-shrink: 0;
            }
            .activity-dot {
              width: 6px; height: 6px; border-radius: 50%; background: var(--amber); flex-shrink: 0;
              animation: pulse 1s ease-in-out infinite;
            }
            @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
            .log { flex: 1; overflow-y: auto; padding: 8px 0 160px; }
            .log-inner { max-width: 680px; margin: 0 auto; padding: 0 20px; }
            .turn { padding: 20px 0; border-bottom: 1px solid var(--rule); }
            .turn:last-child { border-bottom: none; }
            .turn-label {
              font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--dust-dim);
              margin-bottom: 8px; display: flex; align-items: center; gap: 8px;
            }
            .turn.user .turn-label { color: var(--amber); }
            .turn-body { line-height: 1.65; font-size: 15px; }
            .turn-body p { margin: 0 0 12px; }
            .turn-body p:last-child { margin-bottom: 0; }
            .turn-body img { max-width: 100%; height: auto; border-radius: var(--radius-m); margin: 10px 0; border: 1px solid var(--rule); }
            .turn-body pre {
              background: #0e0d0b; color: #e2e8f0; padding: 32px 14px 14px; border-radius: var(--radius-m);
              overflow-x: auto; margin: 14px 0; border: 1px solid var(--rule); font-size: 13px;
            }
            .turn-body code { font-family: 'JetBrains Mono', monospace; font-size: 13px; background: var(--panel-raised); padding: 2px 5px; border-radius: 3px; }
            .turn-body pre code { background: transparent; padding: 0; }
            .turn.error .turn-body { color: var(--alert); }
            .cursor-blink { display: inline-block; width: 7px; height: 14px; background: var(--amber); vertical-align: -2px; animation: blink 0.9s step-end infinite; margin-left: 2px; }
            @keyframes blink { 50% { opacity: 0; } }
            .empty-state { max-width: 480px; margin: 60px auto; text-align: center; padding: 0 20px; }
            .empty-state h2 { font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 600; margin-bottom: 8px; }
            .empty-state p { color: var(--dust); font-size: 13.5px; line-height: 1.6; }
            .media-row { display: flex; gap: 8px; padding: 0 16px 8px; flex-wrap: wrap; }
            .media-chip {
              position: relative; width: 54px; height: 54px; border-radius: var(--radius-s); overflow: hidden;
              border: 1px solid var(--amber-line); background: #000;
            }
            .media-chip img { width: 100%; height: 100%; object-fit: cover; }
            .media-chip .rm {
              position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,0.75); color: #fff;
              border: none; border-radius: 3px; width: 16px; height: 16px; font-size: 10px; cursor: pointer; line-height: 1;
            }
            .dock-wrap {
              position: absolute; bottom: 0; left: 0; width: 100%;
              background: linear-gradient(180deg, transparent 0%, var(--ink) 45%);
              padding: 16px 20px 20px; display: flex; flex-direction: column; align-items: center;
            }
            .dock {
              max-width: 680px; width: 100%; background: var(--panel); border: 1px solid var(--rule);
              border-radius: var(--radius-m); display: flex; align-items: flex-end; padding: 8px 8px 8px 14px; gap: 8px;
              transition: border-color 0.15s ease;
            }
            .dock:focus-within { border-color: var(--amber-line); }
            .dock textarea {
              flex: 1; background: transparent; border: none; color: var(--ivory); font-family: inherit;
              font-size: 14.5px; resize: none; outline: none; max-height: 200px; min-height: 24px; line-height: 24px; padding: 6px 0;
            }
            .dock textarea::placeholder { color: var(--dust-dim); }
            .dock textarea:disabled { color: var(--dust-dim); }
            .icon-btn, .send-btn, .stop-btn {
              border: 1px solid var(--rule-bright); border-radius: var(--radius-s); width: 34px; height: 34px;
              display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; font-size: 15px;
              background: transparent; color: var(--dust); transition: all 0.15s ease;
            }
            .icon-btn:hover { color: var(--ivory); border-color: var(--rule-bright); }
            .send-btn { background: var(--amber); border-color: var(--amber); color: var(--amber-ink); font-weight: 600; }
            .send-btn:hover { background: #f0b25a; }
            .send-btn:disabled { background: var(--panel-raised); border-color: var(--rule); color: var(--dust-dim); cursor: not-allowed; }
            .stop-btn { background: var(--alert-dim); border-color: var(--alert); color: var(--alert); display: none; }
            .dock-hint { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--dust-dim); margin-top: 8px; }
            .modal-overlay {
              position: fixed; inset: 0; background: rgba(10,9,7,0.82); backdrop-filter: blur(6px);
              display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px;
            }
            .modal-box {
              background: var(--panel); border: 1px solid var(--rule); border-radius: var(--radius-m);
              width: 100%; max-width: 480px; padding: 22px; display: flex; flex-direction: column; gap: 16px;
            }
            .modal-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
            .modal-name { font-family: 'JetBrains Mono', monospace; font-size: 14px; color: var(--ivory); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
            .modal-pct { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 600; color: var(--amber); flex-shrink: 0; }
            .metric-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
            .metric { background: var(--panel-raised); border: 1px solid var(--rule); border-radius: var(--radius-s); padding: 8px 10px; }
            .metric-label { font-size: 10px; color: var(--dust-dim); margin-bottom: 3px; }
            .metric-val { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: var(--ivory); }
            .modal-bar-track { width: 100%; height: 6px; background: var(--rule); border-radius: 3px; overflow: hidden; }
            .modal-bar-fill { height: 100%; background: var(--amber); width: 0%; transition: width 0.25s ease-out; }
            .term { background: #0e0d0b; border: 1px solid var(--rule); border-radius: var(--radius-s); padding: 10px 12px;
              height: 120px; overflow-y: auto; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #94a3b8; line-height: 1.6; }
            .term-line.error { color: var(--alert); font-weight: 600; }
            .modal-btn {
              align-self: flex-end; background: transparent; border: 1px solid var(--rule-bright); color: var(--ivory);
              padding: 7px 16px; border-radius: var(--radius-s); cursor: pointer; font-size: 12.5px; font-weight: 500;
            }
            .modal-btn:hover:not(:disabled) { border-color: var(--amber-line); color: var(--amber); }
            .modal-btn:disabled { opacity: 0.5; cursor: not-allowed; }
            .backdrop-scrim {
              position: fixed; inset: 0; background: rgba(10,9,7,0.6); z-index: 25; display: none;
            }
            @media (max-width: 860px) {
              .rack {
                position: fixed; top: 0; left: 0; height: 100%; transform: translateX(-100%); box-shadow: 0 0 40px rgba(0,0,0,0.5);
              }
              .rack.open { transform: translateX(0); }
              .rack-close { display: flex; align-items: center; justify-content: center; }
              .topbar { display: flex; }
              .backdrop-scrim.show { display: block; }
            }
          </style>
          </head>
          <body>
            <div class="backdrop-scrim" id="scrim"></div>
            <div class="modal-overlay" id="downloadModal">
              <div class="modal-box">
                <div class="modal-head">
                  <span class="modal-name" id="modalTitle">model</span>
                  <span class="modal-pct" id="modalPercent">0%</span>
                </div>
                <div class="metric-row">
                  <div class="metric"><div class="metric-label">Speed</div><div class="metric-val" id="metricSpeed">—</div></div>
                  <div class="metric"><div class="metric-label">Size</div><div class="metric-val" id="metricSize">—</div></div>
                  <div class="metric"><div class="metric-label">ETA</div><div class="metric-val" id="metricEta">—</div></div>
                </div>
                <div class="modal-bar-track"><div class="modal-bar-fill" id="modalBar"></div></div>
                <div class="term" id="modalLogs"></div>
                <button class="modal-btn" id="modalCloseBtn" disabled>Downloading…</button>
              </div>
            </div>
            <nav class="rack" id="rack">
              <div class="rack-header">
                <div class="rack-mark">🦙</div>
                <div>
                  <div class="rack-title">Local Studio</div>
                  <div class="rack-sub">console v2</div>
                </div>
                <button class="rack-close" id="rackClose" aria-label="Close model panel">✕</button>
              </div>
              <div class="module">
                <button class="new-session-btn" id="newSessionBtn">＋ New session</button>
              </div>
              <div class="module">
                <div class="module-label">
                  <span>Models</span>
                  <button class="module-refresh" id="refreshBtn">refresh</button>
                </div>
                <div class="model-list" id="modelListContainer">
                  <div class="model-list-empty">Reading model catalog…</div>
                </div>
              </div>
              <div class="module">
                <div class="field">
                  <div class="field-row"><span>Temperature</span><span class="val" id="tempVal">0.7</span></div>
                  <input type="range" id="temperature" min="0" max="2" step="0.1" value="0.7" aria-label="Temperature">
                </div>
                <div class="field">
                  <div class="field-row"><span>Max tokens</span><span class="val" id="tokenVal">2048</span></div>
                  <input type="range" id="maxTokens" min="128" max="4096" step="128" value="2048" aria-label="Max tokens">
                </div>
              </div>
              <div class="module">
                <div class="module-label"><span>Hardware</span></div>
                <div class="hw-line" id="sysSpecs">reading host specs…</div>
                <div class="meter">
                  <span class="meter-label">CPU</span>
                  <div class="meter-track" id="cpuMeter"></div>
                  <span class="meter-val" id="cpuVal">0%</span>
                </div>
                <div class="meter">
                  <span class="meter-label">RAM</span>
                  <div class="meter-track" id="ramMeter"></div>
                  <span class="meter-val" id="ramVal">0%</span>
                </div>
                <div class="meter">
                  <span class="meter-label">Disk</span>
                  <div class="meter-track"></div>
                  <span class="meter-val" id="diskFreeVal" style="width:auto;">—</span>
                </div>
              </div>
              <div class="rack-footer">
                <div class="status-line"><span class="status-dot" id="engineDot"></span><span id="engineText">Checking engine…</span></div>
                <div class="token-line" id="tokenCounter">0 tokens generated</div>
              </div>
            </nav>
            <div class="viewport">
              <div class="topbar">
                <button class="topbar-toggle" id="rackOpenBtn" aria-label="Open model panel">☰</button>
                <span class="topbar-title" id="topbarModel">No model selected</span>
              </div>
              <div class="activity-bar" id="activityBar">
                <span class="activity-dot"></span>
                <span id="activityText">Idle</span>
              </div>
              <div class="log" id="log">
                <div class="log-inner" id="logInner"></div>
              </div>
              <div class="dock-wrap">
                <div class="media-row" id="mediaRow"></div>
                <div class="dock">
                  <button class="icon-btn" id="attachBtn" title="Attach an image for a vision model" aria-label="Attach image">📎</button>
                  <input type="file" id="mediaInput" accept="image/*" style="display:none;">
                  <textarea id="userInput" placeholder="Download a model to begin…" rows="1" disabled></textarea>
                  <button class="send-btn" id="sendButton" aria-label="Send message" disabled>⏎</button>
                  <button class="stop-btn" id="stopButton" aria-label="Stop generating">■</button>
                </div>
                <div class="dock-hint">Enter to send · Shift+Enter for a new line</div>
              </div>
            </div>
          <script>
            // Initialize markdown-it with full plugin set
            const md = markdownit({
              html: true,
              linkify: true,
              typographer: true
            })
            .use(markdownitFootnote)
            .use(markdownitDeflist)
            .use(markdownitAbbr)
            .use(markdownitEmoji, { defs: {} })
            .use(markdownitTaskLists);
            
            // Configure DOMPurify to allow all necessary HTML tags and attributes
            const ALLOWED_TAGS = [
              'p','br','hr','h1','h2','h3','h4','h5','h6','strong','em','b','i','u','s','strike','del',
              'a','img','code','pre','blockquote','ul','ol','li','dl','dt','dd','table','thead','tbody',
              'tr','th','td','caption','sup','sub','details','summary','div','span','abbr','kbd','mark',
              'section','header','footer','nav','article','aside','figure','figcaption','time','ruby',
              'rt','rp','bdo','bdi','wbr','iframe','audio','video','source','track','canvas','svg'
            ];
            const ALLOWED_ATTR = [
              'href','target','rel','title','src','alt','width','height','class','id','style',
              'align','valign','border','cellpadding','cellspacing','colspan','rowspan',
              'controls','autoplay','loop','muted','poster','preload','playsinline',
              'data-*','aria-*','role','tabindex'
            ];
            DOMPurify.addHook('uponSanitizeAttribute', function(node, data) {
              if (data.attrName === 'style') {
                // Allow style attributes but sanitize content (basic)
                data.attrValue = DOMPurify.sanitize(data.attrValue, { ALLOWED_TAGS: [], ALLOWED_ATTR: [] });
              }
            });
            
            // KaTeX math rendering helper
            function renderMath(element) {
              if (typeof renderMathInElement === 'function') {
                try {
                  renderMathInElement(element, {
                    delimiters: [
                      {left: '\\[', right: '\\]', display: true},
                      {left: '\\(', right: '\\)', display: false},
                      {left: '$$', right: '$$', display: true},
                      {left: '$', right: '$', display: false}
                    ],
                    throwOnError: false
                  });
                } catch(e) {
                  console.warn('Math rendering error:', e);
                }
              }
            }
            
            const $ = (id) => document.getElementById(id);
            
            const logInner = $('logInner');
            const logEl = $('log');
            const userInput = $('userInput');
            const sendButton = $('sendButton');
            const stopButton = $('stopButton');
            const attachBtn = $('attachBtn');
            const mediaInput = $('mediaInput');
            const mediaRow = $('mediaRow');
            const tokenCounter = $('tokenCounter');
            const temperatureEl = $('temperature');
            const maxTokensEl = $('maxTokens');
            const modelListContainer = $('modelListContainer');
            const topbarModel = $('topbarModel');
            const activityBar = $('activityBar');
            const activityText = $('activityText');
            const engineDot = $('engineDot');
            const engineText = $('engineText');
            const rack = $('rack');
            const scrim = $('scrim');
            const downloadModal = $('downloadModal');
            const modalTitle = $('modalTitle');
            const modalBar = $('modalBar');
            const modalPercent = $('modalPercent');
            const modalLogs = $('modalLogs');
            const modalCloseBtn = $('modalCloseBtn');
            const metricSpeed = $('metricSpeed');
            const metricSize = $('metricSize');
            const metricEta = $('metricEta');
            
            let isStreaming = false;
            let totalTokens = 0;
            let messageHistory = [];
            let controller = null;
            let currentModel = null;
            let attachedMediaBase64 = null;
            let knownModels = [];
            let removeMediaHandler = null;
            
            function escapeHtml(str) {
              if (!str) return '';
              const div = document.createElement('div');
              div.textContent = str;
              return div.innerHTML;
            }
            
            function renderMarkdown(el, text, loading) {
              if (!el) return;
              try {
                // Render markdown with markdown-it
                let rawHtml = md.render(text || '');
                // Sanitize with DOMPurify
                let cleanHtml = DOMPurify.sanitize(rawHtml, {
                  ALLOWED_TAGS: ALLOWED_TAGS,
                  ALLOWED_ATTR: ALLOWED_ATTR,
                  ADD_ATTR: ['target']
                });
                el.innerHTML = cleanHtml + (loading ? '<span class="cursor-blink"></span>' : '');
                
                // Apply syntax highlighting
                if (typeof hljs !== 'undefined') {
                  el.querySelectorAll('pre code').forEach((block) => {
                    hljs.highlightElement(block);
                  });
                }
                
                // Render math (KaTeX)
                renderMath(el);
              } catch (e) {
                console.error('Markdown rendering error:', e);
                el.textContent = text || '';
              }
            }
            
            function setActivity(text) {
              if (!activityBar || !activityText) return;
              if (text) {
                activityBar.style.display = 'flex';
                activityText.textContent = text;
              } else {
                activityBar.style.display = 'none';
              }
            }
            
            function renderMeterSegments(container, percent, segCount) {
              if (!container) return;
              const on = Math.round((percent / 100) * segCount);
              let html = '';
              for (let i = 0; i < segCount; i++) {
                html += '<div class="meter-seg' + (i < on ? ' on' : '') + '"></div>';
              }
              container.innerHTML = html;
            }
            
            function openRack() { 
              if (rack) rack.classList.add('open'); 
              if (scrim) scrim.classList.add('show'); 
            }
            
            function closeRack() { 
              if (rack) rack.classList.remove('open'); 
              if (scrim) scrim.classList.remove('show'); 
            }
            
            if ($('rackOpenBtn')) $('rackOpenBtn').addEventListener('click', openRack);
            if ($('rackClose')) $('rackClose').addEventListener('click', closeRack);
            if (scrim) scrim.addEventListener('click', closeRack);
            
            function cleanupMediaListener() {
              if (removeMediaHandler) {
                const btn = $('removeMediaBtn');
                if (btn) {
                  btn.removeEventListener('click', removeMediaHandler);
                }
                removeMediaHandler = null;
              }
            }
            
            if (attachBtn) {
              attachBtn.addEventListener('click', () => {
                if (mediaInput) mediaInput.click();
              });
            }
            
            if (mediaInput) {
              mediaInput.addEventListener('change', (event) => {
                const file = event.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = (e) => {
                  attachedMediaBase64 = e.target.result.split(',')[1];
                  
                  cleanupMediaListener();
                  
                  if (mediaRow) {
                    mediaRow.innerHTML = `
                      <div class="media-chip">
                        <img src="${e.target.result}" alt="Attached image preview">
                        <button class="rm" id="removeMediaBtn" aria-label="Remove attached image">✕</button>
                      </div>`;
                    
                    removeMediaHandler = removeMedia;
                    const removeBtn = $('removeMediaBtn');
                    if (removeBtn) {
                      removeBtn.addEventListener('click', removeMedia);
                    }
                  }
                };
                reader.onerror = () => {
                  console.error('Failed to read file');
                };
                reader.readAsDataURL(file);
              });
            }
            
            function removeMedia() {
              attachedMediaBase64 = null;
              if (mediaRow) mediaRow.innerHTML = '';
              if (mediaInput) mediaInput.value = '';
              cleanupMediaListener();
            }
            
            async function fetchSysInfo() {
              try {
                const r = await fetch('/api/sysinfo');
                if (!r.ok) throw new Error('Failed to fetch sysinfo');
                const data = await r.json();
                const sysSpecs = $('sysSpecs');
                if (sysSpecs) {
                  sysSpecs.textContent = data.os + ' · ' + data.cpu_threads + ' threads · ' + data.ram_total + ' RAM';
                }
              } catch (e) {
                console.error('SysInfo error:', e);
                const sysSpecs = $('sysSpecs');
                if (sysSpecs) sysSpecs.textContent = 'Host specs unavailable';
              }
            }
            
            async function fetchStats() {
              try {
                const r = await fetch('/api/stats');
                if (!r.ok) return;
                const data = await r.json();
                const cpuVal = $('cpuVal');
                const cpuMeter = $('cpuMeter');
                const ramVal = $('ramVal');
                const ramMeter = $('ramMeter');
                const diskFreeVal = $('diskFreeVal');
                
                if (cpuVal) cpuVal.textContent = data.cpu_percent.toFixed(0) + '%';
                if (cpuMeter) renderMeterSegments(cpuMeter, data.cpu_percent, 20);
                if (ramVal) ramVal.textContent = data.ram_percent.toFixed(0) + '%';
                if (ramMeter) renderMeterSegments(ramMeter, data.ram_percent, 20);
                if (diskFreeVal) diskFreeVal.textContent = data.disk_free;
              } catch (e) {}
            }
            
            async function pollHealth() {
              try {
                const r = await fetch('/api/health');
                if (r.ok) {
                  if (engineDot) engineDot.className = 'status-dot ok';
                  if (engineText) engineText.textContent = 'Engine online';
                } else {
                  throw new Error('unhealthy');
                }
              } catch (e) {
                if (engineDot) engineDot.className = 'status-dot bad';
                if (engineText) engineText.textContent = 'Engine unreachable';
              }
            }
            
            fetchSysInfo();
            fetchStats();
            pollHealth();
            setInterval(fetchStats, 3000);
            setInterval(pollHealth, 8000);
            
            async function loadModels() {
              try {
                const resp = await fetch('/api/models');
                if (!resp.ok) throw new Error('bad response');
                const data = await resp.json();
                knownModels = data.models || [];
                renderModelList();
                
                const downloaded = knownModels.filter(m => m.downloaded);
                if (!currentModel && downloaded.length > 0) {
                  const nonImage = downloaded.find(m => m.type !== 'image');
                  if (nonImage) selectModel(nonImage.name);
                }
                updateComposerState();
              } catch (e) {
                console.error('Load models error:', e);
                if (modelListContainer) {
                  modelListContainer.innerHTML = '<div class="model-list-empty">Could not reach engine. Hit refresh.</div>';
                }
              }
            }
            
            function renderModelList() {
              if (!modelListContainer) return;
              
              if (!knownModels.length) {
                modelListContainer.innerHTML = '<div class="model-list-empty">No models found.</div>';
                return;
              }
              
              modelListContainer.innerHTML = knownModels.map(function(m) {
                var active = m.name === currentModel;
                var escapedName = escapeHtml(m.name);
                var dlHtml = !m.downloaded ? '<button class="dl-btn" data-pull="' + escapedName + '">Pull</button>' : '';
                var typeClass = m.type === 'image' ? 'image' : m.type;
                return `
                  <div class="model-row ${active ? ' active' : ''}" data-model="${escapedName}" data-downloaded="${m.downloaded ? '1' : '0'}" data-clickable="${m.downloaded ? '1' : '0'}">
                    <span class="model-dot"></span>
                    <div class="model-meta">
                      <span class="model-name">${escapedName}</span>
                      <div class="model-flags">
                        <span class="model-chip ${typeClass}">${m.type}</span>
                        <span class="model-chip">${m.downloaded ? 'ready' : 'not pulled'}</span>
                      </div>
                    </div>
                    ${dlHtml}
                  </div>`;
              }).join('');
            }
            
            if (modelListContainer) {
              modelListContainer.addEventListener('click', function(e) {
                var pullBtn = e.target.closest('[data-pull]');
                if (pullBtn) {
                  var modelName = pullBtn.getAttribute('data-pull');
                  if (modelName) startModelDownload(modelName);
                  return;
                }
                var row = e.target.closest('.model-row[data-clickable="1"]');
                if (row) {
                  var modelName = row.getAttribute('data-model');
                  if (modelName) selectModel(modelName);
                }
              });
            }
            
            if ($('refreshBtn')) {
              $('refreshBtn').addEventListener('click', loadModels);
            }
            
            function selectModel(modelName) {
              currentModel = modelName;
              if (topbarModel) topbarModel.textContent = modelName;
              renderModelList();
              updateComposerState();
            }
            
            function updateComposerState() {
              var ready = !!currentModel;
              if (userInput) userInput.disabled = !ready;
              if (sendButton) sendButton.disabled = !ready;
              if (userInput) {
                userInput.placeholder = ready
                  ? 'Ask a question, or attach an image...'
                  : 'Download a model from the panel to begin…';
              }
              if (!ready) {
                renderEmptyLog();
              }
            }
            
            function renderEmptyLog() {
              if (!logInner || messageHistory.length) return;
              logInner.innerHTML = `
                <div class="empty-state">
                  <h2>No model loaded yet</h2>
                  <p>Pick a model in the panel and hit "Pull" to download it, then select it to start a session.</p>
                </div>`;
            }
            
            function appendTerminalLog(msg, type) {
              if (!modalLogs) return;
              var line = document.createElement('div');
              line.className = 'term-line' + (type ? ' ' + type : '');
              line.textContent = msg;
              modalLogs.appendChild(line);
              modalLogs.scrollTop = modalLogs.scrollHeight;
            }
            
            function closeModal() { 
              if (downloadModal) downloadModal.style.display = 'none'; 
            }
            
            async function startModelDownload(modelName) {
              if (!downloadModal) return;
              
              downloadModal.style.display = 'flex';
              if (modalTitle) modalTitle.textContent = modelName;
              if (modalBar) modalBar.style.width = '0%';
              if (modalPercent) modalPercent.textContent = '0%';
              if (modalLogs) modalLogs.innerHTML = '';
              if (metricSpeed) metricSpeed.textContent = '—';
              if (metricSize) metricSize.textContent = '—';
              if (metricEta) metricEta.textContent = '—';
              if (modalCloseBtn) {
                modalCloseBtn.disabled = true;
                modalCloseBtn.textContent = 'Downloading…';
                modalCloseBtn.onclick = null;
              }
              
              try {
                var resp = await fetch('/api/pull', {
                  method: 'POST', 
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ model: modelName })
                });
                
                if (!resp.ok) throw new Error('Pull request failed');
                
                var reader = resp.body.getReader();
                var decoder = new TextDecoder();
                var buffer = '';
                var failed = false;
                
                while (true) {
                  var result = await reader.read();
                  if (result.done) break;
                  buffer += decoder.decode(result.value, { stream: true });
                  var lines = buffer.split('\n');
                  buffer = lines.pop() || '';
                  
                  for (var i = 0; i < lines.length; i++) {
                    var line = lines[i];
                    if (!line.startsWith('data: ')) continue;
                    if (line.slice(6) === '[DONE]') continue;
                    try {
                      var data = JSON.parse(line.slice(6));
                      if (data.error) {
                        appendTerminalLog(data.error, 'error');
                        failed = true;
                        if (modalCloseBtn) {
                          modalCloseBtn.disabled = false;
                          modalCloseBtn.textContent = 'Close';
                          modalCloseBtn.onclick = closeModal;
                        }
                        continue;
                      }
                      if (data.raw) appendTerminalLog(data.raw);
                      if (data.percent !== undefined && data.percent !== null) {
                        if (modalBar) modalBar.style.width = data.percent + '%';
                        if (modalPercent) modalPercent.textContent = data.percent + '%';
                      }
                    } catch (e) {
                      console.warn('Parse error:', e);
                    }
                  }
                }
                
                if (!failed) {
                  if (modalBar) modalBar.style.width = '100%';
                  if (modalPercent) modalPercent.textContent = '100%';
                  if (modalCloseBtn) {
                    modalCloseBtn.disabled = false;
                    modalCloseBtn.textContent = 'Done — select model';
                    modalCloseBtn.onclick = function() { 
                      closeModal(); 
                      loadModels().then(function() {
                        if (modelName) selectModel(modelName);
                      });
                    };
                  }
                  loadModels();
                }
              } catch (err) {
                console.error('Download error:', err);
                appendTerminalLog('Connection lost: ' + err.message, 'error');
                if (modalCloseBtn) {
                  modalCloseBtn.disabled = false;
                  modalCloseBtn.textContent = 'Close';
                  modalCloseBtn.onclick = closeModal;
                }
              }
            }
            
            function appendTurn(role, htmlContent, isLoading, isError) {
              if (!logInner) return null;
              var turn = document.createElement('div');
              turn.className = 'turn ' + role + (isError ? ' error' : '');
              var label = role === 'user' ? 'You' : 'Console';
              turn.innerHTML = '<div class="turn-label">' + label + '</div><div class="turn-body"></div>';
              logInner.appendChild(turn);
              var body = turn.querySelector('.turn-body');
              renderMarkdown(body, htmlContent, isLoading);
              if (logEl) logEl.scrollTop = logEl.scrollHeight;
              return body;
            }
            
            function updateLastAssistantTurn(content, complete) {
              if (!logInner) return;
              var turns = logInner.querySelectorAll('.turn.assistant');
              if (!turns.length) return;
              renderMarkdown(turns[turns.length - 1].querySelector('.turn-body'), content, !complete);
              if (logEl) logEl.scrollTop = logEl.scrollHeight;
            }
            
            function newSession() {
              if (logInner) logInner.innerHTML = '';
              messageHistory = [];
              totalTokens = 0;
              if (tokenCounter) tokenCounter.textContent = '0 tokens generated';
              if (!currentModel) renderEmptyLog();
            }
            
            if ($('newSessionBtn')) {
              $('newSessionBtn').addEventListener('click', newSession);
            }
            
            function stopGenerating() { 
              if (controller) {
                controller.abort();
                controller = null;
              }
            }
            
            if (stopButton) {
              stopButton.addEventListener('click', stopGenerating);
            }
            
            async function sendMessage() {
              if (isStreaming || !currentModel) return;
              var text = userInput ? userInput.value.trim() : '';
              if (!text && !attachedMediaBase64) return;
              
              var displayHtml = escapeHtml(text).replace(/\n/g, '<br>');
              var userMessageObj = { role: 'user', content: text };
              
              if (attachedMediaBase64) {
                userMessageObj.images = [attachedMediaBase64];
                displayHtml += '<br><img src="data:image/jpeg;base64,' + attachedMediaBase64 + '" alt="Attached image">';
              }
              
              appendTurn('user', displayHtml, false, false);
              messageHistory.push(userMessageObj);
              
              if (userInput) {
                userInput.value = '';
                userInput.style.height = 'auto';
              }
              removeMedia();
              
              if (sendButton) sendButton.style.display = 'none';
              if (stopButton) stopButton.style.display = 'flex';
              isStreaming = true;
              controller = new AbortController();
              
              setActivity('Connecting to engine…');
              appendTurn('assistant', '', true, false);
              
              var fullContent = '';
              try {
                var response = await fetch('/api/chat', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  signal: controller.signal,
                  body: JSON.stringify({
                    messages: messageHistory,
                    model: currentModel,
                    temperature: parseFloat(temperatureEl ? temperatureEl.value : 0.7),
                    max_tokens: parseInt(maxTokensEl ? maxTokensEl.value : 2048, 10)
                  })
                });
                
                if (!response.ok) {
                  throw new Error('HTTP ' + response.status + ': ' + response.statusText);
                }
                
                var reader = response.body.getReader();
                var decoder = new TextDecoder();
                var buffer = '';
                var streamError = null;
                
                while (true) {
                  var result = await reader.read();
                  if (result.done) break;
                  buffer += decoder.decode(result.value, { stream: true });
                  var lines = buffer.split('\n');
                  buffer = lines.pop() || '';
                  for (var i = 0; i < lines.length; i++) {
                    var line = lines[i];
                    if (!line.startsWith('data: ')) continue;
                    if (line.slice(6) === '[DONE]') continue;
                    try {
                      var parsed = JSON.parse(line.slice(6));
                      if (parsed.error) streamError = parsed.error;
                      else if (parsed.content) {
                        fullContent += parsed.content;
                        updateLastAssistantTurn(fullContent, false);
                      }
                    } catch (e) {
                      console.warn('Stream parse error:', e);
                    }
                  }
                }
                
                setActivity(null);
                if (streamError) throw new Error(streamError);
                updateLastAssistantTurn(fullContent, true);
                messageHistory.push({ role: 'assistant', content: fullContent });
                totalTokens += Math.ceil(fullContent.length / 4);
                if (tokenCounter) tokenCounter.textContent = totalTokens + ' tokens generated';
              } catch (error) {
                setActivity(null);
                var aborted = error.name === 'AbortError';
                updateLastAssistantTurn(aborted ? '_Generation stopped._' : 'Error: ' + (error.message || 'request failed.'), true);
              } finally {
                if (sendButton) sendButton.style.display = 'flex';
                if (stopButton) stopButton.style.display = 'none';
                isStreaming = false;
                controller = null;
                if (userInput) userInput.focus();
              }
            }
            
            if (sendButton) {
              sendButton.addEventListener('click', sendMessage);
            }
            
            if (userInput) {
              userInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                  e.preventDefault();
                  sendMessage();
                }
              });
              
              userInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 200) + 'px';
              });
            }
            
            if (temperatureEl) {
              temperatureEl.addEventListener('input', function() { 
                var tempVal = $('tempVal');
                if (tempVal) tempVal.textContent = this.value; 
              });
            }
            
            if (maxTokensEl) {
              maxTokensEl.addEventListener('input', function() { 
                var tokenVal = $('tokenVal');
                if (tokenVal) tokenVal.textContent = this.value; 
              });
            }
            
            renderEmptyLog();
            loadModels();
          </script>
          </body>
          </html>
          """
          if __name__ == "__main__":
              uvicorn.run(app, host="0.0.0.0", port=PORT)
          PYEOF
          echo "✅ Server script written successfully"
      - name: 🌐 Start web server
        run: |
          echo "──────────────────────────────────────────"
          echo " 🌐   Starting web UI"
          echo "──────────────────────────────────────────"
          nohup python ollama_server.py > /tmp/webui.log 2>&1 &
          echo $! > /tmp/webui.pid
          ready=false
          for i in $(seq 1 15); do
            if curl -sf "http://localhost:${PORT}" > /dev/null 2>&1; then
              echo "✅ Web UI is ready!"
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            echo "❌ Web UI failed to start. Last logs:"
            tail -n 50 /tmp/webui.log || true
            exit 1
          fi
      - name: 📦 Install cloudflared
        run: |
          curl -L -s https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/
          cloudflared --version
      - name: 🌐 Create tunnel and wait
        run: |
          echo "──────────────────────────────────────────"
          echo " 🌐   Creating Cloudflare tunnel"
          echo "──────────────────────────────────────────"
          cloudflared tunnel --url "http://127.0.0.1:${PORT}" --protocol http2 > tunnel.log 2>&1 &
          TUNNEL_PID=$!
          echo "⏳ Waiting for tunnel URL..."
          TUNNEL_URL=""
          for i in $(seq 1 30); do
            TUNNEL_URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' tunnel.log 2>/dev/null | head -1)
            [ -n "$TUNNEL_URL" ] && break
            sleep 2
          done
          if [ -z "$TUNNEL_URL" ]; then
            echo "❌ Could not get a tunnel URL. Tunnel log:"
            cat tunnel.log
            exit 1
          fi
          echo ""
          echo "╔═══════════════════════════════════════════════════════════════════╗"
          echo "║                🎉  Y O U R    L L M    I S    R E A D Y  🎉       ║"
          echo "╠═══════════════════════════════════════════════════════════════════╣"
          echo "║  🔗  $TUNNEL_URL"
          echo "╚═══════════════════════════════════════════════════════════════════╝"
          {
            echo "## 🦙 Your LLM + Image Model Web UI is live"
            echo ""
            echo "**URL:** $TUNNEL_URL"
            echo ""
            echo "**Catalog Models:** 100+ Ollama LLMs + 5 external image models (downloadable from Hugging Face)"
            echo "**Context:** ${CONTEXT_SIZE} tokens"
            echo "**Markdown:** Full GFM + footnotes, definition lists, abbreviations, emoji, HTML, and KaTeX math"
            echo ""
            echo "> Image models are listed as `image` type. They cannot be used for chat, but you can download them via the UI."
          } >> "$GITHUB_STEP_SUMMARY"
          wait "$TUNNEL_PID"
      - name: 🧹 Cleanup
        if: always()
        run: |
          pkill -f "cloudflared" 2>/dev/null || true
          pkill -f "python ollama_server" 2>/dev/null || true
          pkill -f "ollama serve" 2>/dev/null || true
          echo "✅ Cleanup complete"
