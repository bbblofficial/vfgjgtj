              {"name": "mistral:7b-instruct-v0.3-q3_K_M", "type": "general"},
              {"name": "mistral:7b-instruct-v0.3-q3_K_L", "type": "general"},
              {"name": "mistral:7b-instruct-v0.3-q4_0", "type": "general"},
              {"name": "mistral:7b-instruct-v0.3-q4_1", "type": "general"},
              {"name": "mistral:7b-instruct-v0.3-q4_K_S", "type": "general"},
              {"name": "mistral:7b-instruct-q4_K_M", "type": "general"},
              {"name": "mistral:7b-instruct-v0.3-q4_K_M", "type": "general"},
              {"name": "mistral:7b-instruct-q5_0", "type": "general"},
              {"name": "mistral:7b-instruct-v0.3-q5_0", "type": "general"},
              {"name": "mistral:7b-instruct-q5_1", "type": "general"},
              {"name": "mistral:7b-instruct-v0.3-q5_1", "type": "general"},
              {"name": "mistral:7b-instruct-q5_K_S", "type": "general"},
              {"name": "mistral:7b-instruct-v0.3-q5_K_S", "type": "general"},
              {"name": "mistral:7b-instruct-q5_K_M", "type": "general"},
              {"name": "mistral:7b-instruct-v0.3-q5_K_M", "type": "general"},
              {"name": "mistral:7b-instruct-q6_K", "type": "general"},
              {"name": "mistral:7b-instruct-v0.3-q6_K", "type": "general"},
              {"name": "mistral:7b-instruct-q8_0", "type": "general"},
              {"name": "mistral:7b-instruct-v0.3-q8_0", "type": "general"},
              {"name": "mistral:7b-instruct-fp16", "type": "general"},
