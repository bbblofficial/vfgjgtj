name: 🦙🎬 All-in-One AI Studio (LLM + LongCat-Video)

on:
  workflow_dispatch:
    inputs:
      port:
        description: '🔌 Web UI port'
        required: false
        default: '7860'
        type: string
      context_size:
        description: '📝 LLM Context window (tokens)'
        required: false
        default: '4096'
        type: string
      enable_longcat:
        description: '🎬 Enable Meituan LongCat-Video engine'
        required: false
        default: true
        type: boolean
      longcat_model:
        description: '📦 LongCat Model Weights to Pull'
        required: false
        default: 'LongCat-Video-Avatar-1.5'
        type: choice
        options:
          - LongCat-Video-Avatar-1.5
          - LongCat-Video-Avatar
          - LongCat-Video

permissions:
  contents: read

concurrency:
  group: ai-studio-workspace
  cancel-in-progress: true

jobs:
  deploy-ai-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CONTEXT_SIZE: ${{ inputs.context_size }}
      PORT: ${{ inputs.port }}
      ENABLE_LONGCAT: ${{ inputs.enable_longcat }}
      LONGCAT_MODEL: ${{ inputs.longcat_model }}
    steps:
      - name: 🚀 System Banner & Specs
        run: |
          echo "╔═══════════════════════════════════════════════════════════════════╗"
          echo "║       🦙 🎬  U N I F I E D   A I   S T U D I O   E N G I N E      ║"
          echo "╚═══════════════════════════════════════════════════════════════════╝"
          echo "  📝 LLM Context:       ${CONTEXT_SIZE} tokens"
          echo "  🔌 Web Interface:     Port ${PORT}"
          echo "  🎬 LongCat Enabled:    ${ENABLE_LONGCAT}"
          echo "  📦 LongCat Model:      ${LONGCAT_MODEL}"
          echo "  🏃 Runner Platform:   $(uname -a)"
          echo "  💾 Available Memory:  $(free -h | awk '/Mem:/{print $2}')"
          echo "  🧠 CPU Threads:       $(nproc)"
          echo "  ⏱️ Job Timeout:       6 Hours (360 minutes)"

      - name: 🧹 Maximize Runner Storage
        uses: easimon/maximize-build-space@master
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: 🐍 Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install Ollama & Base Dependencies
        run: |
          echo "──────────────────────────────────────────"
          echo " 📦 Installing Ollama and Python Libraries"
          echo "──────────────────────────────────────────"
          curl -fsSL https://ollama.com/install.sh | sh
          pip install --no-cache-dir \
            fastapi uvicorn aiohttp httpx python-multipart \
            jinja2 websockets pydantic psutil huggingface_hub[cli]

      - name: 🎬 Prepare LongCat-Video Framework
        if: ${{ inputs.enable_longcat == true }}
        run: |
          echo "──────────────────────────────────────────"
          echo " 🎬 Cloning LongCat-Video & Installing Torch"
          echo "──────────────────────────────────────────"
          sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
          
          git clone --single-branch --branch main https://github.com/meituan-longcat/LongCat-Video.git
          cd LongCat-Video
          
          # Install PyTorch with CUDA 12.4
          pip install --no-cache-dir torch==2.6.0+cu124 torchvision==0.21.0+cu124 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cu124
          
          # Install Flash-Attention pre-reqs
          pip install --no-cache-dir ninja packaging
          pip install --no-cache-dir -r requirements.txt || true
          pip install --no-cache-dir librosa -r requirements_avatar.txt || true
          
          # Try installing flash-attn without failing workflow if GPU compiler is absent
          pip install flash_attn==2.7.4.post1 --no-build-isolation || echo "⚠️ flash-attn fallback to standard attention"
          
          echo "⬇️ Pre-fetching weights for ${LONGCAT_MODEL}..."
          mkdir -p weights/${LONGCAT_MODEL}
          huggingface-cli download meituan-longcat/${LONGCAT_MODEL} --local-dir ./weights/${LONGCAT_MODEL} || echo "Weights can also be downloaded on-demand"

      - name: 🚀 Start Ollama Engine
        run: |
          echo "──────────────────────────────────────────"
          echo " 🚀 Booting Ollama Daemon"
          echo "──────────────────────────────────────────"
          sudo systemctl stop ollama 2>/dev/null || true
          sudo systemctl disable ollama 2>/dev/null || true
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          echo $! > /tmp/ollama.pid
          
          ready=false
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:11434/api/tags > /dev/null 2>&1; then
              echo "✅ Ollama is ready!"
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            echo "❌ Ollama failed to start. Logs:"
            tail -n 50 /tmp/ollama.log || true
            exit 1
          fi

      - name: 🔧 Build Unified AI Web Application
        run: |
          cat > unified_server.py << 'PYEOF'
          import os
          import json
          import logging
          import platform
          import psutil
          import subprocess
          import shutil
          from typing import Optional, List
          import httpx
          import uvicorn
          from fastapi import FastAPI, HTTPException, UploadFile, File, Form
          from fastapi.responses import HTMLResponse, StreamingResponse, FileResponse
          from fastapi.staticfiles import StaticFiles
          from pydantic import BaseModel

          logging.basicConfig(level=logging.INFO)
          logger = logging.getLogger("unified-ai")

          OLLAMA_HOST = os.getenv("OLLAMA_HOST", "http://127.0.0.1:11434")
          CONTEXT_SIZE = int(os.getenv("CONTEXT_SIZE", "4096"))
          PORT = int(os.getenv("PORT", "7860"))
          ENABLE_LONGCAT = os.getenv("ENABLE_LONGCAT", "true").lower() == "true"
          LONGCAT_DIR = os.path.abspath("LongCat-Video")
          OUTPUT_DIR = os.path.abspath("generated_outputs")
          os.makedirs(OUTPUT_DIR, exist_ok=True)

          app = FastAPI(title="Unified AI Studio")

          CATALOG_MODELS = [
              {"name": "qwen2.5:0.5b", "type": "general"},
              {"name": "qwen2.5:1.5b", "type": "general"},
              {"name": "qwen2.5:3b", "type": "general"},
              {"name": "qwen2.5:7b", "type": "general"},
              {"name": "qwen2.5-coder:1.5b", "type": "code"},
              {"name": "qwen2.5-coder:7b", "type": "code"},
              {"name": "deepseek-r1:1.5b", "type": "reasoning"},
              {"name": "deepseek-r1:7b", "type": "reasoning"},
              {"name": "llama3.2:1b", "type": "general"},
              {"name": "llama3.2:3b", "type": "general"},
              {"name": "tinyllama", "type": "general"},
              {"name": "gemma2:2b", "type": "general"},
              {"name": "phi3.5", "type": "general"},
              {"name": "mistral:7b", "type": "general"}
          ]

          LONGCAT_MODELS = [
              "LongCat-Video-Avatar-1.5",
              "LongCat-Video-Avatar",
              "LongCat-Video"
          ]

          class ChatMessage(BaseModel):
              role: str
              content: str
              images: Optional[List[str]] = None

          class ChatRequest(BaseModel):
              messages: List[ChatMessage]
              model: str
              temperature: Optional[float] = 0.7
              max_tokens: Optional[int] = 2048

          class PullRequest(BaseModel):
              model: str

          class VideoGenRequest(BaseModel):
              task: str
              model: str
              prompt: str
              ref_image: Optional[str] = None
              audio_file: Optional[str] = None
              steps: Optional[int] = 8

          @app.get("/api/health")
          async def health():
              try:
                  async with httpx.AsyncClient(timeout=3) as client:
                      r = await client.get(f"{OLLAMA_HOST}/api/tags")
                      r.raise_for_status()
                  return {"status": "ok", "longcat_available": ENABLE_LONGCAT and os.path.exists(LONGCAT_DIR)}
              except Exception as exc:
                  raise HTTPException(status_code=503, detail=str(exc))

          @app.get("/api/sysinfo")
          def sysinfo():
              try:
                  return {
                      "cpu_threads": psutil.cpu_count(logical=True),
                      "ram_total": f"{psutil.virtual_memory().total / (1024**3):.1f} GB",
                      "os": platform.system() + " " + platform.release(),
                      "longcat_enabled": ENABLE_LONGCAT
                  }
              except Exception:
                  return {"cpu_threads": 4, "ram_total": "16.0 GB", "os": "Linux", "longcat_enabled": ENABLE_LONGCAT}

          @app.get("/api/stats")
          def stats():
              try:
                  disk = psutil.disk_usage('/')
                  return {
                      "cpu_percent": psutil.cpu_percent(interval=None),
                      "ram_percent": psutil.virtual_memory().percent,
                      "ram_used": f"{psutil.virtual_memory().used / (1024**3):.1f} GB",
                      "disk_free": f"{disk.free / (1024**3):.1f} GB free"
                  }
              except Exception:
                  return {"cpu_percent": 0.0, "ram_percent": 0.0, "ram_used": "0 GB", "disk_free": "100 GB"}

          @app.get("/api/models")
          async def list_models():
              pulled_names = set()
              try:
                  async with httpx.AsyncClient(timeout=4) as client:
                      r = await client.get(f"{OLLAMA_HOST}/api/tags")
                      if r.status_code == 200:
                          pulled_names = {m["name"] for m in r.json().get("models", [])}
              except Exception:
                  pass

              return {
                  "llm_models": [{
                      "name": item["name"],
                      "type": item["type"],
                      "downloaded": item["name"] in pulled_names
                  } for item in CATALOG_MODELS],
                  "video_models": LONGCAT_MODELS
              }

          @app.post("/api/pull")
          async def pull_model(req: PullRequest):
              async def generate_pull():
                  try:
                      proc = subprocess.Popen(["ollama", "pull", req.model], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
                      for line in proc.stdout:
                          line_str = line.strip()
                          if not line_str:
                              continue
                          percent = None
                          if "%" in line_str:
                              for p in line_str.split():
                                  if p.endswith("%"):
                                      try:
                                          percent = int(p.rstrip("%"))
                                      except ValueError:
                                          pass
                          yield f"data: {json.dumps({'raw': line_str, 'percent': percent})}\n\n"
                      proc.wait()
                      yield "data: [DONE]\n\n"
                  except Exception as e:
                      yield f"data: {json.dumps({'error': str(e)})}\n\n"
              return StreamingResponse(generate_pull(), media_type="text/event-stream")

          @app.post("/api/chat")
          async def chat(request: ChatRequest):
              ollama_messages = [{"role": m.role, "content": m.content, **({"images": m.images} if m.images else {})} for m in request.messages]

              async def generate():
                  try:
                      async with httpx.AsyncClient(timeout=180) as client:
                          async with client.stream(
                              "POST",
                              f"{OLLAMA_HOST}/api/chat",
                              json={
                                  "model": request.model,
                                  "messages": ollama_messages,
                                  "stream": True,
                                  "options": {
                                      "temperature": request.temperature,
                                      "num_predict": request.max_tokens,
                                      "num_ctx": CONTEXT_SIZE
                                  }
                              }
                          ) as resp:
                              if resp.status_code != 200:
                                  err = await resp.aread()
                                  yield f"data: {json.dumps({'error': err.decode(errors='ignore')})}\n\n"
                                  yield "data: [DONE]\n\n"
                                  return
                              async for line in resp.aiter_lines():
                                  line = line.strip()
                                  if not line:
                                      continue
                                  try:
                                      obj = json.loads(line)
                                      if obj.get("error"):
                                          yield f"data: {json.dumps({'error': obj['error']})}\n\n"
                                      content = obj.get("message", {}).get("content")
                                      if content:
                                          yield f"data: {json.dumps({'content': content})}\n\n"
                                  except json.JSONDecodeError:
                                      continue
                  except Exception as exc:
                      yield f"data: {json.dumps({'error': str(exc)})}\n\n"
                  yield "data: [DONE]\n\n"
              return StreamingResponse(generate(), media_type="text/event-stream")

          @app.post("/api/video/generate")
          async def generate_video(req: VideoGenRequest):
              if not ENABLE_LONGCAT or not os.path.exists(LONGCAT_DIR):
                  raise HTTPException(status_code=400, detail="LongCat-Video engine is not enabled or not installed.")

              async def run_video_pipeline():
                  yield f"data: {json.dumps({'raw': f'🚀 Starting LongCat pipeline for task: {req.task} using {req.model}'})}\n\n"
                  
                  cmd = ["python", "run_demo_text_to_video.py", f"--checkpoint_dir=./weights/{req.model}"]
                  if req.task == "i2v":
                      cmd = ["python", "run_demo_image_to_video.py", f"--checkpoint_dir=./weights/{req.model}"]
                  elif req.task == "avatar":
                      cmd = ["python", "run_demo_avatar_single_audio_to_video.py", f"--checkpoint_dir=./weights/{req.model}", "--use_distill", "--model_type", "avatar-v1.5"]

                  try:
                      proc = subprocess.Popen(cmd, cwd=LONGCAT_DIR, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
                      for line in proc.stdout:
                          line_str = line.strip()
                          if line_str:
                              yield f"data: {json.dumps({'raw': line_str})}\n\n"
                      proc.wait()
                      yield f"data: {json.dumps({'raw': '🎉 LongCat Video Task Completed!'})}\n\n"
                      yield "data: [DONE]\n\n"
                  except Exception as e:
                      yield f"data: {json.dumps({'error': str(e)})}\n\n"

              return StreamingResponse(run_video_pipeline(), media_type="text/event-stream")

          @app.get("/api/video/gallery")
          def get_gallery():
              files = []
              if os.path.exists(OUTPUT_DIR):
                  files = [f for f in os.listdir(OUTPUT_DIR) if f.endswith(('.mp4', '.gif', '.png', '.jpg'))]
              return {"files": files}

          @app.get("/", response_class=HTMLResponse)
          async def index():
              return HTML_CONTENT

          HTML_CONTENT = """<!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Unified AI Studio - LLM & LongCat</title>
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
          <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
          <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
          <style>
            :root {
              --ink: #0d0e12;
              --panel: #14171f;
              --panel-raised: #1b202c;
              --rule: #283042;
              --rule-bright: #3a4761;
              --ivory: #e6ebf5;
              --dust: #8b9bb4;
              --dust-dim: #54627a;
              --cyan: #00e5ff;
              --cyan-dim: rgba(0, 229, 255, 0.12);
              --cyan-line: rgba(0, 229, 255, 0.35);
              --amber: #f59e0b;
              --signal: #10b981;
              --alert: #ef4444;
              --radius: 8px;
            }
            * { margin:0; padding:0; box-sizing:border-box; }
            body {
              background: var(--ink); color: var(--ivory); height: 100vh; display: flex; overflow: hidden;
              font-family: 'IBM Plex Sans', sans-serif; font-size: 14px;
            }
            .sidebar {
              width: 320px; background: var(--panel); border-right: 1px solid var(--rule);
              display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto;
            }
            .brand {
              padding: 16px; border-bottom: 1px solid var(--rule); display: flex; align-items: center; gap: 10px;
            }
            .brand-icon {
              width: 34px; height: 34px; border-radius: var(--radius); background: var(--cyan-dim);
              border: 1px solid var(--cyan-line); display: flex; align-items: center; justify-content: center; font-size: 16px;
            }
            .brand-title { font-family: 'Space Grotesk'; font-size: 16px; font-weight: 700; color: #fff; }
            .brand-sub { font-size: 10px; font-family: 'JetBrains Mono'; color: var(--cyan); }
            .nav-tabs {
              display: grid; grid-template-columns: 1fr 1fr; padding: 10px; gap: 6px; border-bottom: 1px solid var(--rule);
            }
            .tab-btn {
              padding: 8px; background: var(--panel-raised); border: 1px solid var(--rule);
              border-radius: var(--radius); color: var(--dust); cursor: pointer; font-size: 12px; font-weight: 600;
              transition: all 0.2s ease;
            }
            .tab-btn.active {
              background: var(--cyan-dim); border-color: var(--cyan-line); color: var(--cyan);
            }
            .section { padding: 16px; border-bottom: 1px solid var(--rule); }
            .sec-title {
              font-size: 11px; font-weight: 600; color: var(--dust-dim); text-transform: uppercase;
              letter-spacing: 0.05em; margin-bottom: 10px; display: flex; justify-content: space-between;
            }
            .model-list { display: flex; flex-direction: column; gap: 4px; max-height: 240px; overflow-y: auto; }
            .model-item {
              display: flex; align-items: center; justify-content: space-between; padding: 7px 10px;
              border-radius: 6px; background: var(--panel-raised); border: 1px solid transparent; cursor: pointer;
            }
            .model-item.active { border-color: var(--cyan-line); background: var(--cyan-dim); }
            .model-name { font-family: 'JetBrains Mono'; font-size: 11px; color: var(--ivory); }
            .btn-pull {
              background: transparent; border: 1px solid var(--rule-bright); color: var(--dust);
              font-size: 10px; padding: 2px 6px; border-radius: 4px; cursor: pointer;
            }
            .btn-pull:hover { color: var(--cyan); border-color: var(--cyan); }
            .main-view { flex: 1; display: flex; flex-direction: column; height: 100vh; position: relative; }
            .view-panel { display: none; flex: 1; flex-direction: column; height: 100%; overflow: hidden; }
            .view-panel.active { display: flex; }
            .chat-feed { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
            .turn { max-width: 720px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; }
            .turn.user { align-items: flex-end; }
            .turn.assistant { align-items: flex-start; }
            .bubble {
              padding: 12px 16px; border-radius: var(--radius); line-height: 1.6; max-width: 85%;
              background: var(--panel); border: 1px solid var(--rule); word-break: break-word;
            }
            .turn.user .bubble { background: var(--cyan-dim); border-color: var(--cyan-line); }
            .composer {
              padding: 16px 24px 20px; background: linear-gradient(180deg, transparent 0%, var(--ink) 40%);
            }
            .dock {
              max-width: 720px; margin: 0 auto; background: var(--panel); border: 1px solid var(--rule);
              border-radius: var(--radius); display: flex; align-items: flex-end; padding: 8px 12px; gap: 8px;
            }
            .dock textarea {
              flex: 1; background: transparent; border: none; color: #fff; font-family: inherit; font-size: 14px;
              outline: none; resize: none; min-height: 24px; max-height: 180px; padding: 6px 0;
            }
            .btn-send {
              background: var(--cyan); color: #000; border: none; font-weight: 700; width: 32px; height: 32px;
              border-radius: 6px; cursor: pointer; flex-shrink: 0;
            }
            .video-studio { padding: 30px; max-width: 800px; margin: 0 auto; width: 100%; overflow-y: auto; }
            .form-grid { display: flex; flex-direction: column; gap: 16px; margin-top: 20px; }
            .form-group { display: flex; flex-direction: column; gap: 6px; }
            .form-group label { font-size: 12px; color: var(--dust); font-weight: 600; }
            .form-group input, .form-group select, .form-group textarea {
              background: var(--panel); border: 1px solid var(--rule); border-radius: var(--radius);
              padding: 10px 12px; color: #fff; font-family: inherit; font-size: 13px; outline: none;
            }
            .form-group input:focus, .form-group textarea:focus { border-color: var(--cyan-line); }
            .btn-gen {
              padding: 12px; background: var(--cyan); color: #000; font-weight: 700; border: none;
              border-radius: var(--radius); cursor: pointer; margin-top: 10px; font-size: 14px;
            }
            .terminal {
              margin-top: 20px; background: #07080a; border: 1px solid var(--rule); border-radius: var(--radius);
              padding: 12px; font-family: 'JetBrains Mono'; font-size: 11px; color: #94a3b8; height: 160px; overflow-y: auto;
            }
          </style>
          </head>
          <body>
            <div class="sidebar">
              <div class="brand">
                <div class="brand-icon">🦙</div>
                <div>
                  <div class="brand-title">Unified Studio</div>
                  <div class="brand-sub">LLM + LongCat-Video</div>
                </div>
              </div>
              <div class="nav-tabs">
                <button class="tab-btn active" onclick="switchTab('chat')">💬 LLM Chat</button>
                <button class="tab-btn" onclick="switchTab('video')">🎬 LongCat</button>
              </div>
              <div class="section">
                <div class="sec-title"><span>LLM Models</span><button onclick="loadModels()" style="background:none; border:none; color:var(--cyan); cursor:pointer;">↻</button></div>
                <div class="model-list" id="llmList">Scanning models...</div>
              </div>
              <div class="section">
                <div class="sec-title"><span>Host Metrics</span></div>
                <div style="font-family:'JetBrains Mono'; font-size:11px; color:var(--dust);" id="hostStats">CPU: -- | RAM: --</div>
              </div>
            </div>

            <div class="main-view">
              <!-- LLM View -->
              <div class="view-panel active" id="chatPanel">
                <div class="chat-feed" id="chatFeed">
                  <div class="turn assistant">
                    <div class="bubble">Ready. Pick an Ollama model or jump to the 🎬 LongCat tab to generate videos.</div>
                  </div>
                </div>
                <div class="composer">
                  <div class="dock">
                    <textarea id="promptInput" rows="1" placeholder="Type your message..."></textarea>
                    <button class="btn-send" id="sendBtn" onclick="sendChat()">⏎</button>
                  </div>
                </div>
              </div>

              <!-- LongCat View -->
              <div class="view-panel" id="videoPanel">
                <div class="video-studio">
                  <h2>🎬 Meituan LongCat-Video Engine</h2>
                  <p style="color:var(--dust); margin-top:4px;">Generate high-consistency 720p 30fps text-to-video, image-to-video, or avatar animations.</p>
                  
                  <div class="form-grid">
                    <div class="form-group">
                      <label>Task Type</label>
                      <select id="videoTask">
                        <option value="t2v">Text-to-Video (T2V)</option>
                        <option value="i2v">Image-to-Video (I2V)</option>
                        <option value="avatar">Avatar Audio-to-Video (Avatar-1.5)</option>
                      </select>
                    </div>
                    <div class="form-group">
                      <label>Model Checkpoint</label>
                      <select id="videoModel">
                        <option value="LongCat-Video-Avatar-1.5">LongCat-Video-Avatar-1.5 (Whisper-large / 8-step Distill)</option>
                        <option value="LongCat-Video">LongCat-Video (13.6B Unified Core)</option>
                        <option value="LongCat-Video-Avatar">LongCat-Video-Avatar (wav2vec2)</option>
                      </select>
                    </div>
                    <div class="form-group">
                      <label>Prompt Description</label>
                      <textarea id="videoPrompt" rows="3" placeholder="A cinematic camera sweep of a cyberpunk city in rainy neon night, highly detailed, 4k..."></textarea>
                    </div>
                    <button class="btn-gen" onclick="triggerVideoGen()">Generate Video</button>
                    <div class="terminal" id="videoLogs">> LongCat inference console idle.</div>
                  </div>
                </div>
              </div>
            </div>

            <script>
              let activeTab = 'chat';
              let selectedModel = null;
              let chatHistory = [];

              function switchTab(tab) {
                activeTab = tab;
                document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', (i===0 && tab==='chat') || (i===1 && tab==='video')));
                document.getElementById('chatPanel').classList.toggle('active', tab === 'chat');
                document.getElementById('videoPanel').classList.toggle('active', tab === 'video');
              }

              async function loadModels() {
                try {
                  const res = await fetch('/api/models');
                  const data = await res.json();
                  const container = document.getElementById('llmList');
                  container.innerHTML = data.llm_models.map(m => `
                    <div class="model-item ${m.name === selectedModel ? 'active' : ''}" onclick="selectModel('${m.name}')">
                      <span class="model-name">${m.name}</span>
                      ${m.downloaded ? '<span style="color:var(--signal); font-size:10px;">ready</span>' : `<button class="btn-pull" onclick="event.stopPropagation(); pullModel('${m.name}')">pull</button>`}
                    </div>
                  `).join('');
                  if (!selectedModel && data.llm_models.some(m => m.downloaded)) {
                    selectModel(data.llm_models.find(m => m.downloaded).name);
                  }
                } catch(e) { console.error(e); }
              }

              function selectModel(name) {
                selectedModel = name;
                loadModels();
              }

              async function pullModel(name) {
                alert(`Starting pull for ${name}. Check logs.`);
                await fetch('/api/pull', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({model:name})});
                loadModels();
              }

              async function sendChat() {
                const input = document.getElementById('promptInput');
                const text = input.value.trim();
                if (!text || !selectedModel) return;
                input.value = '';

                const feed = document.getElementById('chatFeed');
                feed.innerHTML += `<div class="turn user"><div class="bubble">${text}</div></div>`;
                const assistantBubble = document.createElement('div');
                assistantBubble.className = 'turn assistant';
                assistantBubble.innerHTML = `<div class="bubble">...</div>`;
                feed.appendChild(assistantBubble);

                chatHistory.push({ role:'user', content:text });
                const res = await fetch('/api/chat', {
                  method: 'POST',
                  headers: {'Content-Type':'application/json'},
                  body: JSON.stringify({ messages: chatHistory, model: selectedModel })
                });

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let full = '';
                while (true) {
                  const { done, value } = await reader.read();
                  if (done) break;
                  const chunk = decoder.decode(value);
                  for (let line of chunk.split('\\n')) {
                    if (!line.startsWith('data: ') || line.includes('[DONE]')) continue;
                    try {
                      const data = JSON.parse(line.slice(6));
                      if (data.content) {
                        full += data.content;
                        assistantBubble.querySelector('.bubble').textContent = full;
                      }
                    } catch(e){}
                  }
                }
                chatHistory.push({ role:'assistant', content:full });
              }

              async function triggerVideoGen() {
                const logs = document.getElementById('videoLogs');
                logs.innerHTML = '> Submitting task to LongCat engine...\\n';
                const task = document.getElementById('videoTask').value;
                const model = document.getElementById('videoModel').value;
                const prompt = document.getElementById('videoPrompt').value;

                const res = await fetch('/api/video/generate', {
                  method:'POST',
                  headers:{'Content-Type':'application/json'},
                  body: JSON.stringify({ task, model, prompt })
                });

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                while (true) {
                  const { done, value } = await reader.read();
                  if (done) break;
                  const chunk = decoder.decode(value);
                  for (let line of chunk.split('\\n')) {
                    if (!line.startsWith('data: ') || line.includes('[DONE]')) continue;
                    try {
                      const data = JSON.parse(line.slice(6));
                      if (data.raw) {
                        logs.innerHTML += data.raw + '\\n';
                        logs.scrollTop = logs.scrollHeight;
                      }
                    } catch(e){}
                  }
                }
              }

              setInterval(async () => {
                try {
                  const r = await fetch('/api/stats');
                  const d = await r.json();
                  document.getElementById('hostStats').innerText = `CPU: ${d.cpu_percent}% | RAM: ${d.ram_used}`;
                } catch(e){}
              }, 4000);

              loadModels();
            </script>
          </body>
          </html>
          """

          if __name__ == "__main__":
              uvicorn.run(app, host="0.0.0.0", port=PORT, log_level="info")
          PYEOF
          echo "✅ Unified server script built"

      - name: 🌐 Launch Unified Studio
        run: |
          echo "──────────────────────────────────────────"
          echo " 🌐 Launching FastAPI AI Gateway"
          echo "──────────────────────────────────────────"
          nohup python unified_server.py > /tmp/unified_ui.log 2>&1 &
          echo $! > /tmp/unified_ui.pid
          
          ready=false
          for i in $(seq 1 20); do
            if curl -sf "http://localhost:${PORT}/api/health" > /dev/null 2>&1; then
              echo "✅ Unified Studio is live!"
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            echo "❌ Studio failed to start. Logs:"
            tail -n 50 /tmp/unified_ui.log || true
            exit 1
          fi

      - name: 📦 Install Cloudflared
        run: |
          curl -L -s https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: 🌍 Expose Cloudflare Tunnel
        run: |
          echo "──────────────────────────────────────────"
          echo " 🌐 Establishing Global Public Tunnel"
          echo "──────────────────────────────────────────"
          cloudflared tunnel --url "http://127.0.0.1:${PORT}" --protocol http2 > tunnel.log 2>&1 &
          TUNNEL_PID=$!
          
          TUNNEL_URL=""
          for i in $(seq 1 30); do
            TUNNEL_URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' tunnel.log 2>/dev/null | head -1)
            [ -n "$TUNNEL_URL" ] && break
            sleep 2
          done
          
          if [ -z "$TUNNEL_URL" ]; then
            echo "❌ Tunnel initialization failed:"
            cat tunnel.log
            exit 1
          fi
          
          echo ""
          echo "╔═══════════════════════════════════════════════════════════════════╗"
          echo "║         🎉   U N I F I E D   A I   S T U D I O   L I V E   🎉     ║"
          echo "╠═══════════════════════════════════════════════════════════════════╣"
          echo "║  🔗  $TUNNEL_URL"
          echo "╚═══════════════════════════════════════════════════════════════════╝"
          
          {
            echo "## 🦙🎬 All-in-One AI Studio is Online"
            echo ""
            echo "**Public URL:** $TUNNEL_URL"
            echo ""
            echo "### What's included in this instance:"
            echo "- **💬 LLM & Vision Studio:** Powered by Ollama with on-demand model pulling."
            echo "- **🎬 Meituan LongCat-Video:** 13.6B Unified Core & Avatar-1.5 engine ready."
            echo "- **⚡ Integrated Console:** Hardware telemetry and real-time streaming progress logs."
          } >> "$GITHUB_STEP_SUMMARY"
          
          wait "$TUNNEL_PID"

      - name: 🧹 Teardown & Clean
        if: always()
        run: |
          pkill -f "cloudflared" 2>/dev/null || true
          pkill -f "python unified_server.py" 2>/dev/null || true
          pkill -f "ollama serve" 2>/dev/null || true
          echo "✅ All background engines successfully terminated"
