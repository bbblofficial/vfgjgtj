name: 🦙 Local LLM & Image Studio (macOS Apple Silicon / MLX)

on:
  workflow_dispatch:
    inputs:
      port:
        description: '🔌 Web UI port'
        required: false
        default: '7860'
        type: string
      context_size:
        description: '📝 Context window (tokens)'
        required: false
        default: '4096'
        type: string

permissions:
  contents: read

concurrency:
  group: llama-web-ui
  cancel-in-progress: true

jobs:
  deploy-llama:
    runs-on: macos-latest
    timeout-minutes: 360
    env:
      CONTEXT_SIZE: ${{ inputs.context_size }}
      PORT: ${{ inputs.port }}
      OLLAMA_MODELS: /Users/runner/ollama_models

    steps:
      - name: 🦙 Show banner
        run: |
          echo "╔═══════════════════════════════════════════════════════════════════╗"
          echo "║   🦙  M A C O S   A P P L E   S I L I C O N   ( M L X )           ║"
          echo "╚═══════════════════════════════════════════════════════════════════╝"
          echo "  📝 Context: ${CONTEXT_SIZE} tokens"
          echo "  🔌 Port:    ${PORT}"
          echo "  🏃 Runner:  $(uname -a)"
          echo "  🧠 Chip:    $(sysctl -n machdep.cpu.brand_string 2>/dev/null || uname -m)"
          echo "  💽 Disk status:"
          df -h / | tail -1
          mkdir -p /Users/runner/ollama_models

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Ollama, MLX & Python packages
        run: |
          echo "──────────────────────────────────────────"
          echo " 📦  Installing Official Ollama App + MLX"
          echo "──────────────────────────────────────────"
          curl -fsSL https://github.com/ollama/ollama/releases/latest/download/Ollama-darwin.zip -o /tmp/Ollama-darwin.zip
          unzip -q /tmp/Ollama-darwin.zip -d /tmp/ollama_app
          sudo cp /tmp/ollama_app/Ollama.app/Contents/Resources/ollama /usr/local/bin/ollama
          sudo chmod +x /usr/local/bin/ollama
          rm -rf /tmp/Ollama-darwin.zip /tmp/ollama_app

          pip install --no-cache-dir \
            fastapi uvicorn aiohttp httpx python-multipart \
            jinja2 websockets pydantic psutil mlx

          /usr/local/bin/ollama --version
          python -c "import mlx.core as mx; print('✅ MLX Framework Ready on device:', mx.default_device())"

      - name: 🚀 Start Ollama server
        run: |
          echo "──────────────────────────────────────────"
          echo " 🚀  Starting Ollama on macOS"
          echo "──────────────────────────────────────────"
          export OLLAMA_MODELS="/Users/runner/ollama_models"
          export OLLAMA_HOST="0.0.0.0:11434"
          export OLLAMA_KEEP_ALIVE="24h"
          
          nohup /usr/local/bin/ollama serve > /tmp/ollama.log 2>&1 &
          echo $! > /tmp/ollama.pid
          
          echo "⏳ Waiting for Ollama engine to report healthy..."
          ready=false
          for i in $(seq 1 30); do
            if curl -sf http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "✅ Ollama is live with dedicated models directory!"
              ready=true
              break
            fi
            sleep 2
          done
          
          if [ "$ready" != "true" ]; then
            echo "❌ Ollama failed to start. Last logs:"
            tail -n 50 /tmp/ollama.log || true
            exit 1
          fi

      - name: 📥 Verify Repository state
        run: |
          echo "──────────────────────────────────────────"
          echo " 📥  Ready for selective on-demand streaming"
          echo "──────────────────────────────────────────"
          ollama list

      - name: 🔧 Write the web server (Hybrid LLM & Image Generation Studio)
        run: |
          cat > ollama_server.py << 'PYEOF'
          #!/usr/bin/env python3
          import json
          import os
          import logging
          import platform
          import psutil
          from typing import Optional, List
          import httpx
          import uvicorn
          from fastapi import FastAPI, HTTPException
          from fastapi.responses import HTMLResponse, StreamingResponse
          from pydantic import BaseModel

          logging.basicConfig(level=logging.INFO)
          logger = logging.getLogger("studio-ui")

          OLLAMA_HOST = os.getenv("OLLAMA_HOST", "http://127.0.0.1:11434")
          CONTEXT_SIZE = int(os.getenv("CONTEXT_SIZE", "4096"))
          PORT = int(os.getenv("PORT", "7860"))

          app = FastAPI(title="Local Studio (MLX Hybrid)")

          CATALOG_MODELS = [
              # Image / Diffusion Models
              "x/z-image-turbo:latest",
              "x/flux2-klein:latest",
              "flux2-klein:4b",

              # Vision & OCR
              "deepseek-ocr:latest",
              "it:deepseek-ocr:latest",

              # Fine-tuned & Specialized
              "goonsai/qwen2.5-3b-goonsai-nsfw-100k:latest",
              "REOinc/REO.AI:latest",
              "MrTails/Tails-assistant-ai-v3.0.0:latest",
              "samuser3/granite3.2-gemma3:latest",
              "samuser3/granite3.2-gemma3:1b",
              "samuser3/granite3.2-gemma3:4b",
              "qwen3.8:27b",
              "parable/fable:3b",
              "parable/fable:4b",

              # Conversational & Coding
              "qwen2.5:0.5b",
              "qwen2.5:1.5b",
              "qwen2.5:3b",
              "qwen2.5:7b",
              "qwen2.5-coder:0.5b",
              "qwen2.5-coder:1.5b",
              "qwen2.5-coder:3b",
              "qwen2.5-coder:7b",
              "deepseek-r1:1.5b",
              "deepseek-r1:7b",
              "deepseek-coder:1.3b",
              "deepseek-coder:6.7b",
              "llama3.2:1b",
              "llama3.2:3b",
              "tinyllama",
              "gemma2:2b",
              "phi3.5",
              "phi3:mini",
              "mistral:7b",
              "openhermes",
              "dolphin-mistral",
              "smollm:1.7b",
              "orca-mini:3b",
              "stablelm2:1.6b"
          ]

          IMAGE_MODEL_PREFIXES = ("x/z-image", "x/flux", "flux", "stable-diffusion")

          def is_image_model(model_name: str) -> bool:
              m = model_name.lower()
              return any(p in m for p in IMAGE_MODEL_PREFIXES)

          class ChatMessage(BaseModel):
              role: str
              content: str

          class ChatRequest(BaseModel):
              messages: List[ChatMessage]
              model: str
              temperature: Optional[float] = 0.7
              max_tokens: Optional[int] = 2048

          class PullRequest(BaseModel):
              model: str

          @app.get("/api/health")
          async def health():
              try:
                  async with httpx.AsyncClient(timeout=5) as client:
                      r = await client.get(f"{OLLAMA_HOST}/api/tags")
                      r.raise_for_status()
                  return {"status": "ok"}
              except Exception as exc:
                  raise HTTPException(status_code=503, detail=str(exc))

          @app.get("/api/sysinfo")
          def sysinfo():
              return {
                  "cpu_threads": psutil.cpu_count(logical=True),
                  "ram_total": f"{psutil.virtual_memory().total / (1024**3):.1f} GB",
                  "os": platform.system() + " " + platform.release() + " (Apple Silicon / MLX)"
              }

          @app.get("/api/stats")
          def stats():
              disk = psutil.disk_usage('/')
              return {
                  "cpu_percent": psutil.cpu_percent(interval=None),
                  "ram_percent": psutil.virtual_memory().percent,
                  "ram_used": f"{psutil.virtual_memory().used / (1024**3):.1f} GB",
                  "disk_free": f"{disk.free / (1024**3):.1f} GB"
              }

          @app.get("/api/models")
          async def list_models():
              try:
                  async with httpx.AsyncClient(timeout=10) as client:
                      r = await client.get(f"{OLLAMA_HOST}/api/tags")
                      r.raise_for_status()
                      data = r.json()
                      downloaded_raw = [m["name"] for m in data.get("models", [])]
                      downloaded = set(downloaded_raw)
                      
                      for m in downloaded_raw:
                          if m.endswith(":latest"):
                              downloaded.add(m[:-7])
                          else:
                              downloaded.add(f"{m}:latest")
                      
                      all_models = list(dict.fromkeys(downloaded_raw + CATALOG_MODELS))
                      result = []
                      for m in all_models:
                          result.append({
                              "name": m,
                              "downloaded": m in downloaded,
                              "type": "image" if is_image_model(m) else "text"
                          })
                      return {"models": result}
              except Exception as exc:
                  raise HTTPException(status_code=503, detail=str(exc))

          @app.post("/api/pull")
          async def pull_model(request: PullRequest):
              async def generate():
                  try:
                      timeout = httpx.Timeout(connect=120.0, read=None, write=120.0, pool=None)
                      async with httpx.AsyncClient(timeout=timeout) as client:
                          async with client.stream(
                              "POST",
                              f"{OLLAMA_HOST}/api/pull",
                              json={"name": request.model, "stream": True}
                          ) as response:
                              if response.status_code != 200:
                                  err_content = await response.aread()
                                  yield f"data: {json.dumps({'error': err_content.decode(errors='ignore')})}\n\n"
                                  return
                              async for line in response.aiter_lines():
                                  line = line.strip()
                                  if line:
                                      yield f"data: {line}\n\n"
                  except Exception as exc:
                      logger.exception("pull streaming failed")
                      yield f"data: {json.dumps({'error': str(exc)})}\n\n"
                  yield "data: [DONE]\n\n"
              return StreamingResponse(generate(), media_type="text/event-stream")

          @app.get("/", response_class=HTMLResponse)
          async def root():
              return HTML_TEMPLATE

          @app.post("/api/chat")
          async def chat(request: ChatRequest):
              async def generate():
                  try:
                      if is_image_model(request.model):
                          prompt = request.messages[-1].content if request.messages else ""
                          timeout = httpx.Timeout(connect=60.0, read=600.0, write=60.0, pool=None)
                          async with httpx.AsyncClient(timeout=timeout) as client:
                              res = await client.post(
                                  f"{OLLAMA_HOST}/api/generate",
                                  json={
                                      "model": request.model,
                                      "prompt": prompt,
                                      "stream": False
                                  },
                              )
                              if res.status_code != 200:
                                  yield f"data: {json.dumps({'error': res.text})}\n\n"
                                  yield "data: [DONE]\n\n"
                                  return
                              
                              res_data = res.json()
                              if err := res_data.get("error"):
                                  yield f"data: {json.dumps({'error': err})}\n\n"
                              elif "image" in res_data:
                                  img_tag = f"![Generated Image](data:image/png;base64,{res_data['image']})"
                                  yield f"data: {json.dumps({'content': img_tag})}\n\n"
                              elif "response" in res_data:
                                  content = res_data["response"]
                                  yield f"data: {json.dumps({'content': content})}\n\n"
                              else:
                                  yield f"data: {json.dumps({'content': json.dumps(res_data, indent=2)})}\n\n"
                                  
                              yield "data: [DONE]\n\n"
                              return

                      ollama_messages = [{"role": m.role, "content": m.content} for m in request.messages]
                      async with httpx.AsyncClient(timeout=300) as client:
                          async with client.stream(
                              "POST",
                              f"{OLLAMA_HOST}/api/chat",
                              json={
                                  "model": request.model,
                                  "messages": ollama_messages,
                                  "stream": True,
                                  "options": {
                                      "temperature": request.temperature,
                                      "num_predict": request.max_tokens,
                                      "num_ctx": CONTEXT_SIZE,
                                  },
                              },
                          ) as response:
                              if response.status_code != 200:
                                  body = await response.aread()
                                  yield f"data: {json.dumps({'error': body.decode(errors='ignore')})}\n\n"
                                  yield "data: [DONE]\n\n"
                                  return
                              async for line in response.aiter_lines():
                                  line = line.strip()
                                  if not line:
                                      continue
                                  try:
                                      obj = json.loads(line)
                                  except json.JSONDecodeError:
                                      continue
                                  if err := obj.get("error"):
                                      yield f"data: {json.dumps({'error': err})}\n\n"
                                      continue
                                  content = obj.get("message", {}).get("content")
                                  if content:
                                      yield f"data: {json.dumps({'content': content})}\n\n"
                  except Exception as exc:
                      logger.exception("execution error")
                      yield f"data: {json.dumps({'error': str(exc)})}\n\n"
                  yield "data: [DONE]\n\n"
              return StreamingResponse(generate(), media_type="text/event-stream")

          HTML_TEMPLATE = r'''
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Local Studio (MLX Hybrid)</title>
          
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Vazirmatn:wght@400;500;600&display=swap" rel="stylesheet">
          
          <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
          <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
          <link id="hljsTheme" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
          <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
          <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
          <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
          <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
          
          <style>
            :root {
              --bg: #09090b;
              --sidebar: rgba(24, 24, 27, 0.7);
              --border: rgba(255, 255, 255, 0.08);
              --text: #f4f4f5;
              --text-secondary: #a1a1aa;
              --accent: #10b981;
              --accent-glow: rgba(16, 185, 129, 0.3);
              --cyan: #06b6d4;
              --purple: #a855f7;
              --user-bg: rgba(6, 182, 212, 0.05);
              --assistant-bg: transparent;
              --input-bg: rgba(24, 24, 27, 0.75);
              --code-bg: rgba(0, 0, 0, 0.45);
              --danger: #ef4444;
              --ok: #10b981;
              --glass: blur(16px);
            }
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body {
              background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden;
              font-family: 'Inter', 'Vazirmatn', sans-serif;
              background-image: radial-gradient(circle at 15% 50%, rgba(16, 185, 129, 0.04), transparent 25%),
                                radial-gradient(circle at 85% 30%, rgba(6, 182, 212, 0.04), transparent 25%);
            }
            .sidebar {
              width: 320px; background: var(--sidebar); border-right: 1px solid var(--border);
              backdrop-filter: var(--glass); -webkit-backdrop-filter: var(--glass);
              display: flex; flex-direction: column; padding: 20px; flex-shrink: 0; z-index: 10;
              overflow-y: auto;
            }
            .new-chat-btn {
              display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 12px;
              background: var(--input-bg); border: 1px solid var(--border); border-radius: 12px; color: var(--text);
              font-size: 14px; font-weight: 500; cursor: pointer; margin-bottom: 16px;
              transition: all 0.2s ease; font-family: inherit;
            }
            .new-chat-btn:hover { border-color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); }
            
            .settings-group { display: flex; flex-direction: column; gap: 12px; font-size: 13px; color: var(--text-secondary); }
            .settings-group label { display: flex; justify-content: space-between; align-items: center; }
            .settings-group input[type="range"] { width: 100%; accent-color: var(--cyan); margin-top: 4px; }
            
            .model-section-title { font-weight: 600; color: var(--text); margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
            .model-list {
              background: rgba(0,0,0,0.25); border: 1px solid var(--border); border-radius: 10px;
              max-height: 230px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; padding: 6px; margin-bottom: 12px;
            }
            .model-item {
              display: flex; align-items: center; justify-content: space-between; padding: 8px 10px;
              border-radius: 8px; font-size: 12px; cursor: pointer; transition: background 0.2s; border: 1px solid transparent;
            }
            .model-item:hover { background: rgba(255,255,255,0.05); }
            .model-item.active { background: rgba(6, 182, 212, 0.12); border-color: rgba(6, 182, 212, 0.4); }
            .model-meta { display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
            .model-name { font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 155px; }
            .model-type-badge { font-size: 9px; padding: 2px 4px; border-radius: 4px; width: fit-content; text-transform: uppercase; }
            .model-type-badge.image { background: rgba(168, 85, 247, 0.2); color: var(--purple); }
            .model-type-badge.text { background: rgba(6, 182, 212, 0.2); color: var(--cyan); }
            .model-status { font-size: 11px; }
            .model-status.ready { color: var(--ok); }
            .model-status.pending { color: var(--text-secondary); }
            .dl-btn {
              background: rgba(16, 185, 129, 0.15); border: 1px solid var(--accent); color: var(--accent);
              padding: 4px 9px; border-radius: 6px; font-size: 11px; cursor: pointer; transition: all 0.2s; flex-shrink: 0; font-weight: 500;
            }
            .dl-btn:hover { background: var(--accent); color: #fff; }
            .dl-btn:disabled { opacity: 0.5; cursor: not-allowed; }

            .system-stats {
              background: rgba(0,0,0,0.3); border: 1px solid var(--border);
              border-radius: 12px; padding: 12px; margin-top: 8px;
              font-size: 12px; display: flex; flex-direction: column; gap: 6px;
            }
            .stat-title { font-weight: 600; color: var(--text); margin-bottom: 2px; display: flex; align-items: center; gap: 6px; }
            .stat-row { display: flex; justify-content: space-between; align-items: center; }
            .stat-value { font-family: monospace; font-size: 13px; }
            #sysSpecs { color: var(--text-secondary); margin-bottom: 6px; line-height: 1.4; }
            .progress-bar { width: 100%; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; margin-top: 2px; }
            .progress-fill { height: 100%; transition: width 0.3s ease; }
            
            .sidebar-footer {
              margin-top: auto; border-top: 1px solid var(--border); padding-top: 14px;
              font-size: 12px; color: var(--text-secondary); display: flex; flex-direction: column; gap: 8px;
            }
            .model-tag {
              background: rgba(6, 182, 212, 0.1); color: var(--cyan); padding: 5px 10px;
              border-radius: 6px; font-weight: 600; width: fit-content; border: 1px solid rgba(6, 182, 212, 0.2);
            }
            .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; box-shadow: 0 0 8px currentColor; }
            .status-dot.ok { background: var(--ok); color: var(--ok); }
            .status-dot.bad { background: var(--danger); color: var(--danger); }
            
            .main-content { flex: 1; display: flex; flex-direction: column; height: 100vh; position: relative; }
            .chat-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; padding: 20px 0 150px 0; scroll-behavior: smooth; }
            
            .message-row {
              width: 100%; display: flex; justify-content: center; padding: 22px 20px;
              border-bottom: 1px solid rgba(255,255,255,0.02); animation: fadeIn 0.3s ease;
            }
            @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
            .message-row.user { background: var(--user-bg); }
            .message-row.error .message-body { color: var(--danger); }
            
            .message-inner { max-width: 850px; width: 100%; display: flex; gap: 20px; line-height: 1.7; font-size: 15px; }
            .avatar {
              width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
              font-size: 18px; font-weight: 600; flex-shrink: 0; color: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            }
            .avatar.user { background: linear-gradient(135deg, var(--cyan), #0284c7); }
            .avatar.assistant { background: linear-gradient(135deg, var(--accent), #059669); }
            
            .message-body { flex: 1; overflow-x: auto; min-width: 0; padding-top: 4px; }
            .message-body p { margin: 0 0 16px; }
            .message-body p:last-child { margin-bottom: 0; }
            .message-body img { max-width: 100%; height: auto; border-radius: 12px; margin: 12px 0; border: 1px solid var(--border); }
            .message-body pre {
              background: var(--code-bg); color: #e2e8f0; padding: 35px 16px 16px; border-radius: 10px;
              overflow-x: auto; margin: 16px 0; border: 1px solid var(--border); position: relative;
            }
            .message-body code { font-family: ui-monospace, monospace; font-size: 13px; background: rgba(255,255,255,0.1); padding: 3px 6px; border-radius: 5px; }
            .message-body pre code { background: transparent; padding: 0; }
            .code-lang { position: absolute; top: 10px; left: 16px; font-size: 12px; color: #64748b; font-weight: 500; }
            .copy-btn {
              position: absolute; top: 8px; right: 8px; background: rgba(255,255,255,0.1); border: none;
              color: #cbd5e1; font-size: 12px; padding: 4px 10px; border-radius: 6px; cursor: pointer; transition: 0.2s;
            }
            .copy-btn:hover { background: rgba(255,255,255,0.2); color: #fff; }
            
            .input-area-wrapper {
              position: absolute; bottom: 0; left: 0; width: 100%;
              background: linear-gradient(180deg, transparent 0%, var(--bg) 30%);
              padding: 30px 24px; display: flex; justify-content: center;
            }
            .input-box {
              max-width: 850px; width: 100%; background: var(--input-bg); border: 1px solid var(--border);
              border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; align-items: flex-end;
              padding: 12px 16px; gap: 12px; backdrop-filter: var(--glass); -webkit-backdrop-filter: var(--glass);
              transition: border-color 0.3s ease;
            }
            .input-box:focus-within { border-color: var(--accent); }
            .input-box textarea {
              flex: 1; background: transparent; border: none; color: var(--text); font-family: inherit;
              font-size: 15px; resize: none; outline: none; max-height: 200px; min-height: 26px; line-height: 26px;
            }
            .input-box textarea::placeholder { color: #52525b; }
            .send-btn, .stop-btn {
              border: none; border-radius: 12px; width: 40px; height: 40px; display: flex; align-items: center;
              justify-content: center; color: #fff; cursor: pointer; transition: all 0.2s; flex-shrink: 0; font-size: 18px;
            }
            .send-btn { background: var(--accent); box-shadow: 0 4px 12px var(--accent-glow); }
            .stop-btn { background: var(--danger); display: none; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3); }
            .send-btn:hover { background: #059669; }
            .stop-btn:hover { background: #dc2626; }
            .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
            
            /* Modal */
            .modal-overlay {
              position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px);
              display: none; align-items: center; justify-content: center; z-index: 100;
            }
            .modal-box {
              background: #18181b; border: 1px solid var(--border); border-radius: 16px;
              width: 90%; max-width: 520px; padding: 24px; display: flex; flex-direction: column; gap: 16px;
              box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            }
            .modal-title { font-size: 16px; font-weight: 600; color: var(--text); }
            .modal-log {
              background: #09090b; border: 1px solid var(--border); border-radius: 8px;
              padding: 12px; font-family: monospace; font-size: 12px; color: #a1a1aa;
              height: 140px; overflow-y: auto; white-space: pre-wrap; line-height: 1.5;
            }
            .dl-modal-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; }
            .dl-modal-fill { height: 100%; background: var(--cyan); width: 0%; transition: width 0.2s ease; }
            .modal-close-btn {
              align-self: flex-end; background: var(--border); border: none; color: var(--text);
              padding: 8px 18px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500;
            }
            .modal-close-btn:hover { background: rgba(255,255,255,0.2); }
          </style>
          </head>
          <body>
            <button class="menu-btn" onclick="document.querySelector('.sidebar').classList.toggle('open')" style="display: none;">☰</button>
            
            <div class="modal-overlay" id="downloadModal">
              <div class="modal-box">
                <div class="modal-title" id="modalTitle">📥 Downloading Model</div>
                <div class="dl-modal-bar"><div class="dl-modal-fill" id="modalBar"></div></div>
                <div style="display:flex; justify-content:space-between; font-size:12px; color:var(--text-secondary);">
                  <span id="modalStatus">Connecting...</span>
                  <span id="modalPercent">0%</span>
                </div>
                <div class="modal-log" id="modalLogs"></div>
                <button class="modal-close-btn" id="modalCloseBtn" onclick="closeModal()" disabled>Downloading...</button>
              </div>
            </div>

            <div class="sidebar">
              <button class="new-chat-btn" onclick="clearChat()"><span>＋</span> New Chat</button>
              
              <div class="settings-group">
                <div class="model-section-title">
                  <span>Model Selector & Library</span>
                  <button onclick="loadModels()" style="background:none; border:none; color:var(--cyan); cursor:pointer; font-size:11px;">🔄 Refresh</button>
                </div>
                <div class="model-list" id="modelListContainer">
                  <div style="padding: 10px; text-align: center; color: var(--text-secondary);">Scanning models...</div>
                </div>

                <div>
                  <label>Temperature <span id="tempVal" style="color: var(--cyan);">0.7</span></label>
                  <input type="range" id="temperature" min="0" max="2" step="0.1" value="0.7">
                </div>
                
                <div>
                  <label>Max Tokens <span id="tokenVal" style="color: var(--cyan);">2048</span></label>
                  <input type="range" id="maxTokens" min="128" max="4096" step="128" value="2048">
                </div>
              </div>

              <!-- System Resource Monitor -->
              <div class="system-stats">
                <div class="stat-title">🖥️ Server Hardware</div>
                <div id="sysSpecs">Loading...</div>
                
                <div class="stat-title" style="margin-top: 6px;">📊 Live Usage</div>
                
                <div class="stat-row">
                  <span>CPU:</span>
                  <span id="cpuVal" class="stat-value" style="color: var(--cyan);">0%</span>
                </div>
                <div class="progress-bar"><div id="cpuBar" class="progress-fill" style="background: var(--cyan); width: 0%;"></div></div>
                
                <div class="stat-row" style="margin-top: 6px;">
                  <span>RAM:</span>
                  <span id="ramVal" class="stat-value" style="color: var(--accent);">0%</span>
                </div>
                <div class="progress-bar"><div id="ramBar" class="progress-fill" style="background: var(--accent); width: 0%;"></div></div>
                
                <div class="stat-row" style="margin-top: 6px;">
                  <span>Disk Free:</span>
                  <span id="diskFreeVal" class="stat-value" style="color: var(--ok);">0 GB</span>
                </div>
                <div id="ramUsedText" style="text-align: right; font-size: 10px; color: var(--text-secondary); margin-top: 2px;">0 GB Used</div>
              </div>

              <div class="sidebar-footer">
                <span class="model-tag" id="currentModelTag">📦 Loading...</span>
                <span id="statusIndicator"><span class="status-dot ok"></span>Checking connection...</span>
                <span id="tokenCounter" style="color: var(--cyan);">Tokens generated: 0</span>
              </div>
            </div>

            <div class="main-content">
              <div class="chat-container" id="chatContainer">
                <div class="message-row assistant">
                  <div class="message-inner">
                    <div class="avatar assistant">✦</div>
                    <div class="message-body" id="welcomeMsg"></div>
                  </div>
                </div>
              </div>
              <div class="input-area-wrapper">
                <div class="input-box">
                  <textarea id="userInput" placeholder="Message or enter image prompt..." rows="1"></textarea>
                  <button class="send-btn" id="sendButton" onclick="sendMessage()">↑</button>
                  <button class="stop-btn" id="stopButton" onclick="stopGenerating()">■</button>
                </div>
              </div>
            </div>

          <script>
            if (window.innerWidth <= 768) { document.querySelector('.menu-btn').style.display = 'flex'; }

            marked.setOptions({
              gfm: true, breaks: true,
              highlight: function (code, lang) {
                if (lang && hljs.getLanguage(lang)) return hljs.highlight(code, { language: lang }).value;
                return hljs.highlightAuto(code).value;
              }
            });

            function renderInto(el, text, opts = {}) {
              const rawHtml = marked.parse(text);
              el.innerHTML = DOMPurify.sanitize(rawHtml) + (opts.loading ? '<span class="loading-dots"></span>' : '');
              if (window.renderMathInElement) {
                renderMathInElement(el, {
                  delimiters: [
                    { left: '$$', right: '$$', display: true }, { left: '\\[', right: '\\]', display: true },
                    { left: '\\(', right: '\\)', display: false }, { left: '$', right: '$', display: false }
                  ],
                  throwOnError: false
                });
              }
            }

            const STORE_KEY = 'llama-ui-glass-hybrid';
            const chatContainer = document.getElementById('chatContainer');
            const userInput = document.getElementById('userInput');
            const sendButton = document.getElementById('sendButton');
            const stopButton = document.getElementById('stopButton');
            const tokenCounter = document.getElementById('tokenCounter');
            const statusIndicator = document.getElementById('statusIndicator');
            const temperatureEl = document.getElementById('temperature');
            const maxTokensEl = document.getElementById('maxTokens');
            const modelListContainer = document.getElementById('modelListContainer');
            const currentModelTag = document.getElementById('currentModelTag');
            
            const downloadModal = document.getElementById('downloadModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalBar = document.getElementById('modalBar');
            const modalStatus = document.getElementById('modalStatus');
            const modalPercent = document.getElementById('modalPercent');
            const modalLogs = document.getElementById('modalLogs');
            const modalCloseBtn = document.getElementById('modalCloseBtn');

            let isStreaming = false, totalTokens = 0, messageHistory = [], controller = null, currentModel = null, currentModelType = 'text';
            let statPollInterval;

            async function fetchSysInfo() {
              try {
                const r = await fetch('/api/sysinfo');
                const data = await r.json();
                document.getElementById('sysSpecs').innerHTML = `OS: ${data.os}<br>CPU: ${data.cpu_threads} Cores<br>RAM: ${data.ram_total}`;
              } catch (e) {
                document.getElementById('sysSpecs').innerText = "Unavailable";
              }
            }

            async function fetchStats() {
              try {
                const r = await fetch('/api/stats');
                const data = await r.json();
                document.getElementById('cpuVal').textContent = data.cpu_percent.toFixed(1) + '%';
                document.getElementById('cpuBar').style.width = data.cpu_percent + '%';
                document.getElementById('ramVal').textContent = data.ram_percent.toFixed(1) + '%';
                document.getElementById('ramBar').style.width = data.ram_percent + '%';
                document.getElementById('diskFreeVal').textContent = data.disk_free;
                document.getElementById('ramUsedText').textContent = data.ram_used + ' Used';
              } catch (e) {}
            }

            function setPolling(fast) {
              clearInterval(statPollInterval);
              fetchStats();
              statPollInterval = setInterval(fetchStats, fast ? 1000 : 3000);
            }

            fetchSysInfo();
            setPolling(false);

            async function loadModels() {
              try {
                const resp = await fetch('/api/models');
                if (!resp.ok) throw new Error('Failed to fetch models');
                const data = await resp.json();
                const models = data.models || [];
                
                if (models.length === 0) {
                  modelListContainer.innerHTML = '<div style="padding: 10px; text-align: center; color: var(--text-secondary);">No models found</div>';
                  return;
                }

                modelListContainer.innerHTML = models.map(m => `
                  <div class="model-item ${m.name === currentModel ? 'active' : ''}" onclick="${m.downloaded ? `selectModel('${m.name}', '${m.type}')` : ''}">
                    <div class="model-meta">
                      <div style="display:flex; align-items:center; gap:6px;">
                        <span class="model-name" title="${m.name}">${m.name}</span>
                        <span class="model-type-badge ${m.type}">${m.type}</span>
                      </div>
                      <span class="model-status ${m.downloaded ? 'ready' : 'pending'}">${m.downloaded ? '🟢 Ready' : '📥 Not Downloaded'}</span>
                    </div>
                    ${!m.downloaded ? `<button class="dl-btn" onclick="startModelDownload('${m.name}', event)">Download</button>` : ''}
                  </div>
                `).join('');

                const downloaded = models.filter(m => m.downloaded);
                if (!currentModel && downloaded.length > 0) {
                  selectModel(downloaded[0].name, downloaded[0].type);
                }
              } catch (e) {
                modelListContainer.innerHTML = '<div style="padding: 10px; text-align: center; color: var(--danger);">Error loading models</div>';
              }
            }

            function selectModel(modelName, modelType = 'text') {
              currentModel = modelName;
              currentModelType = modelType;
              updateModelTag();
              saveState();
              loadModels();
            }

            function appendLog(msg, isError = false) {
              modalLogs.textContent += (isError ? '❌ ' : '') + msg + '\n';
              modalLogs.scrollTop = modalLogs.scrollHeight;
            }

            function closeModal() {
              downloadModal.style.display = 'none';
            }

            async function startModelDownload(modelName, event) {
              if (event) event.stopPropagation();
              
              downloadModal.style.display = 'flex';
              modalTitle.textContent = `📥 Pulling ${modelName}`;
              modalBar.style.width = '0%';
              modalBar.style.background = 'var(--cyan)';
              modalPercent.textContent = '0%';
              modalStatus.textContent = 'Initiating download...';
              modalLogs.textContent = `[Info] Requesting pull for: ${modelName}\n`;
              modalCloseBtn.disabled = true;
              modalCloseBtn.textContent = 'Downloading...';

              let streamFailed = false;

              try {
                const resp = await fetch('/api/pull', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ model: modelName })
                });

                if (!resp.ok) {
                  throw new Error(`Server returned HTTP ${resp.status}`);
                }

                const reader = resp.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                pullLoop: while (true) {
                  const { done, value } = await reader.read();
                  if (done) break;
                  
                  buffer += decoder.decode(value, { stream: true });
                  const lines = buffer.split('\n');
                  buffer = lines.pop() || '';

                  for (const line of lines) {
                    const trimmed = line.trim();
                    if (!trimmed) continue;
                    
                    let jsonStr = trimmed;
                    if (jsonStr.startsWith('data: ')) {
                      jsonStr = jsonStr.slice(6);
                    }
                    if (jsonStr === '[DONE]') break pullLoop;

                    let data = null;
                    try {
                      data = JSON.parse(jsonStr);
                    } catch (e) {
                      continue;
                    }

                    if (data.error) {
                      streamFailed = true;
                      appendLog(`[Error] ${data.error}`, true);
                      modalStatus.textContent = 'Failed: ' + data.error;
                      modalBar.style.background = 'var(--danger)';
                      break pullLoop;
                    }
                    
                    if (data.status) {
                      modalStatus.textContent = data.status;
                      if (data.completed && data.total) {
                        const pct = Math.round((data.completed / data.total) * 100);
                        modalBar.style.width = pct + '%';
                        modalPercent.textContent = pct + '%';
                        const doneMB = (data.completed / (1024 * 1024)).toFixed(1);
                        const totalMB = (data.total / (1024 * 1024)).toFixed(1);
                        modalStatus.textContent = `${data.status} (${doneMB}MB / ${totalMB}MB)`;
                      } else {
                        appendLog(`[Status] ${data.status}`);
                      }
                    }
                  }
                }

                if (streamFailed) {
                  modalCloseBtn.disabled = false;
                  modalCloseBtn.textContent = 'Close';
                  modalCloseBtn.onclick = closeModal;
                  loadModels();
                  return;
                }

                modalBar.style.width = '100%';
                modalBar.style.background = 'var(--ok)';
                modalPercent.textContent = '100%';
                modalStatus.textContent = 'Completed successfully!';
                appendLog(`[Success] Model ${modelName} ready.`);
                modalCloseBtn.disabled = false;
                modalCloseBtn.textContent = 'Done & Select';
                modalCloseBtn.onclick = () => {
                  closeModal();
                  selectModel(modelName);
                };
                loadModels();

              } catch (err) {
                modalBar.style.background = 'var(--danger)';
                appendLog(`[Failed] ${err.message || 'Network error'}`, true);
                modalStatus.textContent = 'Download error.';
                modalCloseBtn.disabled = false;
                modalCloseBtn.textContent = 'Close';
                modalCloseBtn.onclick = closeModal;
                loadModels();
              }
            }

            function updateModelTag() {
              currentModelTag.textContent = currentModel ? `📦 ${currentModel} (${currentModelType})` : '📦 (no model selected)';
            }

            function saveState() {
              try {
                localStorage.setItem(STORE_KEY, JSON.stringify({
                  temperature: temperatureEl.value, maxTokens: maxTokensEl.value,
                  messageHistory, totalTokens, model: currentModel, modelType: currentModelType
                }));
              } catch { }
            }

            function restoreState() {
              try {
                const raw = localStorage.getItem(STORE_KEY);
                if (!raw) return;
                const s = JSON.parse(raw);
                if (s.temperature) { temperatureEl.value = s.temperature; document.getElementById('tempVal').textContent = s.temperature; }
                if (s.maxTokens) { maxTokensEl.value = s.maxTokens; document.getElementById('tokenVal').textContent = s.maxTokens; }
                if (s.model) { currentModel = s.model; currentModelType = s.modelType || 'text'; updateModelTag(); }
                if (Array.isArray(s.messageHistory)) {
                  messageHistory = s.messageHistory; totalTokens = s.totalTokens || 0;
                  messageHistory.forEach(m => appendMessage(m.role, m.content));
                  tokenCounter.textContent = `Tokens generated: ${totalTokens}`;
                }
              } catch { }
            }

            async function checkHealth() {
              try {
                const r = await fetch('/api/health');
                statusIndicator.innerHTML = r.ok ? '<span class="status-dot ok"></span>Connected to Ollama (MLX)' : '<span class="status-dot bad"></span>Ollama unreachable';
              } catch { statusIndicator.innerHTML = '<span class="status-dot bad"></span>Ollama unreachable'; }
            }

            checkHealth(); setInterval(checkHealth, 15000);

            userInput.addEventListener('input', function () {
              this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 200) + 'px';
            });
            userInput.addEventListener('keydown', function (e) {
              if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
            });

            temperatureEl.addEventListener('input', function () { document.getElementById('tempVal').textContent = this.value; saveState(); });
            maxTokensEl.addEventListener('input', function () { document.getElementById('tokenVal').textContent = this.value; saveState(); });

            function appendMessage(role, content, isLoading = false, isError = false) {
              const row = document.createElement('div');
              row.className = `message-row ${role}` + (isError ? ' error' : '');
              row.innerHTML = `<div class="message-inner">
                <div class="avatar ${role}">${role === 'user' ? '👤' : '✦'}</div>
                <div class="message-body"></div>
              </div>`;
              chatContainer.appendChild(row);
              const body = row.querySelector('.message-body');
              renderInto(body, content, { loading: isLoading });
              chatContainer.scrollTop = chatContainer.scrollHeight;
              return body;
            }

            function updateLastAssistantMessage(content, isComplete = false) {
              const rows = chatContainer.querySelectorAll('.message-row.assistant');
              if (!rows.length) return;
              const body = rows[rows.length - 1].querySelector('.message-body');
              renderInto(body, content, { loading: !isComplete });
              chatContainer.scrollTop = chatContainer.scrollHeight;
            }

            function clearChat() {
              const rows = chatContainer.querySelectorAll('.message-row');
              for (let i = 1; i < rows.length; i++) rows[i].remove();
              messageHistory = []; totalTokens = 0; tokenCounter.textContent = 'Tokens generated: 0';
              saveState();
            }

            function stopGenerating() { if (controller) controller.abort(); }

            async function sendMessage() {
              if (isStreaming) return;
              const text = userInput.value.trim();
              if (!text) return;
              if (!currentModel) return alert('Please download and select a model first from the sidebar.');

              appendMessage('user', text);
              messageHistory.push({ role: 'user', content: text });
              userInput.value = ''; userInput.style.height = 'auto';
              sendButton.style.display = 'none'; stopButton.style.display = 'flex';
              isStreaming = true; controller = new AbortController();
              appendMessage('assistant', currentModelType === 'image' ? 'Generating Image (Please wait)...' : 'Processing...', true);

              setPolling(true);

              let fullContent = '';
              try {
                const response = await fetch('/api/chat', {
                  method: 'POST', headers: { 'Content-Type': 'application/json' }, signal: controller.signal,
                  body: JSON.stringify({
                    messages: messageHistory, model: currentModel,
                    temperature: parseFloat(temperatureEl.value), max_tokens: parseInt(maxTokensEl.value)
                  })
                });

                if (!response.ok) throw new Error(`Server returned ${response.status}`);
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '', streamError = null;

                while (true) {
                  const { done, value } = await reader.read();
                  if (done) break;
                  buffer += decoder.decode(value, { stream: true });
                  const lines = buffer.split('\n');
                  buffer = lines.pop() || '';
                  for (const line of lines) {
                    if (!line.startsWith('data: ')) continue;
                    const data = line.slice(6);
                    if (data === '[DONE]') continue;
                    try {
                      const parsed = JSON.parse(data);
                      if (parsed.error) streamError = parsed.error;
                      else if (parsed.content) {
                        fullContent += parsed.content;
                        updateLastAssistantMessage(fullContent, false);
                      }
                    } catch { }
                  }
                }

                if (streamError) throw new Error(streamError);
                updateLastAssistantMessage(fullContent, true);
                messageHistory.push({ role: 'assistant', content: fullContent });
                totalTokens += Math.ceil(fullContent.length / 4);
                tokenCounter.textContent = `Tokens generated: ${totalTokens}`;
                saveState();
              } catch (error) {
                if (error.name === 'AbortError') {
                  updateLastAssistantMessage(fullContent + '\n\n*(stopped)*', true);
                  if (fullContent) { messageHistory.push({ role: 'assistant', content: fullContent }); saveState(); }
                } else {
                  updateLastAssistantMessage(`⚠️ ${error.message || 'Error executing request.'}`, true);
                }
              }

              sendButton.style.display = 'flex'; stopButton.style.display = 'none';
              isStreaming = false; controller = null; userInput.focus();
              setPolling(false);
            }

            loadModels().then(() => {
              restoreState();
              const welcome = document.getElementById('welcomeMsg');
              renderInto(welcome, `System initialized on macOS with native MLX support. Supports both Conversational Text (LLMs) and Image Generation models.`);
            });
          </script>
          </body>
          </html>
          '''

          if __name__ == "__main__":
              uvicorn.run(app, host="0.0.0.0", port=PORT, log_level="info")
          PYEOF
          echo "✅ Server script written"

      - name: 🌐 Start web server
        run: |
          echo "──────────────────────────────────────────"
          echo " 🌐  Starting web UI"
          echo "──────────────────────────────────────────"
          nohup python ollama_server.py > /tmp/webui.log 2>&1 &
          echo $! > /tmp/webui.pid
          ready=false
          for i in $(seq 1 15); do
            if curl -sf "http://localhost:${PORT}" > /dev/null 2>&1; then
              echo "✅ Web UI is ready!"
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            echo "❌ Web UI failed to start. Last logs:"
            tail -n 50 /tmp/webui.log || true
            exit 1
          fi

      - name: 📦 Install cloudflared (macOS Darwin)
        run: |
          # دانلود بسته فشرده رسمی macOS ARM64 و اکسترکت مستقیم باینری
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz -o /tmp/cloudflared.tgz
          tar -xzf /tmp/cloudflared.tgz -C /tmp
          sudo mv /tmp/cloudflared /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared
          rm -f /tmp/cloudflared.tgz
          cloudflared --version

      - name: 🌐 Create tunnel and wait
        run: |
          echo "──────────────────────────────────────────"
          echo " 🌐  Creating Cloudflare tunnel"
          echo "──────────────────────────────────────────"
          cloudflared tunnel --url "http://127.0.0.1:${PORT}" --protocol http2 > tunnel.log 2>&1 &
          TUNNEL_PID=$!
          echo "⏳ Waiting for tunnel URL..."
          TUNNEL_URL=""
          for i in $(seq 1 30); do
            TUNNEL_URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' tunnel.log 2>/dev/null | head -1)
            [ -n "$TUNNEL_URL" ] && break
            sleep 2
          done
          if [ -z "$TUNNEL_URL" ]; then
            echo "❌ Could not get a tunnel URL. Tunnel log:"
            cat tunnel.log
            exit 1
          fi
          echo ""
          echo "╔═══════════════════════════════════════════════════════════════════╗"
          echo "║       🎉  Y O U R   M L X   S T U D I O   I S   R E A D Y  🎉    ║"
          echo "╠═══════════════════════════════════════════════════════════════════╣"
          echo "║  🔗  $TUNNEL_URL"
          echo "╚═══════════════════════════════════════════════════════════════════╝"
          {
            echo "## 🦙 Your LLM & Image Web UI is live"
            echo ""
            echo "**URL:** $TUNNEL_URL"
            echo ""
            echo "**Context:** ${CONTEXT_SIZE} tokens"
            echo "**Architecture:** Apple Silicon macOS (Native MLX Support)"
            echo ""
            echo "> This link stays live for as long as this job keeps running (up to the 6-hour timeout, or until you cancel the run)."
          } >> "$GITHUB_STEP_SUMMARY"
          wait "$TUNNEL_PID"

      - name: 🧹 Cleanup
        if: always()
        run: |
          pkill -f "cloudflared" 2>/dev/null || true
          pkill -f "python ollama_server" 2>/dev/null || true
          pkill -f "ollama serve" 2>/dev/null || true
          echo "✅ Cleanup complete"
